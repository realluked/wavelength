d:"pr",tab:"Practical",title:"Experimental skills",units:[{code:"P",title:"Practical skills",sub:"Planning, measuring, graphs and evaluating",lessons:["P1","P2","P3","P4"],guide:["Independent variable: what you change. Dependent variable: what you measure. Control variables: what you keep the same.","Choose at least five values over a sensible range, and repeat readings.","Read scales to the nearest half of the smallest division, with your eye level with the mark.","Correct for zero errors. Leave anomalous results out of averages.","Table headings: quantity / unit, e.g. length / cm. No units in the body of the table.","Graphs: labelled axes with units, a scale that uses most of the grid, a line of best fit, and a large triangle for the gradient.","Two results agree within experimental accuracy if they differ by less than about 10%.","Improvements must be specific: light gates instead of a stopwatch, insulating the beaker, repeating and averaging."]}]}),Object.assign(t,{P1:{name:"Variables & planning",ex:[{type:"teach",title:"Three kinds of variable",text:"Every investigation tests how one thing affects another.",table:[["Variable","Meaning","Pendulum example"],["Independent","The one you change","Length of the string"],["Dependent","The one you measure","Time for one swing (period)"],["Control","Kept the same, for a fair test","Mass of the bob, size of the swing"]],bullets:["An experiment is valid if it tests what it is meant to: only the independent and dependent variables change."]},{type:"match",q:"Match each word to its meaning.",pairs:[["Independent variable","The variable you change"],["Dependent variable","The variable you measure"],["Control variable","A variable you keep the same"]]},{type:"mc",q:"A student investigates how the height a ball is dropped from affects how high it bounces. What is the dependent variable?",options:["The bounce height","The drop height","The type of ball","The floor surface"],a:0},{type:"multi",q:"In that ball investigation, which should be control variables?",options:["The same ball","The same floor surface","The drop height","The bounce height"],correct:[0,1]},{type:"teach",title:"Choosing values",text:"A good plan uses:",bullets:["at least five values of the independent variable","a sensible range, evenly spread (for example 20 cm to 100 cm in steps of 20 cm)","repeat readings at each value, so you can average them and spot anomalies"]},{type:"mc",q:"Which set of lengths is best for a pendulum investigation?",options:["0.20, 0.40, 0.60, 0.80, 1.00 m","0.50 and 0.51 m","0.10, 0.11, 0.12 m","1 m only, repeated ten times"],a:0,why:"Five values, evenly spread over a wide range."},{type:"teach",title:"Hazards",text:"Name the hazard and a precaution:",table:[["Hazard","Precaution"],["Hot water could scald","Stand up, keep the beaker away from the bench edge, let it cool before moving"],["Heavy masses could fall on feet","Keep feet clear; use a clamp stand with a counterweight"],["A stretched spring could snap back","Wear eye protection"],["A wire could get very hot","Keep the current low; switch off between readings"]]},{type:"mc",q:"A student hangs heavy masses from a spring. What is the most sensible precaution?",options:["Keep feet away from under the masses","Wear gloves to keep warm","Use a stopwatch","Work in the dark"],a:0}]},P2:{name:"Measuring & errors",ex:[{type:"teach",title:"Reading instruments",text:"Get the most precise reading the instrument allows.",bullets:["Read to the nearest half of the smallest division where you can.","Put your eye level with the reading to avoid parallax error.","Check for a zero error: does it read zero with nothing to measure? If not, correct every reading.","Repeat readings and take an average."]},{type:"num",q:"What temperature does the thermometer show?",svg:{k:"thermo",v:23,min:0,max:50,step:1},a:23,unit:"\xb0C",tol:.5,work:["Each small division is 1 \xb0C.","The liquid stops at 23 \xb0C."]},{type:"num",q:"What current does the ammeter show?",svg:{k:"meter",v:.32,max:1,u:"A"},a:.32,unit:"A",tol:.015,work:["The scale goes from 0 to 1.0 A in steps of 0.02 A.","The needle points to 0.32 A."]},{type:"num",q:"A newton meter reads 0.2 N with nothing hanging on it. With a load it reads 3.4 N. What is the true weight of the load?",a:3.2,unit:"N",work:["zero error = +0.2 N","true reading = 3.4 \u2212 0.2 = 3.2 N"]},{type:"teach",title:"The language of measurement",text:"These words have exact meanings.",table:[["Word","Meaning"],["True value","The value you would get from a perfect measurement"],["Accuracy","How close a measurement is to the true value"],["Precision","How close repeated measurements are to each other"],["Repeatable","The same person, method and equipment give similar results"],["Reproducible","Different people, methods or equipment give similar results"],["Anomaly","A result that doesn\u2019t fit the pattern"]]},{type:"match",q:"Match each word to its meaning.",pairs:[["Accuracy","Close to the true value"],["Precision","Close to each other"],["Anomaly","A result outside the pattern"],["Reproducible","Similar results from a different method or person"]]},{type:"num",q:"Four timings: 2.34 s, 2.38 s, 2.91 s, 2.36 s. Ignore the anomaly and find the mean.",a:2.36,unit:"s",tol:.005,work:["2.91 s is the anomaly","mean = (2.34 + 2.38 + 2.36) \xf7 3","= 2.36 s"]},{type:"teach",title:"Random and systematic errors",text:"Errors come in two kinds.",bullets:["Random errors scatter readings above and below the true value (for example reaction time). Repeating and averaging reduces their effect.","Systematic errors shift every reading the same way (for example a zero error). Repeating does not help: you must correct the instrument or method."]},{type:"mc",q:"Every reading on a balance is 2 g too high. What kind of error is this?",options:["A systematic error","A random error","An anomaly","A parallax error that repeating will fix"],a:0}]},P3:{name:"Tables & graphs",ex:[{type:"teach",title:"Results tables",text:"Set your table out so it can be read without explanation.",bullets:["Headings give the quantity and the unit: length / cm, time / s.","No units in the body of the table.","Give each column a consistent number of decimal places, matching the instrument."]},{type:"mc",q:"Which is the best column heading?",options:["current / A","current","A","current (amps) measured"],a:0},{type:"teach",title:"Drawing a good graph",text:"Examiners check each of these:",bullets:["Axes labelled with quantity and unit.","A scale that is easy to read and uses more than half of the grid.","Points plotted accurately as small crosses.","A single line of best fit, straight or a smooth curve, with points scattered evenly either side. Never join the dots.","For a gradient, use a large triangle covering more than half the line."]},{type:"mc",q:"How should you draw a line through plotted results?",options:["A single line of best fit with points evenly either side","Join each point to the next with a ruler","Draw through the first and last points only","Draw a line through the origin always"],a:0},{type:"num",q:"The graph shows p.d. against current for a resistor. Find the gradient, which equals its resistance.",svg:{k:"graph",x:"current / A",y:"p.d. / V",xm:.5,ym:6,xs:.1,ys:1,lines:[{p:[[0,0],[.5,6]]}],pts:[[.1,1.2],[.2,2.3],[.3,3.7],[.4,4.8],[.5,6]]},a:12,unit:"\u03a9",work:["gradient = rise \xf7 run","= 6.0 \xf7 0.50","= 12 \u03a9"]},{type:"mc",q:"What does a straight line through the origin show?",options:["The two quantities are directly proportional","There is no relationship","One quantity is constant","The results are anomalous"],a:0},{type:"mc",q:"What is interpolation?",options:["Reading a value from the graph between your plotted points","Extending the line beyond your results","Joining the dots","Removing anomalies"],a:0,why:"Extending the line beyond the data is extrapolation."}]},P4:{name:"Conclusions & improvements",ex:[{type:"teach",title:"Writing a conclusion",text:"Describe what the results show, and back it up with data.",bullets:["Describe the pattern: as the length increases, the period increases.","If the graph is a straight line through the origin, say the quantities are directly proportional.",'Use "suggest" or "support", not "prove".']},{type:"teach",title:"Do two results agree?",text:"Two results agree within the limits of experimental accuracy if they are within about 10% of each other.",eq:"% difference = difference \xf7 value \xd7 100%"},{type:"mc",q:"Two values of a spring constant are 25.0 N/m and 27.0 N/m. Do they agree within experimental accuracy?",options:["Yes: the difference is 2.0, which is 8% of 25.0, less than 10%","No: they are not exactly equal","No: the difference is more than 10%","You can\u2019t tell without a graph"],a:0},{type:"teach",title:"Suggesting improvements",text:'Make improvements specific to the experiment. Vague answers like "be more careful" score nothing.',table:[["Problem","Improvement"],["Reaction time when using a stopwatch","Use light gates and a data logger"],["Energy lost to the surroundings","Insulate the beaker or block, and add a lid"],["Too few results","Take more readings over a wider range"],["Random errors","Repeat each reading and average"],["Hard to see when a swing starts","Use a fixed marker at the centre of the swing"]]},{type:"mc",q:"A student times a ball falling 1 m with a stopwatch. What is the best improvement?",options:["Use light gates connected to a data logger","Use a heavier ball","Time it more carefully","Drop it from 1 cm instead"],a:0},{type:"multi",q:"Which would improve an experiment to measure the specific heat capacity of a metal block?",options:["Wrap the block in insulation","Put oil in the thermometer hole for better thermal contact","Repeat and average the results","Use a smaller heater and stop timing early"],correct:[0,1,2]},{type:"mc",q:"Which conclusion is best?",options:["As the load increases, the extension increases proportionally, because the graph is a str  radius (m), T period (s)",t:"6.1",s:1},{id:"e-hub",n:"Hubble constant",e:"H\u2080 = v / d",v:"v recession speed, d distance; age \u2248 1/H\u2080",t:"6.2",s:1}],n=[{id:"d-speed",w:"Speed",d:"Distance travelled per unit time.",t:"1.2"},{id:"d-vel",w:"Velocity",d:"Speed in a given direction.",t:"1.2"},{id:"d-acc",w:"Acceleration",d:"Change in velocity per unit time.",t:"1.2",s:1},{id:"d-scalar",w:"Scalar and vector",d:"A scalar has magnitude only; a vector has magnitude and direction.",t:"1.1",s:1},{id:"d-mass",w:"Mass",d:"A measure of the quantity of matter in an object at rest relative to the observer.",t:"1.3"},{id:"d-weight",w:"Weight",d:"A gravitational force on an object that has mass.",t:"1.3"},{id:"d-gfs",w:"Gravitational field strength",d:"Force per unit mass.",t:"1.3"},{id:"d-dens",w:"Density",d:"Mass per unit volume.",t:"1.4"},{id:"d-k",w:"Spring constant",d:"Force per unit extension.",t:"1.5",s:1},{id:"d-lop",w:"Limit of proportionality",d:"The point beyond which extension is no longer proportional to load.",t:"1.5",s:1},{id:"d-moment",w:"Moment of a force",d:"Force \xd7 perpendicular distance from the pivot.",t:"1.5"},{id:"d-equil",w:"Equilibrium",d:"No resultant force and no resultant moment.",t:"1.5"},{id:"d-cog",w:"Centre of gravity",d:"The point through which all of an object\u2019s weight appears to act.",t:"1.5"},{id:"d-mom",w:"Momentum",d:"Mass \xd7 velocity.",t:"1.6",s:1},{id:"d-imp",w:"Impulse",d:"Force \xd7 time for which the force acts (equal to the change in momentum).",t:"1.6",s:1},{id:"d-resf",w:"Resultant force (from momentum)",d:"The change in momentum per unit time.",t:"1.6",s:1},{id:"d-work",w:"Work done",d:"Force \xd7 distance moved in the direction of the force; equal to the energy transferred.",t:"1.7"},{id:"d-power",w:"Power",d:"Work done per unit time, or energy transferred per unit time.",t:"1.7"},{id:"d-eff",w:"Efficiency",d:"Useful energy (or power) output \xf7 total energy (or power) input \xd7 100%.",t:"1.7",s:1},{id:"d-press",w:"Pressure",d:"Force per unit area.",t:"1.8"},{id:"d-abs",w:"Absolute zero",d:"\u2212273 \xb0C (0 K): the temperature at which particles have the least kinetic energy.",t:"2.1"},{id:"d-shc",w:"Specific heat capacity",d:"The energy required per unit mass per unit temperature increase.",t:"2.2",s:1},{id:"d-evap",w:"Evaporation",d:"The escape of more energetic particles from the surface of a liquid.",t:"2.2"},{id:"d-wl",w:"Wavelength",d:"The distance from one point on a wave to the same point on the next wave (crest to crest).",t:"3.1"},{id:"d-freq",w:"Frequency",d:"The number of waves passing a point per second.",t:"3.1"},{id:"d-amp",w:"Amplitude",d:"The maximum displacement from the rest position.",t:"3.1"},{id:"d-trans",w:"Transverse wave",d:"A wave whose vibrations are perpendicular to its direction of travel.",t:"3.1"},{id:"d-long",w:"Longitudinal wave",d:"A wave whose vibrations are parallel to its direction of travel.",t:"3.1"},{id:"d-crit",w:"Critical angle",d:"The angle of incidence that gives an angle of refraction of 90\xb0.",t:"3.2"},{id:"d-n",w:"Refractive index",d:"The ratio of the speed of light in a vacuum (or air) to its speed in the material.",t:"3.2",s:1},{id:"d-focal",w:"Focal length",d:"The distance from the centre of a lens to its principal focus.",t:"3.2"},{id:"d-mono",w:"Monochromatic light",d:"Light of a single frequency.",t:"3.2",s:1},{id:"d-ultra",w:"Ultrasound",d:"Sound with a frequency above 20 kHz.",t:"3.4"},{id:"d-mfield",w:"Magnetic field",d:"A region in which a magnetic pole experiences a force.",t:"4.1"},{id:"d-efield",w:"Electric field",d:"A region in which an electric charge experiences a force.",t:"4.2",s:1},{id:"d-current",w:"Electric current",d:"The charge passing a point per unit time.",t:"4.2",s:1},{id:"d-emf",w:"Electromotive force (e.m.f.)",d:"The electrical work done by a source in moving a unit charge around a complete circuit.",t:"4.2"},{id:"d-pd",w:"Potential difference (p.d.)",d:"The work done by a unit charge passing through a component.",t:"4.2"},{id:"d-kwh",w:"Kilowatt-hour",d:"The energy transferred by a 1 kW appliance in 1 hour.",t:"4.2"},{id:"d-iso",w:"Isotopes",d:"Atoms of the same element with the same proton number but different numbers of neutrons.",t:"5.1"},{id:"d-z",w:"Proton number (Z)",d:"The number of protons in the nucleus.",t:"5.1"},{id:"d-a",w:"Nucleon number (A)",d:"The number of protons plus neutrons in the nucleus.",t:"5.1"},{id:"d-bg",w:"Background radiation",d:"Ionising radiation that is always present, from natural and artificial sources.",t:"5.2"},{id:"d-half",w:"Half-life",d:"The time taken for half the nuclei of a sample of an isotope to decay.",t:"5.2"},{id:"d-ly",w:"Light-year",d:"The distance travelled by light through space in one year.",t:"6.2"},{id:"d-red",w:"Redshift",d:"An increase in the observed wavelength of light from stars or galaxies moving away from us.",t:"6.2"},{id:"d-hub",w:"Hubble constant",d:"The ratio of a galaxy\u2019s speed of recession to its distance from Earth.",t:"6.2",s:1},{id:"d-cmbr",w:"Cosmic microwave background radiation",d:"Microwave radiation of a particular frequency, received from every direction in space, left over from the early Universe.",t:"6.2",s:1}],i=[{id:"f-g",q:"Acceleration of free fall near the Earth",a:"about 9.8 m/s\xb2",t:"1.2"},{id:"f-water",q:"Density of water",a:"1.0 g/cm\xb3 = 1000 kg/m\xb3",t:"1.4"},{id:"f-melt",q:"Melting and boiling points of water at standard pressure",a:"0 \xb0C and 100 \xb0C",t:"2.2"},{id:"f-abs",q:"Absolute zero in \xb0C",a:"\u2212273 \xb0C",t:"2.1"},{id:"f-sound",q:"Speed of sound in air",a:"about 330 to 350 m/s",t:"3.4"},{id:"f-hear",q:"Range of human hearing",a:"20 Hz to 20 000 Hz",t:"3.4"},{id:"f-light",q:"Speed of electromagnetic waves in a vacuum",a:"3.0 \xd7 10\u2078 m/s",t:"3.3",s:1},{id:"f-em",q:"EM spectrum, increasing frequency",a:"radio, microwave, infrared, visible, ultraviolet, X-ray, gamma",t:"3.3"},{id:"f-col",q:"Colours of the visible spectrum, increasing frequency",a:"red, orange, yellow, green, blue, indigo, violet",t:"3.2"},{id:"f-alpha",q:"What stops alpha, beta and gamma?",a:"paper; a few mm of aluminium; thick lead or concrete (reduced)",t:"5.2"},{id:"f-bgs",q:"Four sources of background radiation",a:"radon gas, rocks and buildings, food and drink, cosmic rays",t:"5.2"},{id:"f-planets",q:"The planets in order from the Sun",a:"Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune",t:"6.1"},{id:"f-ly",q:"One light-year in metres",a:"9.5 \xd7 10\xb9\u2075 m",t:"6.2",s:1},{id:"f-mw",q:"Diameter of the Milky Way",a:"about 100 000 light-years",t:"6.2"},{id:"f-h0",q:"Current estimate of the Hubble constant",a:"2.2 \xd7 10\u207b\xb9\u2078 s\u207b\xb9",t:"6.2",s:1},{id:"f-day",q:"Times for Earth to spin, Earth to orbit, Moon to orbit",a:"about 24 hours; about 365 days; about one month",t:"6.1"}],o=[["Force","N"],["Energy","J"],["Power","W"],["Pressure","Pa"],["Charge","C"],["Current","A"],["Potential difference","V"],["Resistance","\u03a9"],["Frequency","Hz"],["Momentum","kg m/s",1],["Impulse","N s",1],["Moment","N m"],["Density","kg/m\xb3"],["Acceleration","m/s\xb2"],["Spring constant","N/m",1],["Specific heat capacity","J/(kg \xb0C)",1],["Gravitational field strength","N/kg"],["Speed","m/s"],["Mass","kg"],["Temperature (absolute)","K"],["Hubble constant","s\u207b\xb9",1],["Wavelength","m"],["Electrical energy (bills)","kWh"],["Count rate","counts/s"]],r=[["State","Give a short answer with no explanation."],["Define","Give the precise meaning, word for word if you can."],["Describe","Say what happens or what something is like. No reasons needed."],["Explain","Give reasons: say why or how, using physics ideas. Use \u201cbecause\u201d."],["Calculate","Work out a number. Show the equation, the substitution and the answer with a unit."],["Determine","Find a value, often from a graph or data you are given."],["Suggest","Apply your knowledge to an unfamiliar situation. More than one answer may be right."],["Sketch","Draw the general shape with labelled axes. Exact values aren\u2019t needed."],["Show that","Prove a given answer: write every step so the result is reached."],["Compare","Give similarities and differences, side by side."]],l=[{id:"m1",t:"1.1",q:"A student times 10 swings of a pendulum as 15.2 s. What is the period?",o:["1.52 s","15.2 s","0.66 s","152 s"],why:"15.2 \xf7 10 = 1.52 s."},{id:"m2",t:"1.1",s:1,q:"Which list contains only vector quantities?",o:["force, velocity, momentum","speed, mass, force","energy, acceleration, time","distance, weight, temperature"],why:"Speed, mass, energy, time, distance and temperature are scalars."},{id:"m3",t:"1.1",s:1,q:"Forces of 5 N and 12 N act at right angles. What is the size of the resultant?",o:["13 N","17 N","7 N","60 N"],why:"\u221a(5\xb2 + 12\xb2) = \u221a169 = 13 N."},{id:"m4",t:"1.2",q:"A bus travels 36 km in 30 minutes. What is its average speed?",o:["72 km/h","1.2 km/h","18 km/h","1080 km/h"],why:"36 km in 0.5 h = 72 km/h."},{id:"m5",t:"1.2",q:"On a distance\u2013time graph, what does a horizontal line show?",o:["The object is at rest","Constant speed","Constant acceleration","Deceleration"],why:"The distance is not changing."},{id:"m6",t:"1.2",q:"A car moves at 15 m/s for 8.0 s. How far does it travel?",o:["120 m","1.9 m","23 m","0.53 m"],why:"s = vt = 15 \xd7 8.0 = 120 m."},{id:"m7",t:"1.2",q:"What does the area under a speed\u2013time graph represent?",o:["Distance travelled","Acceleration","Speed","Time taken"],why:"Speed \xd7 time = distance."},{id:"m8",t:"1.2",s:1,q:"A runner accelerates from 2.0 m/s to 8.0 m/s in 3.0 s. What is her acceleration?",o:["2.0 m/s\xb2","3.3 m/s\xb2","18 m/s\xb2","0.50 m/s\xb2"],why:"a = (8.0 \u2212 2.0) \xf7 3.0 = 2.0 m/s\xb2."},{id:"m9",t:"1.2",s:1,q:"A skydiver reaches terminal velocity. Which statement is correct?",o:["The air resistance equals the weight","The air resistance is zero","The weight is greater than the air resistance","The acceleration is 9.8 m/s\xb2"],why:"Balanced forces: no resultant, so constant velocity."},{id:"m10",t:"1.2",s:1,q:"On a speed\u2013time graph, a straight line slopes downwards. What does it show?",o:["Constant deceleration","Increasing acceleration","The object is at rest","Constant speed"],why:"A straight slope is a constant gradient; downwards means slowing down."},{id:"m11",t:"1.3",q:"An object has a mass of 4.0 kg on Earth (g = 9.8 N/kg). What is its weight?",o:["39 N","4.0 N","2.5 N","0.41 N"],why:"W = mg = 4.0 \xd7 9.8 = 39.2 N."},{id:"m12",t:"1.3",q:"An astronaut takes a rock from the Earth to the Moon. What happens to its mass and weight?",o:["Mass stays the same; weight decreases","Both decrease","Mass decreases; weight stays the same","Both stay the same"],why:"Mass is the quantity of matter; weight depends on the field."},{id:"m13",t:"1.4",q:"A block has mass 600 g and volume 240 cm\xb3. What is its density?",o:["2.5 g/cm\xb3","0.40 g/cm\xb3","144 000 g/cm\xb3","840 g/cm\xb3"],why:"\u03c1 = 600 \xf7 240 = 2.5 g/cm\xb3."},{id:"m14",t:"1.4",q:"How can you find the volume of an irregular stone that sinks?",o:["Measure the rise in water level when it is lowered into a measuring cylinder","Weigh it on a balance","Measure its length with a ruler and cube it","Time how long it takes to sink"],why:"This is the displacement method."},{id:"m15",t:"1.4",s:1,q:"Liquid X (0.8 g/cm\xb3) and liquid Y (1.2 g/cm\xb3) do not mix. What happens when both are poured into a beaker?",o:["X floats on top of Y","Y floats on top of X","They mix evenly","Both sink"],why:"The less dense liquid floats."},{id:"m16",t:"1.5",q:"Forces of 30 N to the right and 45 N to the left act on a box. What is the resultant force?",o:["15 N to the left","15 N to the right","75 N to the left","75 N to the right"],why:"45 \u2212 30 = 15 N, in the direction of the bigger force."},{id:"m17",t:"1.5",q:"A spring is 8.0 cm long. A load stretches it to 11.0 cm. What is the extension?",o:["3.0 cm","11.0 cm","19.0 cm","8.0 cm"],why:"11.0 \u2212 8.0 = 3.0 cm."},{id:"m18",t:"1.5",s:1,q:"A spring has a spring constant of 40 N/m. What force gives an extension of 0.050 m?",o:["2.0 N","800 N","0.0013 N","40 N"],why:"F = kx = 40 \xd7 0.050 = 2.0 N."},{id:"m19",t:"1.5",s:1,q:"A resultant force of 600 N acts on a 150 kg motorbike. What is its acceleration?",o:["4.0 m/s\xb2","0.25 m/s\xb2","90 000 m/s\xb2","750 m/s\xb2"],why:"a = F \xf7 m = 600 \xf7 150 = 4.0 m/s\xb2."},{id:"m20",t:"1.5",q:"A 20 N force acts 0.30 m from a pivot, at right angles. What is its moment?",o:["6.0 N m","67 N m","0.015 N m","20.3 N m"],why:"20 \xd7 0.30 = 6.0 N m."},{id:"m21",t:"1.5",q:"A uniform beam balances on a pivot. A 300 N weight is 2.0 m to the left of the pivot. What weight 1.5 m to the right balances it?",o:["400 N","225 N","450 N","300 N"],why:"300 \xd7 2.0 = 600 N m; 600 \xf7 1.5 = 400 N."},{id:"m22",t:"1.5",q:"Which change makes a vase on a shelf more stable?",o:["Making its base wider","Making it taller","Putting heavy sand near the top","Making its base narrower"],why:"A wide base and low centre of gravity improve stability."},{id:"m23",t:"1.5",q:"A car travels at a constant speed in a straight line. What is the resultant force on it?",o:["Zero","Equal to the driving force","Equal to its weight","Forwards"],why:"Constant velocity means no resultant force."},{id:"m24",t:"1.5",s:1,q:"A car goes round a bend at constant speed. Which way does the resultant force act?",o:["Towards the centre of the bend","Forwards","Backwards","Away from the centre"],why:"A force at right angles to the velocity, towards the centre, changes the direction."},{id:"m25",t:"1.6",s:1,q:"A 0.50 kg ball moves at 6.0 m/s. What is its momentum?",o:["3.0 kg m/s","12 kg m/s","9.0 kg m/s","0.083 kg m/s"],why:"p = mv = 0.50 \xd7 6.0 = 3.0 kg m/s."},{id:"m26",t:"1.6",s:1,q:"A 2.0 kg trolley at 4.0 m/s hits and sticks to a stationary 2.0 kg trolley. What is their speed afterwards?",o:["2.0 m/s","4.0 m/s","8.0 m/s","1.0 m/s"],why:"8.0 kg m/s shared by 4.0 kg: 2.0 m/s."},{id:"m27",t:"1.6",s:1,q:"A force of 50 N acts on a ball for 0.20 s. What is the change in its momentum?",o:["10 kg m/s","250 kg m/s","0.004 kg m/s","50 kg m/s"],why:"Impulse = F\u0394t = 50 \xd7 0.20 = 10 N s."},{id:"m28",t:"1.7",q:"Which is an example of energy stored in the gravitational potential store?",o:["Water held behind a dam","A moving train","A compressed spring","A charged battery"],why:"Raised objects store gravitational potential energy."},{id:"m29",t:"1.7",q:"A force of 25 N pushes a box 6.0 m. How much work is done?",o:["150 J","4.2 J","31 J","0.24 J"],why:"W = Fd = 25 \xd7 6.0 = 150 J."},{id:"m30",t:"1.7",q:"A motor transfers 4800 J in 60 s. What is its power?",o:["80 W","288 000 W","0.013 W","4860 W"],why:"P = E \xf7 t = 4800 \xf7 60 = 80 W."},{id:"m31",t:"1.7",s:1,q:"A 1000 kg car travels at 20 m/s. What is its kinetic energy?",o:["200 000 J","20 000 J","10 000 J","400 000 J"],why:"\xbd \xd7 1000 \xd7 20\xb2 = 200 000 J."},{id:"m32",t:"1.7",s:1,q:"A lamp takes in 60 J and gives out 9 J of light. What is its efficiency?",o:["15%","85%","6.7%","51%"],why:"9 \xf7 60 \xd7 100% = 15%."},{id:"m33",t:"1.7",s:1,q:"A 2.0 kg book is lifted 1.5 m (g = 9.8 N/kg). What is the gain in gravitational potential energy?",o:["29 J","3.0 J","15 J","1.3 J"],why:"mg\u0394h = 2.0 \xd7 9.8 \xd7 1.5 = 29.4 J."},{id:"m34",t:"1.7",q:"Which energy resource is renewable?",o:["Hydroelectric","Coal","Natural gas","Uranium"],why:"Rainfall refills the reservoir."},{id:"m35",t:"1.7",q:"In a coal-fired power station, what turns the generator?",o:["A turbine driven by steam","Burning coal directly","Solar cells","Moving water from a dam"],why:"Boiler \u2192 steam \u2192 turbine \u2192 generator."},{id:"m36",t:"1.7",s:1,q:"Which energy resource does NOT come from the Sun\u2019s radiation?",o:["Geothermal","Wind","Biofuel","Hydroelectric"],why:"Geothermal energy comes from hot rocks inside the Earth."},{id:"m37",t:"1.8",q:"A force of 200 N acts on an area of 0.50 m\xb2. What is the pressure?",o:["400 Pa","100 Pa","200.5 Pa","0.0025 Pa"],why:"p = F \xf7 A = 200 \xf7 0.50 = 400 Pa."},{id:"m38",t:"1.8",q:"Why does a camel have wide feet?",o:["To spread its weight and reduce the pressure on sand","To increase the pressure on sand","To reduce its weight","To increase friction"],why:"Bigger area, smaller pressure."},{id:"m39",t:"1.8",s:1,q:"What is the pressure due to 2.0 m of water? (\u03c1 = 1000 kg/m\xb3, g = 9.8 N/kg)",o:["19 600 Pa","2000 Pa","9800 Pa","4900 Pa"],why:"\u03c1g\u0394h = 1000 \xd7 9.8 \xd7 2.0 = 19 600 Pa."},{id:"m40",t:"2.1",q:"In which state are particles close together but able to move past each other?",o:["Liquid","Solid","Gas","All three"],why:"Liquids flow because their particles slide past each other."},{id:"m41",t:"2.1",q:"What does Brownian motion show?",o:["Particles of a gas or liquid move randomly and hit visible particles","Smoke particles are alive","Gases expand when heated","Heat rises"],why:"Random collisions with fast, invisible molecules."},{id:"m42",t:"2.1",q:"What is 50 \xb0C in kelvin?",o:["323 K","223 K","\u2212223 K","50 K"],why:"50 + 273 = 323 K."},{id:"m43",t:"2.1",q:"A sealed container of gas is heated. Why does the pressure rise?",o:["The particles move faster and hit the walls harder and more often","The particles get larger","The container shrinks","The number of particles increases"],why:"More energetic collisions with the walls."},{id:"m44",t:"2.1",s:1,q:"A gas is compressed slowly from 60 cm\xb3 to 20 cm\xb3 at constant temperature. Its pressure was 100 kPa. What is the new pressure?",o:["300 kPa","33 kPa","120 kPa","200 kPa"],why:"p\u2082 = 100 \xd7 60 \xf7 20 = 300 kPa."},{id:"m45",t:"2.2",q:"Why are gaps left between sections of railway track?",o:["To allow the steel to expand in hot weather","To drain rainwater","To make the train quieter","To save steel"],why:"Without gaps, expanding rails would buckle."},{id:"m46",t:"2.2",s:1,q:"How much energy raises 0.50 kg of water by 20 \xb0C? (c = 4200 J/(kg \xb0C))",o:["42 000 J","21 000 J","84 000 J","2100 J"],why:"0.50 \xd7 4200 \xd7 20 = 42 000 J."},{id:"m47",t:"2.2",q:"While ice is melting at 0 \xb0C, what happens to its temperature as it is heated?",o:["It stays at 0 \xb0C","It rises steadily","It falls","It jumps to 100 \xb0C"],why:"The energy is used to change state, not to raise the temperature."},{id:"m48",t:"2.2",q:"Why does a liquid cool as it evaporates?",o:["The most energetic particles escape from its surface","The least energetic particles escape","Air molecules enter the liquid","It loses mass, so it gets colder"],why:"The average kinetic energy of the particles left behind falls."},{id:"m49",t:"2.2",s:1,q:"Which change would NOT increase the rate of evaporation of water from a dish?",o:["Putting a lid on the dish","Heating the water","Using a wider dish","Blowing air across it"],why:"A lid stops vapour escaping."},{id:"m50",t:"2.3",q:"Which surface is the best absorber of infrared radiation?",o:["Dull black","Shiny silver","Shiny white","Dull white"],why:"Dull black absorbs and emits best."},{id:"m51",t:"2.3",q:"How does thermal energy reach the Earth from the Sun?",o:["Radiation","Conduction","Convection","Evaporation"],why:"Only radiation can cross the vacuum of space."},{id:"m52",t:"2.3",q:"A heater is placed near the floor of a room. Which process warms the whole room?",o:["Convection","Conduction","Radiation only","Evaporation"],why:"Warm air rises and cooler air sinks."},{id:"m53",t:"2.3",s:1,q:"Why are metals good thermal conductors?",o:["They contain free electrons that transfer energy","Their atoms do not vibrate","They are very dense","They have a high melting point"],why:"Free (delocalised) electrons carry energy quickly."},{id:"m54",t:"3.1",q:"A wave has a frequency of 4.0 Hz and a wavelength of 2.5 m. What is its speed?",o:["10 m/s","1.6 m/s","0.63 m/s","6.5 m/s"],why:"v = f\u03bb = 4.0 \xd7 2.5 = 10 m/s."},{id:"m55",t:"3.1",q:"Which wave is longitudinal?",o:["Sound","Light","A water ripple","An X-ray"],why:"Sound vibrations are along the direction of travel."},{id:"m56",t:"3.1",q:"What is the amplitude of a wave?",o:["The maximum displacement from the rest position","The distance between two crests","The number of waves per second","The speed of the wave"],why:"Amplitude is measured from the middle to a crest."},{id:"m57",t:"3.1",q:"Water waves move from deep to shallow water. What happens to their speed and wavelength?",o:["Both decrease","Both increase","Speed decreases; wavelength increases","Neither changes"],why:"Frequency is fixed, so a lower speed means a shorter wavelength."},{id:"m58",t:"3.1",s:1,q:"Waves pass through a gap. When is the diffraction greatest?",o:["When the gap is about the same size as the wavelength","When the gap is much bigger than the wavelength","When the waves have a high amplitude","When the gap is in deep water"],why:"Gap \u2248 wavelength gives the most spreading."},{id:"m59",t:"3.2",q:"A ray strikes a plane mirror with an angle of incidence of 40\xb0. What is the angle between the reflected ray and the mirror?",o:["50\xb0","40\xb0","80\xb0","90\xb0"],why:"r = 40\xb0 from the normal, so 90\xb0 \u2212 40\xb0 = 50\xb0 from the mirror."},{id:"m60",t:"3.2",q:"Which describes the image in a plane mirror?",o:["Virtual, same size, as far behind the mirror as the object is in front","Real and inverted","Virtual and magnified","Real and the same size"],why:"Plane mirror images are virtual, upright and the same size."},{id:"m61",t:"3.2",q:"Light passes from air into glass at an angle. What happens?",o:["It slows down and bends towards the normal","It speeds up and bends towards the normal","It slows down and bends away from the normal","It speeds up and does not bend"],why:"Glass is optically denser than air."},{id:"m62",t:"3.2",s:1,q:"Light enters glass with i = 50\xb0 and r = 30\xb0. What is the refractive index? (sin 50\xb0 = 0.77, sin 30\xb0 = 0.50)",o:["1.5","0.65","1.7","0.60"],why:"0.77 \xf7 0.50 = 1.5."},{id:"m63",t:"3.2",s:1,q:"A material has a critical angle of 30\xb0. What is its refractive index?",o:["2.0","0.50","1.5","1.2"],why:"n = 1 \xf7 sin 30\xb0 = 1 \xf7 0.50 = 2.0."},{id:"m64",t:"3.2",q:"An object is placed beyond 2F of a converging lens. What is the image like?",o:["Real, inverted, diminished","Virtual, upright, magnified","Real, upright, magnified","Virtual, inverted, diminished"],why:"This is how a camera works."},{id:"m65",t:"3.2",s:1,q:"Which lens corrects short sight?",o:["Diverging","Converging","A plane glass sheet","A prism"],why:"A diverging lens moves the focus back onto the retina."},{id:"m66",t:"3.2",q:"White light passes through a prism. Which colour is refracted the most?",o:["Violet","Red","Yellow","Green"],why:"Violet has the highest frequency and bends most."},{id:"m67",t:"3.3",q:"Which electromagnetic wave has the highest frequency?",o:["Gamma rays","Radio waves","Visible light","Infrared"],why:"Gamma is at the high-frequency end."},{id:"m68",t:"3.3",q:"Which waves are used for thermal imaging?",o:["Infrared","Ultraviolet","X-rays","Microwaves"],why:"Warm objects give out infrared."},{id:"m69",t:"3.3",q:"Which electromagnetic radiation can cause skin cancer?",o:["Ultraviolet","Radio waves","Microwaves","Infrared"],why:"Ultraviolet damages surface cells."},{id:"m70",t:"3.3",s:1,q:"Why can digital signals be sent over long distances without losing quality?",o:["They can be regenerated accurately, removing noise","They never pick up noise","They travel faster than analogue signals","They have a lower frequency"],why:"Repeaters restore the clean 1s and 0s."},{id:"m71",t:"3.3",s:1,q:"What is the speed of light in a vacuum?",o:["3.0 \xd7 10\u2078 m/s","340 m/s","3.0 \xd7 10\u2075 m/s","1500 m/s"],why:"All EM waves travel at 3.0 \xd7 10\u2078 m/s in a vacuum."},{id:"m72",t:"3.4",q:"What is the approximate range of human hearing?",o:["20 Hz to 20 000 Hz","2 Hz to 2000 Hz","200 Hz to 200 000 Hz","20 kHz to 200 kHz"],why:"Above 20 kHz is ultrasound."},{id:"m73",t:"3.4",q:"A sound gets louder but its pitch stays the same. What has changed?",o:["Its amplitude has increased","Its frequency has increased","Its speed has increased","Its wavelength has decreased"],why:"Loudness depends on amplitude; pitch on frequency."},{id:"m74",t:"3.4",q:"An echo returns 2.0 s after a shout. Sound travels at 340 m/s. How far away is the cliff?",o:["340 m","680 m","170 m","1360 m"],why:"The sound travels 680 m there and back, so the cliff is 340 m away."},{id:"m75",t:"3.4",s:1,q:"In which material does sound travel fastest?",o:["Steel","Water","Air","A vacuum"],why:"Fastest in solids, and not at all in a vacuum."},{id:"m76",t:"4.1",q:"Which material would make the best permanent magnet?",o:["Steel","Soft iron","Copper","Aluminium"],why:"Steel keeps its magnetism."},{id:"m77",t:"4.1",q:"Which statement about magnetic field lines around a bar magnet is correct?",o:["They point from the N pole to the S pole","They point from the S pole to the N pole","They cross each other near the poles","They are evenly spaced everywhere"],why:"Outside the magnet, lines go N to S."},{id:"m78",t:"4.2",q:"A polythene rod is rubbed with a cloth and becomes negatively charged. What has happened?",o:["Electrons have moved from the cloth to the rod","Protons have moved from the rod to the cloth","Electrons have moved from the rod to the cloth","Positive charge has been destroyed"],why:"Only electrons move when insulators are rubbed."},{id:"m79",t:"4.2",q:"What is the resistance of a lamp with 6.0 V across it and 0.40 A through it?",o:["15 \u03a9","2.4 \u03a9","0.067 \u03a9","6.4 \u03a9"],why:"R = V \xf7 I = 6.0 \xf7 0.40 = 15 \u03a9."},{id:"m80",t:"4.2",s:1,q:"A current of 3.0 A flows for 20 s. How much charge passes?",o:["60 C","6.7 C","0.15 C","23 C"],why:"Q = It = 3.0 \xd7 20 = 60 C."},{id:"m81",t:"4.2",q:"A 230 V kettle draws 8.0 A. What is its power?",o:["1840 W","28.8 W","0.035 W","238 W"],why:"P = IV = 8.0 \xd7 230 = 1840 W."},{id:"m82",t:"4.2",q:"A 3.0 kW heater runs for 2.0 hours. Electricity costs 20 cents per kWh. What is the cost?",o:["120 cents","60 cents","30 cents","12 cents"],why:"3.0 \xd7 2.0 = 6.0 kWh; 6.0 \xd7 20 = 120 cents."},{id:"m83",t:"4.2",s:1,q:"What happens to the resistance of a filament lamp as the current through it increases?",o:["It increases, because the filament gets hotter","It decreases","It stays constant","It becomes zero"],why:"That is why its I\u2013V graph curves."},{id:"m84",t:"4.2",q:"Two wires are made of the same metal. Which has the lowest resistance?",o:["Short and thick","Long and thin","Long and thick","Short and thin"],why:"Resistance rises with length and falls with thickness."},{id:"m85",t:"4.3",q:"What is the combined resistance of 10 \u03a9 and 15 \u03a9 in series?",o:["25 \u03a9","6.0 \u03a9","150 \u03a9","5 \u03a9"],why:"Series: add them."},{id:"m86",t:"4.3",s:1,q:"What is the combined resistance of two 10 \u03a9 resistors in parallel?",o:["5.0 \u03a9","20 \u03a9","10 \u03a9","0.20 \u03a9"],why:"1/R = 1/10 + 1/10 = 2/10, so R = 5.0 \u03a9."},{id:"m87",t:"4.3",q:"In a series circuit, what is true about the current?",o:["It is the same at every point","It is largest near the cell","It is shared between the components","It is zero after the first lamp"],why:"There is only one path."},{id:"m88",t:"4.3",q:"The temperature of an NTC thermistor rises. What happens to its resistance?",o:["It decreases","It increases","It stays the same","It doubles"],why:"NTC: negative temperature coefficient."},{id:"m89",t:"4.3",s:1,q:"A potential divider has R\u2081 = 2.0 k\u03a9 and R\u2082 = 6.0 k\u03a9 across 12 V. What is the p.d. across R\u2082?",o:["9.0 V","3.0 V","6.0 V","12 V"],why:"R\u2082 is 6/8 of the total: 6/8 \xd7 12 = 9.0 V."},{id:"m90",t:"4.3",s:1,q:"Current of 2.0 A flows into a junction. One branch carries 0.5 A out. What does the other branch carry?",o:["1.5 A","2.5 A","0.5 A","4.0 A"],why:"Current in = current out."},{id:"m91",t:"4.4",q:"Why is a fuse placed in the live wire?",o:["So that when it melts, the appliance is disconnected from the live voltage","To earth the appliance","So the appliance uses less power","To increase the current"],why:"A fuse in the neutral would leave the appliance live."},{id:"m92",t:"4.4",q:"An appliance draws 2.5 A normally. Fuses of 1 A, 3 A, 5 A and 13 A are available. Which should be used?",o:["3 A","1 A","5 A","13 A"],why:"Just above the normal current."},{id:"m93",t:"4.5",q:"Which change would NOT increase the e.m.f. induced by moving a magnet into a coil?",o:["Moving the magnet more slowly","Using a stronger magnet","Using more turns on the coil","Moving the magnet faster"],why:"Slower motion means a slower change, so a smaller e.m.f."},{id:"m94",t:"4.5",q:"A transformer has 200 turns on the primary and 50 on the secondary. The input is 240 V. What is the output?",o:["60 V","960 V","240 V","48 V"],why:"V\u209b = 240 \xd7 50 \xf7 200 = 60 V."},{id:"m95",t:"4.5",q:"Why is electricity transmitted at a high voltage?",o:["The current is lower, so less energy is wasted heating the cables","High voltage is safer","It travels faster","Homes use high voltage"],why:"Lower current means less heating loss."},{id:"m96",t:"4.5",s:1,q:"What is the purpose of the split-ring commutator in a d.c. motor?",o:["To reverse the current in the coil every half turn","To make alternating current","To strengthen the magnetic field","To reduce friction"],why:"It keeps the coil turning the same way."},{id:"m97",t:"4.5",s:1,q:"Using Fleming\u2019s left-hand rule, what does the thumb represent?",o:["The force (motion)","The current","The magnetic field","The e.m.f."],why:"thuMb Motion, First finger Field, seCond finger Current."},{id:"m98",t:"4.5",q:"What is the shape of the magnetic field around a long straight wire carrying a current?",o:["Concentric circles around the wire","Straight lines parallel to the wire","The same as a bar magnet","There is no field"],why:"The field lines circle the wire."},{id:"m99",t:"4.5",s:1,q:"An ideal transformer has 240 V and 0.50 A in the primary. The secondary voltage is 12 V. What is the secondary current?",o:["10 A","0.025 A","120 A","0.50 A"],why:"I\u209bV\u209b = I\u209aV\u209a: I\u209b = 240 \xd7 0.50 \xf7 12 = 10 A."},{id:"m100",t:"5.1",q:"How many neutrons are in {{37|17|Cl}}?",o:["20","17","37","54"],why:"37 \u2212 17 = 20."},{id:"m101",t:"5.1",q:"What do isotopes of an element have in common?",o:["The same number of protons","The same number of neutrons","The same nucleon number","The same mass"],why:"Same element, so same proton number."},{id:"m102",t:"5.1",s:1,q:"In the alpha scattering experiment, what did the few alpha particles that bounced straight back show?",o:["The nucleus is very small and contains most of the mass","The atom is mostly empty space","Electrons are negative","Gold is radioactive"],why:"Only a tiny, massive, positive centre could turn them back."},{id:"m103",t:"5.2",q:"Which radiation is stopped by a sheet of paper?",o:["Alpha","Beta","Gamma","All three"],why:"Alpha is the least penetrating."},{id:"m104",t:"5.2",q:"Which is a source of background radiation?",o:["Radon gas","Mobile phones","Microwave ovens","Light bulbs"],why:"Radon seeps from rocks; the others are not ionising."},{id:"m105",t:"5.2",q:"A source has a half-life of 3 hours. Its count rate is 640 counts/min. What will it be after 9 hours?",o:["80 counts/min","213 counts/min","160 counts/min","0 counts/min"],why:"3 half-lives: 640 \u2192 320 \u2192 160 \u2192 80."},{id:"m106",t:"5.2",s:1,q:"{{90|38|Sr}} decays by beta emission. What is the new nucleus?",o:["{{90|39|Y}}","{{90|37|Rb}}","{{86|36|Kr}}","{{89|38|Sr}}"],why:"Beta: Z goes up by 1, A stays the same."},{id:"m107",t:"5.2",s:1,q:"{{210|84|Po}} emits an alpha particle. What are the nucleon and proton numbers of the new nucleus?",o:["206 and 82","210 and 82","206 and 84","208 and 83"],why:"Alpha: A \u2212 4, Z \u2212 2."},{id:"m108",t:"5.2",s:1,q:"Which radiation is NOT deflected by a magnetic field?",o:["Gamma","Alpha","Beta","All are deflected"],why:"Gamma has no charge."},{id:"m109",t:"5.2",s:1,q:"Which isotope is best as a medical tracer injected into a patient?",o:["A gamma emitter with a half-life of 6 hours","An alpha emitter with a half-life of 6 hours","A gamma emitter with a half-life of 30 years","A beta emitter with a half-life of 5000 years"],why:"Gamma escapes the body to be detected; a short half-life limits the dose."},{id:"m110",t:"5.2",q:"Why should radioactive sources be handled with long tongs?",o:["To keep them at a distance from the body","To keep them warm","To stop them decaying","To make them less radioactive"],why:"More distance means less exposure."},{id:"m111",t:"6.1",q:"What causes the seasons on Earth?",o:["The tilt of the Earth\u2019s axis","The Earth\u2019s distance from the Sun","The Moon\u2019s orbit","The Earth spinning on its axis"],why:"Each hemisphere leans towards the Sun for part of the year."},{id:"m112",t:"6.1",q:"Which planet is the largest?",o:["Jupiter","Saturn","Earth","Neptune"],why:"Jupiter is the largest of the gas giants."},{id:"m113",t:"6.1",q:"Light takes about 500 s to reach the Earth from the Sun. Which is closest to the Sun\u2013Earth distance? (light: 3.0 \xd7 10\u2078 m/s)",o:["1.5 \xd7 10\xb9\xb9 m","1.5 \xd7 10\u2078 m","6.0 \xd7 10\u2075 m","1.5 \xd7 10\xb9\u2074 m"],why:"3.0 \xd7 10\u2078 \xd7 500 = 1.5 \xd7 10\xb9\xb9 m."},{id:"m114",t:"6.1",s:1,q:"Where in its elliptical orbit is a planet moving fastest?",o:["Closest to the Sun","Furthest from the Sun","It moves at a constant speed","Halfway along the orbit"],why:"Gravitational potential energy becomes kinetic energy as it gets closer."},{id:"m115",t:"6.2",q:"What is a light-year?",o:["The distance light travels in one year","The time light takes to cross the Milky Way","The age of a star","A unit of brightness"],why:"It is a distance, not a time."},{id:"m116",t:"6.2",q:"What does the redshift of light from distant galaxies suggest?",o:["The Universe is expanding","Galaxies are getting closer","Stars are cooling down","The Sun is a red giant"],why:"Redshift means the galaxies are moving away."},{id:"m117",t:"6.2",s:1,q:"What happens to a star much more massive than the Sun at the end of its life?",o:["It becomes a red supergiant and explodes as a supernova","It becomes a white dwarf directly","It becomes a planetary nebula only","It shrinks into a planet"],why:"It may leave a neutron star or a black hole."},{id:"m118",t:"6.2",s:1,q:"Which process powers a stable star?",o:["Fusion of hydrogen into helium","Fission of uranium","Burning of coal","Radioactive decay of helium"],why:"Stable stars fuse hydrogen nuclei."}],c=[{id:"q1",t:"1.2",title:"A cyclist\u2019s ride",intro:"The speed\u2013time graph shows a cyclist\u2019s ride.",svg:{k:"graph",x:"time / s",y:"speed / m/s",xm:40,ym:10,xs:10,ys:2,lines:[{p:[[0,0],[10,8],[30,8],[40,0]]}]},parts:[{n:"(a)",m:1,kind:"text",q:"Describe the motion of the cyclist between 10 s and 30 s.",pts:[{t:"Constant (steady) speed",k:["constant","steady","uniform","same speed"]}],model:"She moves at a constant speed of 8 m/s."},{n:"(b)",m:2,kind:"num",s:1,q:"Calculate the acceleration during the first 10 s.",a:.8,unit:"m/s\xb2",work:["a = \u0394v / \u0394t","= 8 \xf7 10","= 0.80 m/s\xb2"]},{n:"(c)",m:3,kind:"num",q:"Calculate the total distance travelled.",a:240,unit:"m",work:["0\u201310 s: \xbd \xd7 10 \xd7 8 = 40 m","10\u201330 s: 20 \xd7 8 = 160 m","30\u201340 s: \xbd \xd7 10 \xd7 8 = 40 m","total = 240 m"]},{n:"(d)",m:2,kind:"num",q:"Calculate the average speed for the whole ride.",a:6,unit:"m/s",work:["average speed = total distance \xf7 total time","= 240 \xf7 40","= 6.0 m/s"]},{n:"(e)",m:2,kind:"num",s:1,q:"The cyclist and bike have a total mass of 80 kg. Calculate the size of the resultant force between 30 s and 40 s.",a:64,unit:"N",work:["a = (0 \u2212 8) \xf7 10 = \u22120.80 m/s\xb2","F = ma = 80 \xd7 0.80","= 64 N (backwards)"]}]},{id:"q2",t:"1.6",title:"Colliding trolleys",intro:"Trolley A (mass 1.5 kg) moves at 4.0 m/s towards trolley B (mass 0.50 kg), which is at rest. They collide and stick together.",parts:[{n:"(a)",m:1,kind:"text",s:1,q:"State the principle of conservation of momentum.",pts:[{t:"Total momentum before = total momentum after (when no external forces act)",k:["before+after","conserved","stays the same","remains constant"]}],model:"When no external forces act, the total momentum before a collision equals the total momentum after it."},{n:"(b)",m:1,kind:"num",s:1,q:"Calculate the momentum of trolley A before the collision.",a:6,unit:"kg m/s",work:["p = mv = 1.5 \xd7 4.0","= 6.0 kg m/s"]},{n:"(c)",m:2,kind:"num",s:1,q:"Calculate the velocity of the trolleys after the collision.",a:3,unit:"m/s",work:["total momentum after = 6.0 kg m/s","(1.5 + 0.50) \xd7 v = 6.0","v = 3.0 m/s"]},{n:"(d)",m:2,kind:"num",s:1,q:"The collision lasts 0.12 s. Calculate the average force on trolley B.",a:12.5,unit:"N",work:["change in B\u2019s momentum = 0.50 \xd7 3.0 = 1.5 kg m/s","F = \u0394p \xf7 \u0394t = 1.5 \xf7 0.12","= 12.5 N"]},{n:"(e)",m:2,kind:"text",q:"State two effects that a resultant force can have on a moving trolley.",pts:[{t:"Change its speed",k:["speed","faster","slower","accelerat","decelerat","slow"]},{t:"Change its direction",k:["direction"]}],model:"It can change the trolley\u2019s speed and it can change its direction."},{n:"(f)",m:1,kind:"text",q:"After the collision there is no friction. Explain why the trolleys keep moving at a constant velocity.",pts:[{t:"There is no resultant force",k:["no resultant","resultant force+zero","balanced","no force","no friction"]}],model:"There is no resultant force on them, so their velocity does not change."}]},{id:"q3",t:"1.7",title:"A crane at work",intro:"A crane lifts a load of mass 600 kg through a height of 15 m in 30 s. (g = 9.8 N/kg)",parts:[{n:"(a)",m:1,kind:"text",q:"Name the energy store of the load that increases as it is lifted.",pts:[{t:"Gravitational potential",k:["gravitational","potential"]}],model:"Its gravitational potential energy store."},{n:"(b)",m:2,kind:"num",s:1,q:"Calculate the gain in gravitational potential energy of the load.",a:88200,unit:"J",work:["\u0394E\u209a = mg\u0394h","= 600 \xd7 9.8 \xd7 15","= 88 200 J"]},{n:"(c)",m:2,kind:"num",q:"The useful work done on the load is 88 200 J. Calculate the useful power output of the crane.",a:2940,unit:"W",work:["P = W \xf7 t","= 88 200 \xf7 30","= 2940 W"]},{n:"(d)",m:2,kind:"num",s:1,q:"The motor\u2019s input power is 4.2 kW. Calculate the efficiency of the crane, as a percentage.",a:70,unit:"%",work:["efficiency = 2940 \xf7 4200 \xd7 100%","= 70%"]},{n:"(e)",m:2,kind:"text",q:"Suggest two reasons why the efficiency is less than 100%.",pts:[{t:"Friction in moving parts",k:["friction"]},{t:"Energy heats the motor or surroundings",k:["heat","thermal","warm","hot"]},{t:"Sound is produced",k:["sound","noise"]},{t:"Resistance of the wires heats them",k:["resistance"]}],model:"Friction in the moving parts wastes energy, and the motor and wires heat up, transferring energy to the surroundings."},{n:"(f)",m:1,kind:"text",q:"State the principle of conservation of energy.",pts:[{t:"Energy cannot be created or destroyed",k:["created+destroyed","cannot be created","conserved","not be created"]}],model:"Energy cannot be created or destroyed; it is only transferred from one store to another."}]},{id:"q4",t:"2.2",title:"Boiling a kettle",intro:"An electric kettle heats 1.2 kg of water from 20 \xb0C to 100 \xb0C.",parts:[{n:"(a)",m:2,kind:"text",q:"Describe the arrangement and motion of the particles in liquid water.",pts:[{t:"Close together (touching), irregular arrangement",k:["close","touching","near"]},{t:"Move past each other / randomly",k:["move past","slide","random","move around","flow"]}],model:"The particles are close together in an irregular arrangement, and they move around, sliding past each other."},{n:"(b)",m:2,kind:"num",s:1,q:"The specific heat capacity of water is 4200 J/(kg \xb0C). Calculate the energy needed to heat the water to 100 \xb0C.",a:403200,unit:"J",work:["\u0394E = mc\u0394\u03b8","= 1.2 \xd7 4200 \xd7 80","= 403 200 J"]},{n:"(c)",m:2,kind:"num",q:"The kettle supplies 403 200 J at a power of 2400 W. Calculate how long this takes.",a:168,unit:"s",work:["t = E \xf7 P","= 403 200 \xf7 2400","= 168 s"]},{n:"(d)",m:2,kind:"text",q:"While the water boils, its temperature stays at 100 \xb0C even though energy is still supplied. Explain why, in terms of particles.",pts:[{t:"The energy is used to overcome the forces (bonds) between particles",k:["forces","bonds","attraction","break"]},{t:"So the kinetic energy of the particles (temperature) does not increase",k:["kinetic","not+increase","no increase","separate","further apart"]}],model:"The energy is used to overcome the forces between the particles so they can separate into a gas, not to increase their kinetic energy, so the temperature stays the same."},{n:"(e)",m:2,kind:"text",q:"Explain why the heating element is at the bottom of the kettle.",pts:[{t:"Heated water expands, becomes less dense and rises",k:["less dense","rises","density","expand"]},{t:"Sets up a convection current so all the water is heated",k:["convection","cooler+sink","sinks"]}],model:"Water near the element expands, becomes less dense and rises; cooler, denser water sinks to take its place, setting up a convection current that heats all the water."}]},{id:"q5",t:"3.4",title:"Sound and ultrasound",intro:"Sound travels through air at 340 m/s.",parts:[{n:"(a)",m:1,kind:"text",q:"Sound is a longitudinal wave. State what is meant by a longitudinal wave.",pts:[{t:"Vibrations are parallel to the direction of travel",k:["parallel","same direction","along","direction of travel+same"]}],model:"The vibrations are parallel to the direction in which the wave travels."},{n:"(b)",m:2,kind:"num",q:"A note has a frequency of 500 Hz. Calculate its wavelength in air.",a:.68,unit:"m",work:["\u03bb = v \xf7 f","= 340 \xf7 500","= 0.68 m"]},{n:"(c)",m:1,kind:"text",q:"State the range of frequencies that humans can hear.",pts:[{t:"20 Hz to 20 000 Hz",k:["20+20000","20+20 000","20+20 khz","20+20khz","20+20k"]}],model:"About 20 Hz to 20 000 Hz."},{n:"(d)",m:2,kind:"num",s:1,q:"A ship sends an ultrasound pulse to the sea bed. The echo returns after 0.60 s. Sound travels at 1500 m/s in sea water. Calculate the depth of the water.",a:450,unit:"m",work:["distance there and back = 1500 \xd7 0.60 = 900 m","depth = 900 \xf7 2 = 450 m"]},{n:"(e)",m:2,kind:"text",s:1,q:"Describe the difference between a compression and a rarefaction.",pts:[{t:"Compression: particles closer together (higher pressure)",k:["close","squash","together","high pressure","higher pressure"]},{t:"Rarefaction: particles further apart (lower pressure)",k:["spread","far apart","further apart","apart","low pressure","lower pressure"]}],model:"In a compression the air particles are pushed closer together; in a rarefaction they are spread further apart."},{n:"(f)",m:2,kind:"text",q:"Explain why sound cannot travel through a vacuum.",pts:[{t:"Sound needs a medium / particles to vibrate",k:["medium","particles","molecules","vibrat"]},{t:"A vacuum has no particles",k:["no particles","no molecules","nothing","empty","no matter","no medium"]}],model:"Sound is passed on by vibrating particles, and a vacuum contains no particles, so there is nothing to carry the vibrations."}]},{id:"q6",t:"3.2",title:"Light in glass",intro:"A ray of light passes into a glass block.",svg:{k:"block"},parts:[{n:"(a)",m:1,kind:"text",q:"Define the critical angle.",pts:[{t:"The angle of incidence for which the angle of refraction is 90\xb0",k:["refraction+90","incidence+90","90"]}],model:"The angle of incidence at which the angle of refraction is 90\xb0."},{n:"(b)",m:2,kind:"num",s:1,q:"The angle of incidence is 45\xb0 and the angle of refraction is 28\xb0. Calculate the refractive index of the glass.",a:1.51,unit:"",tol:.03,work:["n = sin i \xf7 sin r","= sin 45\xb0 \xf7 sin 28\xb0","= 0.707 \xf7 0.469 = 1.5"]},{n:"(c)",m:2,kind:"num",s:1,q:"Calculate the critical angle for glass of refractive index 1.5.",a:41.8,unit:"\xb0",tol:.6,work:["sin c = 1 \xf7 n = 1 \xf7 1.5 = 0.667","c = 41.8\xb0"]},{n:"(d)",m:2,kind:"text",q:"Describe what happens to light inside the block when it hits the surface at more than the critical angle.",pts:[{t:"Total internal reflection",k:["total internal","tir"]},{t:"All the light is reflected back inside; none leaves",k:["all+reflect","reflected back","none+leave","does not leave","no light+refract","stays inside"]}],model:"Total internal reflection: all of the light is reflected back into the glass and none passes out."},{n:"(e)",m:2,kind:"text",q:"A converging lens forms an image of a distant object on a screen. State two properties of the image.",pts:[{t:"Real",k:["real"]},{t:"Inverted",k:["invert","upside"]},{t:"Diminished",k:["diminish","smaller"]}],model:"It is real, inverted and diminished."}]},{id:"q7",t:"4.3",title:"A resistor circuit",intro:"A 12 V battery is connected to a 4.0 \u03a9 resistor in series with a 6.0 \u03a9 and a 12 \u03a9 resistor in parallel.",svg:{k:"parallel",src:"12 V",main:[["R","4.0 \u03a9"],["A"]],br:[[["R","6.0 \u03a9"]],[["R","12 \u03a9"]]]},parts:[{n:"(a)",m:2,kind:"text",q:"State what is meant by the e.m.f. of the battery.",pts:[{t:"The electrical work done (energy transferred) by the source",k:["work","energy"]},{t:"Per unit charge moved around a complete circuit",k:["unit charge","per coulomb","each coulomb","per unit","per charge"]}],model:"The electrical work done by the battery in moving a unit charge around the complete circuit."},{n:"(b)",m:2,kind:"num",s:1,q:"Calculate the combined resistance of the 6.0 \u03a9 and 12 \u03a9 resistors in parallel.",a:4,unit:"\u03a9",work:["1/R = 1/6 + 1/12 = 3/12","R = 4.0 \u03a9"]},{n:"(c)",m:3,kind:"num",s:1,q:"Calculate the current from the battery.",a:1.5,unit:"A",work:["total R = 4.0 + 4.0 = 8.0 \u03a9","I = V \xf7 R = 12 \xf7 8.0","= 1.5 A"]},{n:"(d)",m:2,kind:"num",q:"The parallel pair is replaced by one 8.0 \u03a9 resistor, in series with the 4.0 \u03a9 resistor. Calculate the new current.",a:1,unit:"A",work:["R = 4.0 + 8.0 = 12 \u03a9","I = 12 \xf7 12 = 1.0 A"]},{n:"(e)",m:2,kind:"num",q:"Calculate the power supplied by the battery when the current is 1.0 A.",a:12,unit:"W",work:["P = IV = 1.0 \xd7 12","= 12 W"]},{n:"(f)",m:1,kind:"text",q:"State one advantage of connecting the lamps in a house in parallel.",pts:[{t:"Each lamp can be switched on and off independently / others stay on if one fails / each gets the full p.d.",k:["independ","separately","own switch","stay on","still work","full","same voltage","same p d","others"]}],model:"Each lamp can be switched on and off on its own, and the others stay on if one breaks."}]},{id:"q8",t:"5.2",title:"Radioactivity and the Sun",intro:"A student investigates a radioactive source in the laboratory.",parts:[{n:"(a)",m:1,kind:"text",q:"State what an alpha particle consists of.",pts:[{t:"Two protons and two neutrons (a helium nucleus)",k:["helium","2 protons","two protons"]}],model:"Two protons and two neutrons: a helium nucleus."},{n:"(b)",m:1,kind:"text",q:"State which type of radiation is the most penetrating.",pts:[{t:"Gamma",k:["gamma"]}],model:"Gamma radiation."},{n:"(c)",m:1,kind:"num",s:1,q:"The background count rate is 30 counts/min. With the source, the detector reads 830 counts/min. Calculate the corrected count rate.",a:800,unit:"counts/min",work:["830 \u2212 30 = 800 counts/min"]},{n:"(d)",m:2,kind:"num",q:"The corrected count rate is 800 counts/min and the half-life is 15 minutes. Calculate the corrected count rate after 1.0 hour.",a:50,unit:"counts/min",work:["60 \xf7 15 = 4 half-lives","800 \u2192 400 \u2192 200 \u2192 100 \u2192 50 counts/min"]},{n:"(e)",m:1,kind:"num",s:1,q:"{{241|95|Am}} decays by alpha emission. Calculate the nucleon number of the new nucleus.",a:237,unit:"",work:["alpha: A \u2212 4","241 \u2212 4 = 237"]},{n:"(f)",m:1,kind:"text",s:1,q:"Name the nuclear process that releases energy in the Sun.",pts:[{t:"Nuclear fusion",k:["fusion"]}],model:"Nuclear fusion of hydrogen into helium."},{n:"(g)",m:2,kind:"text",q:"State two precautions the student should take when handling the source.",pts:[{t:"Use long tongs / keep a distance",k:["tongs","forceps","distance","arm"]},{t:"Store in a lead-lined box / use shielding",k:["lead","shield"]},{t:"Keep the time of exposure short",k:["short","time","quick"]},{t:"Point it away from people",k:["point away","away from","not point"]}],model:"Handle the source with long tongs, and keep it in a lead-lined box when it is not being used."},{n:"(h)",m:1,kind:"text",q:"Light from distant galaxies is redshifted. State what this suggests about the Universe.",pts:[{t:"The Universe is expanding (galaxies are moving away)",k:["expand","moving away","big bang","getting bigger"]}],model:"The galaxies are moving away from us, so the Universe is expanding."}]},{id:"q9",t:"1.8",title:"A metal block",intro:"A rectangular metal block measures 0.20 m \xd7 0.10 m \xd7 0.050 m and has a mass of 2.7 kg. (g = 9.8 N/kg)",parts:[{n:"(a)",m:1,kind:"num",q:"Calculate the volume of the block.",a:.001,unit:"m\xb3",work:["V = 0.20 \xd7 0.10 \xd7 0.050","= 0.0010 m\xb3"]},{n:"(b)",m:2,kind:"num",q:"Calculate the density of the metal.",a:2700,unit:"kg/m\xb3",work:["\u03c1 = m \xf7 V","= 2.7 \xf7 0.0010","= 2700 kg/m\xb3"]},{n:"(c)",m:1,kind:"num",q:"Calculate the weight of the block.",a:26.46,unit:"N",work:["W = mg = 2.7 \xd7 9.8","= 26.5 N"]},{n:"(d)",m:2,kind:"num",q:"The block rests on its largest face (0.20 m \xd7 0.10 m). Calculate the pressure it exerts on the floor.",a:1323,unit:"Pa",work:["A = 0.20 \xd7 0.10 = 0.020 m\xb2","p = F \xf7 A = 26.46 \xf7 0.020","= 1320 Pa"]},{n:"(e)",m:2,kind:"text",q:"Explain how the pressure changes if the block is stood on its smallest face.",pts:[{t:"The pressure increases",k:["increase","larger","bigger","greater","higher"]},{t:"The same force acts on a smaller area",k:["smaller area","less area","area+smaller","area+less","area+decrease"]}],model:"The pressure increases, because the same weight acts on a smaller area."},{n:"(f)",m:2,kind:"num",s:1,q:"Calculate the pressure due to water at a depth of 3.0 m. (\u03c1 = 1000 kg/m\xb3)",a:29400,unit:"Pa",work:["\u0394p = \u03c1g\u0394h","= 1000 \xd7 9.8 \xd7 3.0","= 29 400 Pa"]}]},{id:"q10",t:"1.5",title:"Springs and see-saws",intro:"A student tests a spring, then balances a see-saw.",parts:[{n:"(a)",m:2,kind:"text",q:"Describe how the student finds the extension of the spring for a given load.",pts:[{t:"Measure the original (unstretched) length with a ruler",k:["original length","unstretched","length before","initial length","starting length"]},{t:"Measure the new length and subtract the original length",k:["subtract","minus","take away","difference"]}],model:"Measure the original length of the spring with a ruler, add the load, measure the new length, and subtract the original length from it."},{n:"(b)",m:2,kind:"num",s:1,q:"A load of 4.0 N gives an extension of 0.020 m. Calculate the spring constant.",a:200,unit:"N/m",work:["k = F \xf7 x","= 4.0 \xf7 0.020","= 200 N/m"]},{n:"(c)",m:1,kind:"text",s:1,q:"State what is meant by the limit of proportionality.",pts:[{t:"The point beyond which extension is no longer proportional to load",k:["no longer proportional","not proportional","stops being proportional","proportional"]}],model:"The point beyond which the extension is no longer proportional to the load."},{n:"(d)",m:3,kind:"num",q:"A see-saw is pivoted at its centre. A child of weight 300 N sits 0.80 m to the left of the pivot. How far to the right must a child of weight 400 N sit to balance it?",svg:{k:"beam",piv:50,f:[[30,"300 N","0.80 m"],[65,"400 N","?"]]},a:.6,unit:"m",work:["anticlockwise moment = 300 \xd7 0.80 = 240 N m","400 \xd7 d = 240","d = 0.60 m"]},{n:"(e)",m:2,kind:"text",q:"State the two conditions for an object to be in equilibrium.",pts:[{t:"No resultant force",k:["resultant force","forces+balanced","no force","net force"]},{t:"No resultant moment",k:["resultant moment","moments+balanced","clockwise+anticlockwise","net moment","no moment"]}],model:"There is no resultant force and no resultant moment."}]},{id:"q11",t:"1.7",title:"Generating electricity",intro:"Countries use many different energy resources to generate electricity.",parts:[{n:"(a)",m:3,kind:"text",q:"Describe how electricity is generated in a gas-fired power station.",pts:[{t:"Burning gas heats water in a boiler to make steam",k:["boil","steam","heat+water"]},{t:"The steam turns a turbine",k:["turbine"]},{t:"The turbine turns a generator",k:["generator"]}],model:"The gas is burned to heat water in a boiler, making steam. The steam turns a turbine, which turns a generator to produce electricity."},{n:"(b)",m:2,kind:"text",q:"Give one advantage and one disadvantage of using solar cells.",pts:[{t:"Advantage: renewable, no carbon dioxide, free fuel",k:["renewable","no carbon","no co2","pollution","free","run out"]},{t:"Disadvantage: no output at night, unreliable in cloud, needs a large area",k:["night","cloud","unreliable","weather","area","expensive"]}],model:"Advantage: they are renewable and produce no carbon dioxide. Disadvantage: they produce no electricity at night."},{n:"(c)",m:2,kind:"num",s:1,q:"A power station takes in 1200 MJ of energy from fuel each second and gives out 420 MW of electrical power. Calculate its efficiency, as a percentage.",a:35,unit:"%",work:["input power = 1200 MW","efficiency = 420 \xf7 1200 \xd7 100%","= 35%"]},{n:"(d)",m:1,kind:"text",s:1,q:"Name one energy resource whose energy does NOT come from the Sun.",pts:[{t:"Geothermal, nuclear or tidal",k:["geothermal","nuclear","tidal","tide"]}],model:"Geothermal energy."}]},{id:"q12",t:"2.3",title:"Gases and keeping warm",intro:"Particles, gases and thermal energy transfer.",parts:[{n:"(a)",m:2,kind:"text",q:"Explain, in terms of particles, how a gas exerts a pressure on the walls of its container.",pts:[{t:"Particles collide with (hit) the walls",k:["collide","hit","collision","bounce"]},{t:"Each collision exerts a force on the wall",k:["force","push"]}],model:"The gas particles move randomly and collide with the walls; each collision exerts a force, and the force per unit area is the pressure."},{n:"(b)",m:2,kind:"num",s:1,q:"A gas occupies 50 cm\xb3 at 120 kPa. It is compressed slowly to 30 cm\xb3 at constant temperature. Calculate its new pressure.",a:200,unit:"kPa",work:["p\u2081V\u2081 = p\u2082V\u2082","120 \xd7 50 = p\u2082 \xd7 30","p\u2082 = 200 kPa"]},{n:"(c)",m:1,kind:"num",q:"Convert 27 \xb0C into kelvin.",a:300,unit:"K",work:["27 + 273 = 300 K"]},{n:"(d)",m:2,kind:"text",q:"Explain why a white, shiny car stays cooler in sunshine than a dull black car.",pts:[{t:"White/shiny surfaces reflect infrared radiation",k:["reflect"]},{t:"Dull black surfaces absorb more infrared",k:["absorb"]}],model:"The white, shiny surface reflects most of the infrared radiation, while the dull black surface absorbs much more of it."},{n:"(e)",m:2,kind:"text",q:"Explain how the vacuum in a vacuum flask reduces energy transfer.",pts:[{t:"A vacuum contains no particles",k:["no particles","no molecules","no air","empty"]},{t:"So conduction and convection cannot happen across it",k:["conduction","convection"]}],model:"There are no particles in a vacuum, so energy cannot be transferred across it by conduction or convection."},{n:"(f)",m:1,kind:"text",s:1,q:"State what happens to the temperature of an object that absorbs radiation faster than it emits radiation.",pts:[{t:"Its temperature increases",k:["increase","rise","hotter","goes up","warm"]}],model:"Its temperature rises."}]},{id:"q13",t:"3.3",title:"Electromagnetic waves",intro:"Electromagnetic waves are used for communication.",parts:[{n:"(a)",m:1,kind:"text",q:"Name the region of the electromagnetic spectrum between infrared and ultraviolet.",pts:[{t:"Visible light",k:["visible","light"]}],model:"Visible light."},{n:"(b)",m:2,kind:"text",q:"State one use of microwaves and one danger of excessive exposure to them.",pts:[{t:"Use: mobile phones, satellite TV, microwave ovens",k:["satellite","mobile","phone","oven","cook","wifi","wi fi","television"]},{t:"Danger: heating of internal body cells",k:["heat","internal","burn","cells","cook"]}],model:"Use: mobile phone signals. Danger: they can heat internal body cells."},{n:"(c)",m:2,kind:"num",q:"A radio station broadcasts at 98 MHz. Electromagnetic waves travel at 3.0 \xd7 10\u2078 m/s. Calculate the wavelength.",a:3.06,unit:"m",work:["\u03bb = v \xf7 f","= 3.0 \xd7 10\u2078 \xf7 98 \xd7 10\u2076","= 3.1 m"]},{n:"(d)",m:2,kind:"text",s:1,q:"Give two advantages of digital signals over analogue signals.",pts:[{t:"Data can be sent at a higher rate",k:["more data","higher rate","faster","rate"]},{t:"Can be regenerated accurately, removing noise, so they travel further",k:["regenerat","noise","range","distance","quality","further"]}],model:"They carry data at a higher rate, and they can be regenerated accurately to remove noise, so they can travel further."},{n:"(e)",m:1,kind:"text",q:"Name the type of electromagnetic wave used to communicate with satellites.",pts:[{t:"Microwaves",k:["microwave"]}],model:"Microwaves."},{n:"(f)",m:1,kind:"text",s:1,q:"Bluetooth uses radio waves. Suggest why the signal is weaker in the next room.",pts:[{t:"The walls absorb or weaken the waves (and it is further away)",k:["wall","absorb","weaken","distance","further"]}],model:"Radio waves pass through walls but are partly absorbed, so the signal is weakened."}]},{id:"q14",t:"4.5",title:"Magnets, motors and induction",intro:"This question is about magnetic fields and electromagnetic effects.",parts:[{n:"(a)",m:2,kind:"text",q:"Describe how to use a small compass to plot the field lines around a bar magnet.",pts:[{t:"Place the compass near the magnet and mark the direction the needle points",k:["mark","dot","needle","direction","point"]},{t:"Move the compass along to the mark, repeat, then join the marks",k:["move","repeat","join","connect"]}],model:"Put the compass near a pole and mark where the needle points with a dot. Move the compass so its tail is at the dot, mark again, repeat, then join the dots and add an arrow."},{n:"(b)",m:1,kind:"text",q:"A wire carrying a current between two magnetic poles feels a force. State what happens to the force if the current is reversed.",pts:[{t:"The force reverses direction",k:["revers","opposite","other direction","other way"]}],model:"The force acts in the opposite direction."},{n:"(c)",m:2,kind:"text",q:"State two ways to increase the turning effect on the coil of a motor.",pts:[{t:"More turns on the coil",k:["turns","coils","loops"]},{t:"A bigger current",k:["current"]},{t:"A stronger magnet",k:["stronger","strong","magnetic field"]}],model:"Use more turns on the coil and a larger current (or a stronger magnet)."},{n:"(d)",m:2,kind:"text",s:1,q:"Explain the purpose of the split-ring commutator in a d.c. motor.",pts:[{t:"It reverses the current in the coil",k:["revers"]},{t:"Every half turn, so the coil keeps turning in the same direction",k:["half","same direction","keeps turning","continu","same way"]}],model:"It reverses the current in the coil every half turn, so the forces keep turning the coil in the same direction."},{n:"(e)",m:2,kind:"text",q:"A magnet is pushed into a coil connected to a meter. State two ways to increase the induced e.m.f.",pts:[{t:"Move the magnet faster",k:["faster","quick","speed"]},{t:"Use a stronger magnet",k:["stronger"]},{t:"Use more turns on the coil",k:["turns","coils","loops"]}],model:"Move the magnet faster, or use a stronger magnet (or more turns)."},{n:"(f)",m:2,kind:"text",s:1,q:"When the magnet is pulled out, the meter deflects the opposite way. Explain why.",pts:[{t:"The induced e.m.f. opposes the change producing it",k:["oppos"]},{t:"The change (the motion) is now reversed",k:["revers","opposite direction","other way","pulled out","leaving"]}],model:"The induced e.m.f. always opposes the change that causes it. Pulling the magnet out is the opposite change, so the current flows the other way."}]},{id:"q15",t:"4.4",title:"A light sensor and a heater",intro:"A light sensor uses an LDR in a potential divider. A heater is plugged into the mains.",svg:{k:"series",src:"9.0 V",parts:[["R","3.0 k\u03a9"],["LDR",""]],v:[1]},parts:[{n:"(a)",m:1,kind:"text",q:"State how the resistance of an LDR changes as the light intensity increases.",pts:[{t:"It decreases",k:["decrease","less","lower","falls","goes down","smaller"]}],model:"Its resistance decreases."},{n:"(b)",m:2,kind:"num",s:1,q:"In the dark, the LDR has a resistance of 6.0 k\u03a9. Calculate the p.d. across the LDR.",a:6,unit:"V",work:["total R = 3.0 + 6.0 = 9.0 k\u03a9","V = 6.0/9.0 \xd7 9.0","= 6.0 V"]},{n:"(c)",m:3,kind:"num",s:1,q:"In bright light, the p.d. across the LDR is 1.5 V. Calculate the resistance of the LDR, in \u03a9.",a:600,unit:"\u03a9",work:["p.d. across the 3.0 k\u03a9 resistor = 9.0 \u2212 1.5 = 7.5 V","R_LDR \xf7 3000 = 1.5 \xf7 7.5","R_LDR = 600 \u03a9"]},{n:"(d)",m:1,kind:"text",q:"State why the switch of the heater must be in the live wire.",pts:[{t:"So that switching off disconnects the heater from the live (high) voltage",k:["disconnect","not live","isolat","live","safe"]}],model:"So that when it is switched off, the heater is disconnected from the live voltage and is safe."},{n:"(e)",m:2,kind:"num",q:"The heater is rated 2.3 kW, 230 V. Calculate the normal current.",a:10,unit:"A",work:["I = P \xf7 V","= 2300 \xf7 230","= 10 A"]},{n:"(f)",m:2,kind:"text",q:"Fuses of 3 A, 5 A and 13 A are available. State which fuse should be used and why.",pts:[{t:"13 A",k:["13"]},{t:"It is just above the normal current of 10 A",k:["above","higher","greater","more than","bigger"]}],model:"13 A, because it is the smallest rating above the normal current of 10 A."},{n:"(g)",m:1,kind:"text",q:"The heater has a metal case. Explain how the earth wire protects the user if the live wire touches the case.",pts:[{t:"A large current flows to earth and the fuse melts",k:["fuse+melt","fuse+blow","large current","earth+fuse","current+earth"]}],model:"A large current flows through the earth wire, so the fuse melts and disconnects the supply."}]},{id:"q16",t:"6.2",title:"Carbon-14 and the stars",intro:"Carbon-14 is a radioactive isotope with a half-life of 5700 years.",parts:[{n:"(a)",m:2,kind:"text",q:"A nucleus of carbon-14 is written {{14|6|C}}. State the number of protons and the number of neutrons.",pts:[{t:"6 protons",k:["6 proton","six proton","protons+6"]},{t:"8 neutrons",k:["8 neutron","eight neutron","neutrons+8"]}],model:"6 protons and 8 neutrons."},{n:"(b)",m:2,kind:"num",q:"What fraction of the carbon-14 in a sample is left after 17 100 years? Give your answer as a decimal or a fraction.",a:.125,unit:"",work:["17 100 \xf7 5700 = 3 half-lives","1 \u2192 \xbd \u2192 \xbc \u2192 \u215b","\u215b = 0.125"]},{n:"(c)",m:1,kind:"num",s:1,q:"Carbon-14 decays by beta emission into nitrogen. State the proton number of the nitrogen nucleus.",a:7,unit:"",work:["beta: Z + 1","6 + 1 = 7"]},{n:"(d)",m:2,kind:"text",s:1,q:"Describe what happens to a star like the Sun after it runs out of hydrogen.",pts:[{t:"It expands into a red giant",k:["red giant"]},{t:"It sheds a planetary nebula and leaves a white dwarf",k:["white dwarf","planetary nebula"]}],model:"It expands to become a red giant, then throws off its outer layers as a planetary nebula, leaving a white dwarf."},{n:"(e)",m:1,kind:"num",s:1,q:"A star is 8.6 light-years away. Calculate this distance in metres. (1 light-year = 9.5 \xd7 10\xb9\u2075 m)",a:817e14,unit:"m",work:["8.6 \xd7 9.5 \xd7 10\xb9\u2075","= 8.2 \xd7 10\xb9\u2076 m"]},{n:"(f)",m:1,kind:"text",q:"State what is meant by a light-year.",pts:[{t:"The distance light travels in one year",k:["distance"]}],model:"The distance that light travels through space in one year."},{n:"(g)",m:1,kind:"text",s:1,q:"State what the cosmic microwave background radiation (CMBR) is evidence for.",pts:[{t:"The Big Bang / the early, hot Universe that has expanded",k:["big bang","early universe","expan"]}],model:"It is evidence for the Big Bang: radiation from the early Universe, stretched to microwaves as the Universe expanded."}]},{id:"a1",t:"P",atp:1,title:"Stretching a spring",intro:"A student hangs loads on a spring and measures its length. The unstretched length is 12.0 cm.",parts:[{n:"(a)",m:1,kind:"num",q:"With a 3.0 N load the length is 18.1 cm. Calculate the extension.",a:6.1,unit:"cm",work:["18.1 \u2212 12.0 = 6.1 cm"]},{n:"(b)",m:1,kind:"text",q:"State the independent variable.",pts:[{t:"The load (weight) on the spring",k:["load","weight","force","mass"]}],model:"The load on the spring."},{n:"(c)",m:1,kind:"text",q:"State one precaution to make the length readings accurate.",pts:[{t:"Read the ruler with the eye level with the mark (avoid parallax) / use a set square or pointer",k:["eye level","parallax","perpendicular","set square","pointer","marker","vertical"]}],model:"Read the ruler with my eye level with the bottom of the spring, using a set square."},{n:"(d)",m:1,kind:"num",q:"The extensions for loads of 1.0, 2.0, 3.0, 4.0 and 5.0 N are 2.0, 4.1, 7.2, 8.0 and 10.1 cm. At which load, in N, is the result anomalous?",a:3,unit:"N",work:["The others go up by about 2 cm per newton.","7.2 cm at 3.0 N is well off the pattern."]},{n:"(e)",m:2,kind:"num",q:"The graph of extension against load is a straight line through the origin. Determine its gradient.",svg:{k:"graph",x:"load / N",y:"extension / cm",xm:5,ym:10,xs:1,ys:2,lines:[{p:[[0,0],[5,10]]}],pts:[[1,2],[2,4.1],[3,7.2],[4,8],[5,10.1]]},a:2,unit:"cm/N",work:["use a large triangle: from (0, 0) to (5.0, 10.0)","gradient = 10.0 \xf7 5.0 = 2.0 cm/N"]},{n:"(f)",m:2,kind:"num",q:"Use k = 1 \xf7 gradient to find the spring constant, in N/cm.",a:.5,unit:"N/cm",work:["k = 1 \xf7 2.0","= 0.50 N/cm"]},{n:"(g)",m:2,kind:"text",q:"Suggest two improvements to the experiment.",pts:[{t:"Repeat each reading and take an average",k:["repeat","average"]},{t:"Use more loads / a wider range",k:["more load","more reading","range","more result","more values"]},{t:"Use a pointer fixed to the spring / read at eye level",k:["pointer","marker","eye level","parallax"]}],model:"Repeat each reading and average the results, and use more loads over a wider range."}]},{id:"a2",t:"P",atp:1,title:"Resistance of a wire",intro:"A student measures the current through, and p.d. across, different lengths of a wire.",parts:[{n:"(a)",m:1,kind:"text",q:"State how the voltmeter should be connected to the wire.",pts:[{t:"In parallel, across the wire",k:["parallel","across"]}],model:"In parallel with the wire, across its two ends."},{n:"(b)",m:1,kind:"num",q:"Read the ammeter.",svg:{k:"meter",v:.36,max:1,u:"A"},a:.36,unit:"A",tol:.015,work:["Each small division is 0.02 A.","The needle points to 0.36 A."]},{n:"(c)",m:2,kind:"num",q:"The voltmeter reads 1.8 V when the current is 0.36 A. Calculate the resistance of the wire.",a:5,unit:"\u03a9",work:["R = V \xf7 I","= 1.8 \xf7 0.36","= 5.0 \u03a9"]},{n:"(d)",m:2,kind:"text",q:"For lengths of 20, 40, 60, 80 and 100 cm the resistances are 1.0, 2.0, 3.1, 3.9 and 5.0 \u03a9. Describe the relationship.",pts:[{t:"Resistance increases as length increases",k:["increase"]},{t:"Resistance is (directly) proportional to length",k:["proportional","through the origin","doubl"]}],model:"As the length increases, the resistance increases; the resistance is directly proportional to the length."},{n:"(e)",m:1,kind:"text",q:"The wire gets hot with a large current. Suggest how to prevent this.",pts:[{t:"Use a small current / switch off between readings",k:["switch off","low current","small current","smaller current","between readings","short time","turn off"]}],model:"Use a small current and switch off between readings."},{n:"(f)",m:2,kind: start"]},{t:"Room temperature / draughts",k:["room","draught","surround"]},{t:"Size and shape of the cans",k:["size","shape","same can"]}],model:"The volume of water and the starting temperature."},{n:"(e)",m:2,kind:"text",q:"Predict which can cools faster, and explain why.",pts:[{t:"The dull black can",k:["black"]},{t:"Dull black is a better emitter of infrared radiation",k:["emit","radiat"]}],model:"The dull black can, because dull black surfaces are better emitters of infrared radiation."},{n:"(f)",m:2,kind:"text",q:"Suggest two improvements to the experiment.",pts:[{t:"Put lids on the cans",k:["lid"]},{t:"Insulate the bases",k:["insulat"]},{t:"Stir before each reading",k:["stir"]},{t:"Use temperature probes and a data logger",k:["data logger","probe","sensor"]},{t:"Repeat the experiment",k:["repeat"]}],model:"Put a lid on each can to reduce cooling by evaporation and convection, and stir the water before each reading."}]},{id:"a4",t:"P",atp:1,title:"Planning a pendulum investigation",intro:"A student plans to investigate how the length of a pendulum affects its period.",parts:[{n:"(a)",m:2,kind:"text",q:"State the independent variable and the dependent variable.",pts:[{t:"Independent: length of the pendulum",k:["length"]},{t:"Dependent: period (time for one oscillation)",k:["period","time"]}],model:"Independent: the length of the string. Dependent: the period."},{n:"(b)",m:2,kind:"text",q:"State two control variables.",pts:[{t:"Mass of the bob",k:["mass","bob"]},{t:"Amplitude / angle of release",k:["amplitude","angle","release","height"]}],model:"The mass of the bob and the angle it is released from."},{n:"(c)",m:2,kind:"text",q:"Explain why the student should time 20 oscillations rather than one.",pts:[{t:"It reduces the effect of reaction time",k:["reaction"]},{t:"Divide by 20, so the error on each period is much smaller (more accurate)",k:["divide","accurate","uncertainty","error","smaller"]}],model:"Reaction time causes an error at the start and end of timin
