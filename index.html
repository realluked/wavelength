s direction.",svg:{k:"block"},bullets:["Air into glass: slows down and bends towards the normal.","Glass into air: speeds up and bends away from the normal.","Along the normal (i = 0\xb0): it doesn\u2019t change direction."]},{type:"mc",q:"A ray of light enters a glass block at an angle. Which way does it bend?",options:["Towards the normal","Away from the normal","Along the surface","It doesn\u2019t bend"],a:0},{type:"teach",title:"Critical angle and total internal reflection",text:"When light goes from glass into air, a bigger angle of incidence gives a bigger angle of refraction.",svg:{k:"tir"},bullets:["The critical angle is the angle of incidence that gives an angle of refraction of 90\xb0.","Below the critical angle: most light refracts out, a little reflects inside.","Above it: all the light reflects back inside. This is total internal reflection."]},{type:"multi",q:"Which conditions are needed for total internal reflection?",options:["Light travelling from a denser material towards a less dense one","Angle of incidence bigger than the critical angle","Light travelling from air into glass","Angle of incidence smaller than the critical angle"],correct:[0,1]},{type:"teach",s:1,title:"Refractive index",text:"The refractive index n is the ratio of the speed of light in air (a vacuum) to the speed of light in the material.",eq:"n = sin i / sin r      n = 1 / sin c",bullets:["Glass has n \u2248 1.5: light travels 1.5 times slower in it."]},{type:"num",s:1,q:"A ray enters glass with i = 40\xb0 and r = 25\xb0. What is the refractive index of the glass?",a:1.52,unit:"",work:["n = sin i \xf7 sin r","= sin 40\xb0 \xf7 sin 25\xb0","= 0.643 \xf7 0.423 = 1.52"]},{type:"num",s:1,q:"A glass has refractive index 1.5. What is its critical angle?",a:41.8,unit:"\xb0",tol:.5,work:["sin c = 1 \xf7 n = 1 \xf7 1.5 = 0.667","c = sin\u207b\xb9(0.667) = 41.8\xb0"]},{type:"num",s:1,q:"Light travels at 3.0 \xd7 10\u2078 m/s in air. How fast does it travel in glass with n = 1.5? Give your answer in m/s.",a:2e8,unit:"m/s",work:["speed in glass = 3.0 \xd7 10\u2078 \xf7 1.5","= 2.0 \xd7 10\u2078 m/s"],why:"You can type 2e8."},{type:"teach",s:1,title:"Optical fibres",text:"Light entering a glass fibre hits the side at more than the critical angle, so it is totally internally reflected again and again along the fibre.",svg:{k:"fibre"},bullets:["Optical fibres carry data for telecommunications: phone, cable TV and broadband."]},{type:"mc",s:1,q:"How does light travel along an optical fibre?",options:["By repeated total internal reflection","By refraction out of the sides","By diffraction","By conduction"],a:0}]},W5:{name:"Lenses",ex:[{type:"teach",title:"Two kinds of lens",text:"A converging lens is fatter in the middle. It brings parallel rays together at the principal focus (F). A diverging lens is thinner in the middle and spreads rays out.",svg:{k:"lens",par:1},bullets:["Principal axis: the line through the centre of the lens, at 90\xb0 to it.","Focal length: the distance from the centre of the lens to the principal focus.","A diverging lens makes parallel rays spread out as if they came from a principal focus on the same side as the light."]},{type:"teach",title:"Drawing ray diagrams",text:"Use two rays from the top of the object:",svg:{k:"lens",f:2,u:5},list:["A ray parallel to the principal axis refracts through F on the far side.","A ray through the centre of the lens goes straight on.","Where they cross is the top of the image."]},{type:"mc",q:"An object is more than twice the focal length from a converging lens. What is the image like?",svg:{k:"lens",f:2,u:5},options:["Real, inverted and diminished","Virtual, upright and enlarged","Real, upright and the same size","Virtual, inverted and diminished"],a:0,why:"This is how a camera or an eye forms an image."},{type:"mc",q:"An object is between F and 2F from a converging lens. What is the image like?",svg:{k:"lens",f:2,u:3},options:["Real, inverted and enlarged","Real, inverted and diminished","Virtual and upright","There is no image"],a:0,why:"This is how a projector makes a big image on a screen."},{type:"teach",title:"Real or virtual?",text:"A real image is formed where rays actually meet, so it can be caught on a screen. A virtual image is where diverging rays appear to come from when traced backwards. It can\u2019t be projected.",bullets:["Describe an image by: enlarged, same size or diminished; upright or inverted; real or virtual."]},{type:"teach",s:1,title:"The magnifying glass",text:"If the object is closer to a converging lens than F, the rays don\u2019t meet. Traced back, they form a virtual, upright, enlarged image on the same side as the object.",svg:{k:"lens",f:2,u:1.2}},{type:"mc",s:1,q:"How must you hold a magnifying glass?",options:["With the object closer to the lens than the principal focus","With the object at 2F","With the object far beyond 2F","With the object exactly at F"],a:0},{type:"teach",s:1,title:"Correcting eyesight",text:"Glasses fix where the eye focuses light.",bullets:["Short sight: distant things are blurry because the eye focuses light in front of the retina. Correct with a diverging lens.","Long sight: near things are blurry because the eye focuses light behind the retina. Correct with a converging lens."]},{type:"match",s:1,q:"Match each eye problem to its correction.",pairs:[["Short sight","Diverging lens"],["Long sight","Converging lens"]]}]},W6:{name:"Dispersion of light",ex:[{type:"teach",title:"Splitting white light",text:"When white light passes through a glass prism, each colour refracts by a different amount. The light spreads out into a spectrum. This is dispersion.",svg:{k:"prism"},bullets:["The seven colours, in order: red, orange, yellow, green, blue, indigo, violet.","Red has the longest wavelength and lowest frequency. It is refracted least.","Violet has the shortest wavelength and highest frequency. It is refracted most."]},{type:"order",q:"Put the colours in order of increasing frequency.",items:["Red","Orange","Yellow","Green","Blue","Indigo","Violet"],short:!0},{type:"mc",q:"Which colour is refracted most by a prism?",options:["Violet","Red","Green","Yellow"],a:0},{type:"mc",q:"Which colour of visible light has the longest wavelength?",options:["Red","Violet","Blue","Green"],a:0},{type:"mc",s:1,q:"What is monochromatic light?",options:["Light of a single frequency","White light","Light that has passed through a prism","Very bright light"],a:0,why:"A laser is a good example: one colour, one frequency."},{type:"mc",q:"What is dispersion?",options:["White light splitting into colours because each colour refracts differently","Light reflecting off a mirror","Light spreading through a gap","Light being absorbed by black surfaces"],a:0}]},W7:{name:"The EM spectrum",ex:[{type:"teach",title:"The family of electromagnetic waves",text:"Electromagnetic waves are transverse and can travel through a vacuum. All of them travel at the same speed in a vacuum.",svg:{k:"spectrum"},bullets:["In order of increasing frequency (decreasing wavelength): radio, microwave, infrared, visible, ultraviolet, X-ray, gamma."]},{type:"order",q:"Put the electromagnetic spectrum in order of increasing frequency.",items:["Radio waves","Microwaves","Infrared","Visible light","Ultraviolet","X-rays","Gamma rays"],short:!0},{type:"teach",title:"Uses",text:"Each region has typical uses:",bullets:["Radio: radio and TV broadcasts, astronomy, RFID tags","Microwaves: satellite TV, mobile phones, microwave ovens","Infrared: grills, remote controls, thermal imaging, optical fibres","Visible: seeing, photography, lighting","Ultraviolet: security marking, detecting fake notes, sterilising water","X-rays: medical scanning, airport security","Gamma: sterilising food and medical equipment, detecting and treating cancer"]},{type:"match",q:"Match each use to the wave.",pairs:[["Thermal imaging camera","Infrared"],["Checking for forged banknotes","Ultraviolet"],["Sterilising surgical instruments","Gamma rays"],["Satellite television","Microwaves"],["Seeing broken bones","X-rays"],["RFID tags","Radio waves"]]},{type:"mc",q:"Which electromagnetic wave has the longest wavelength?",options:["Radio waves","Gamma rays","Visible light","Microwaves"],a:0},{type:"num",s:1,q:"A radio wave has a wavelength of 3.0 m. What is its frequency, in Hz? (speed = 3.0 \xd7 10\u2078 m/s)",a:1e8,unit:"Hz",work:["f = v \xf7 \u03bb","= 3.0 \xd7 10\u2078 \xf7 3.0","= 1.0 \xd7 10\u2078 Hz"],why:"You can type 1e8."},{type:"mc",s:1,q:"What is the speed of electromagnetic waves in a vacuum?",options:["3.0 \xd7 10\u2078 m/s","340 m/s","3.0 \xd7 10\u2076 m/s","It depends on the frequency"],a:0}]},W8:{name:"Dangers & signals",ex:[{type:"teach",title:"Too much exposure",text:"Each type of radiation can harm the body in its own way:",bullets:["Microwaves: heat the cells inside the body.","Infrared: burns the skin.","Ultraviolet: damages surface cells and eyes, and can cause skin cancer and eye conditions.","X-rays and gamma rays: cause mutations and damage to cells."]},{type:"match",q:"Match each radiation to its main danger.",pairs:[["Microwaves","Internal heating of body cells"],["Infrared","Skin burns"],["Ultraviolet","Skin cancer and eye damage"],["Gamma rays","Cell mutation"]]},{type:"teach",title:"Satellites",text:"Artificial satellites use microwaves to communicate.",bullets:["Low-orbit satellites: used for satellite phones.","Geostationary satellites: used for some satellite phones and direct broadcast TV."]},{type:"mc",q:"Which waves are used to communicate with satellites?",options:["Microwaves","Gamma rays","Ultraviolet","Sound waves"],a:0},{type:"teach",s:1,title:"Waves for communication",text:"Different waves suit different jobs:",bullets:["Mobile phones and wireless internet use microwaves: they pass through walls and only need short aerials.","Bluetooth uses radio waves: they pass through walls but the signal weakens.","Optical fibres use visible light or infrared, for cable TV and fast broadband: glass is transparent to them, and they carry data at high rates."]},{type:"teach",s:1,title:"Analogue and digital",text:"An analogue signal varies continuously. A digital signal has only two values: on and off (1 and 0). Sound can be sent either way.",svg:{k:"signals"},bullets:["Digital signals carry data at a higher rate.","Noise picked up along the way can be removed, because the signal is regenerated accurately as 1s and 0s. So digital signals can travel further."]},{type:"mc",s:1,q:"Why can digital signals travel further than analogue signals without losing quality?",options:["They can be regenerated accurately, removing noise","They travel faster","They never pick up noise","They use more energy"],a:0},{type:"mc",s:1,q:"Why do mobile phones use microwaves?",options:["Microwaves pass through walls and need only short aerials","Microwaves can\u2019t pass through walls","Microwaves are the longest waves","Microwaves don\u2019t weaken at all"],a:0}]},W9:{name:"Sound",ex:[{type:"teach",title:"Making sound",text:"Sound is produced by vibrating objects. It travels as a longitudinal wave.",bullets:["Sound needs a medium (solid, liquid or gas). It can\u2019t travel through a vacuum.","Humans hear from about 20 Hz to 20 000 Hz.","The speed of sound in air is about 330 to 350 m/s."]},{type:"mc",q:"An electric bell rings inside a jar. Air is pumped out of the jar. What happens?",options:["The sound gets quieter, because sound needs a medium","The sound gets louder","The pitch gets higher","Nothing changes"],a:0},{type:"teach",title:"Loudness and pitch",text:"Two properties change what you hear.",bullets:["Larger amplitude: louder sound.","Higher frequency: higher pitch."]},{type:"mc",q:"A guitar string is plucked harder. What changes?",options:["The amplitude increases, so it sounds louder","The frequency increases, so it sounds higher","The speed of the sound increases","The wavelength increases"],a:0},{type:"teach",title:"Measuring the speed of sound",text:"Two students stand a long distance apart, say 400 m, measured with a tape.",list:["One bangs two blocks together above their head.","The other starts a stopwatch on seeing the blocks hit, and stops it on hearing the bang.","Speed = distance \xf7 time. Repeat several times and average."]},{type:"num",q:"Two students stand 400 m apart. The bang is heard 1.2 s after it is seen. What is the speed of sound?",a:333,unit:"m/s",work:["v = s \xf7 t","= 400 \xf7 1.2","= 333 m/s"]},{type:"teach",s:1,title:"Compressions and rarefactions",text:"In a sound wave, air particles vibrate back and forth along the direction of travel.",svg:{k:"long"},bullets:["Compressions: regions where particles are squashed close together.","Rarefactions: regions where particles are spread out.","Sound travels faster in solids than in liquids, and faster in liquids than in gases."]},{type:"order",s:1,q:"Order these from slowest to fastest speed of sound.",items:["Air","Water","Steel"]}]},W10:{name:"Echoes & ultrasound",ex:[{type:"teach",title:"Echoes",text:"An echo is a sound reflected from a hard surface. The sound goes there and back, so it travels twice the distance to the surface.",eq:"distance to wall = speed \xd7 time \xf7 2"},{type:"num",q:"A student claps 85 m from a wall and hears the echo 0.50 s later. What is the speed of sound?",a:340,unit:"m/s",work:["distance travelled = 2 \xd7 85 = 170 m","v = 170 \xf7 0.50","= 340 m/s"]},{type:"mc",q:"Why do we halve the time (or double the distance) in echo questions?",options:["The sound travels to the wall and back again","Sound slows down after reflecting","Half the sound is absorbed","Because the wall vibrates"],a:0},{type:"teach",title:"Ultrasound",text:"Ultrasound is sound with a frequency above 20 kHz, too high for humans to hear."},{type:"mc",q:"Which frequency is ultrasound?",options:["30 kHz","15 kHz","500 Hz","20 Hz"],a:0},{type:"teach",s:1,title:"Using ultrasound",text:"Ultrasound pulses reflect from boundaries. Timing the echoes tells you distances.",bullets:["Non-destructive testing: finding cracks inside metal.","Medical scanning of soft tissue, such as an unborn baby.","Sonar: finding the depth of water or locating shoals of fish."]},{type:"num",s:1,q:"A ship sends an ultrasound pulse down. The echo returns after 0.40 s. Sound travels at 1500 m/s in seawater. How deep is the water?",a:300,unit:"m",work:["distance there and back = 1500 \xd7 0.40 = 600 m","depth = 600 \xf7 2","= 300 m"]},{type:"num",s:1,q:"In a scan, an echo from a boundary inside the body returns after 0.000 10 s. Ultrasound travels at 1500 m/s in tissue. How deep is the boundary, in cm?",a:7.5,unit:"cm",work:["distance there and back = 1500 \xd7 0.000 10 = 0.15 m","depth = 0.15 \xf7 2 = 0.075 m","= 7.5 cm"]}]}}),e.push({id:"t4",tab:"Topic 4",title:"Electricity & magnetism",units:[{code:"4.1",title:"Magnetism",sub:"Poles, magnetic materials and fields",lessons:["E1"],guide:["Like poles repel; unlike poles attract. Magnets attract magnetic materials: iron, steel, nickel, cobalt.","Induced magnetism: a magnetic material near a magnet becomes a magnet itself.","Soft iron makes temporary magnets. Steel makes permanent magnets.","A magnetic field is a region where a magnetic pole feels a force. Field lines go from N to S.","The direction of the field is the direction of the force on a N pole. Plot it with a compass or iron filings.",{s:1,t:"Field lines closer together mean a stronger field."}]},{code:"4.2",title:"Electrical quantities",sub:"Charge, current, e.m.f., p.d., resistance, power",lessons:["E2","E3","E4","E5"],guide:["Rubbing transfers electrons. Gaining electrons makes an object negative; losing them makes it positive.","Conductors (metals) have free electrons. Insulators don\u2019t.","Current is a flow of charge. Ammeters go in series; voltmeters go in parallel.",{s:1,t:"I = Q/t. Charge is in coulombs (C). Conventional current flows from + to \u2212; electrons flow from \u2212 to +."},"E.m.f. is the work done by a source per unit charge around a complete circuit. P.d. is the work done per unit charge through a component. Both are in volts.",{s:1,t:"E = W/Q and V = W/Q."},"R = V/I. A longer wire has more resistance; a thicker wire has less.",{s:1,t:"I\u2013V graphs: straight line for a resistor, curve for a filament lamp (gets hotter, more resistance), one-way for a diode."},"P = IV and E = IVt. 1 kWh is the energy a 1 kW appliance uses in 1 hour."]},{code:"4.3",title:"Electric circuits",sub:"Components, series and parallel, potential dividers",lessons:["E6","E7","E8"],guide:["Thermistor (NTC): resistance falls as temperature rises. LDR: resistance falls as light gets brighter.","Series: the same current everywhere. Total resistance = R\u2081 + R\u2082. Cell e.m.f.s add.","Parallel: the source current is bigger than the current in any branch. Two resistors in parallel have less resistance than either one.","Lamps at home are in parallel: each gets the full voltage and can be switched on its own.",{s:1,t:"Current into a junction = current out. 1/R = 1/R\u2081 + 1/R\u2082 for two resistors in parallel."},{s:1,t:"Potential divider: R\u2081/R\u2082 = V\u2081/V\u2082."},{s:1,t:"A diode lets current through in one direction only. An LED gives out light when current flows."}]},{code:"4.4",title:"Electrical safety",sub:"Hazards, fuses, trip switches and earthing",lessons:["E9"],guide:["Hazards: damaged insulation, overheating cables, damp conditions, overloaded sockets and extension leads.","Mains wiring: live, neutral and earth. Switches and fuses go in the live wire.","A fuse melts if the current is too big. Pick a rating just above the normal current.","A trip switch (circuit breaker) opens automatically and can be reset.","Metal cases must be earthed. Double-insulated appliances have a plastic case and need no earth."]},{code:"4.5",title:"Electromagnetic effects",sub:"Induction, generators, motors and transformers",lessons:["E10","E11","E12","E13","E14"],guide:["Moving a conductor through a magnetic field (or changing the field through a coil) induces an e.m.f.","Bigger induced e.m.f.: move faster, use a stronger magnet, use more turns.",{s:1,t:"The induced e.m.f. opposes the change that causes it."},{s:1,t:"An a.c. generator uses slip rings and brushes. The e.m.f. is biggest when the coil cuts the field lines fastest."},"A current in a wire makes a circular magnetic field. A solenoid\u2019s field is like a bar magnet\u2019s.","Relays and loudspeakers use the magnetic effect of a current.","A current-carrying wire in a magnetic field feels a force. Reverse the current or the field to reverse the force.",{s:1,t:"Fleming\u2019s left-hand rule: First finger Field, seCond finger Current, thuMb Motion. The split-ring commutator keeps a d.c. motor turning one way."},"Transformer: V\u209a/V\u209b = N\u209a/N\u209b. High-voltage transmission means a smaller current, so less energy is lost in the cables.",{s:1,t:"Ideal transformer: I\u209aV\u209a = I\u209bV\u209b. Power lost in cables: P = I\xb2R."}]}]}),Object.assign(t,{E1:{name:"Magnets & fields",ex:[{type:"teach",title:"Poles and materials",text:"A magnet has a north (N) pole and a south (S) pole.",bullets:["Like poles repel. Unlike poles attract.","Magnets attract magnetic materials: iron, steel, nickel and cobalt.","Most metals are non-magnetic: copper, aluminium, brass, gold.","Only repulsion proves something is a magnet. A magnetic material is attracted to both poles."]},{type:"multi",q:"Which materials are attracted to a magnet?",options:["Iron","Steel","Nickel","Cobalt","Copper","Aluminium","Plastic"],correct:[0,1,2,3]},{type:"teach",title:"Induced and permanent magnetism",text:"A magnetic material placed near a magnet becomes a magnet too. This is induced magnetism: it is why paper clips hang in a chain from a magnet.",bullets:["Soft iron: magnetised easily, but loses its magnetism easily. Good for temporary magnets and electromagnet cores.","Steel: harder to magnetise, but keeps its magnetism. Good for permanent magnets."]},{type:"mc",q:"Why is the core of an electromagnet made of soft iron?",options:["It magnetises easily and loses its magnetism when the current is switched off","It keeps its magnetism permanently","It is non-magnetic","It is a good insulator"],a:0},{type:"teach",title:"Magnetic fields",text:"A magnetic field is a region where a magnetic pole experiences a force.",svg:{k:"magnet"},bullets:["The direction of the field at a point is the direction of the force on a north pole.","Field lines point from N to S outside the magnet.","Plot the field with a small plotting compass, moved step by step, or sprinkle iron filings to see the pattern."]},{type:"mc",q:"Outside a bar magnet, which way do the field lines point?",options:["From the N pole to the S pole","From the S pole to the N pole","Towards both poles","Away from both poles"],a:0},{type:"teach",title:"Using magnets",text:"Permanent magnets are used in fridge doors, compasses, loudspeakers and motors. Electromagnets can be switched on and off, so they are used in scrapyard cranes, relays, electric bells and door locks."},{type:"teach",s:1,title:"Field strength",text:"Magnetic forces come from interacting magnetic fields. Where field lines are closer together, the field is stronger."},{type:"mc",s:1,q:"Where is the magnetic field of a bar magnet strongest?",options:["Near the poles, where the lines are closest","In the middle of the side","Far from the magnet","It is the same everywhere"],a:0}]},E2:{name:"Electric charge",ex:[{type:"teach",title:"Positive and negative",text:"There are two kinds of charge: positive and negative.",bullets:["Like charges repel. Unlike charges attract.","Rubbing two insulators together transfers electrons (negative charge) from one to the other. Positive charges do not move.","The object that gains electrons becomes negative. The object that loses electrons becomes positive."]},{type:"mc",q:"A polythene rod becomes negatively charged when rubbed with a cloth. What happened?",options:["Electrons moved from the cloth to the rod","Protons moved from the rod to the cloth","Electrons moved from the rod to the cloth","Positive charge was created"],a:0},{type:"mc",q:"An acetate rod becomes positively charged when rubbed. Why?",options:["It lost electrons","It gained protons","It gained electrons","It gained positive electrons"],a:0},{type:"teach",title:"Detecting charge, and conductors",text:"A charged object attracts small bits of paper, or makes the leaf of a gold-leaf electroscope rise.",bullets:["Conductors (metals) contain free electrons that can move easily.","Insulators (plastic, rubber, glass, dry wood) have no free electrons.","To test a material, connect it into a circuit with a cell and a lamp. The lamp lights if it conducts."]},{type:"mc",q:"Why do metals conduct electricity?",options:["They contain free electrons that can move","They contain free protons","They are always charged","Their atoms are very far apart"],a:0},{type:"teach",s:1,title:"Electric fields",text:"Charge is measured in coulombs (C). An electric field is a region where a charge experiences a force. Its direction is the direction of the force on a positive charge.",svg:{k:"efield",t:"plates"},bullets:["Around a positive point charge (or charged sphere): straight lines pointing outwards.","Around a negative charge: straight lines pointing inwards.","Between oppositely charged parallel plates: straight, parallel, evenly spaced lines from + to \u2212."]},{type:"mc",s:1,q:"Which way do the electric field lines point around a negative point charge?",svg:{k:"efield",t:"neg",noDir:1},options:["Inwards, towards the charge","Outwards, away from the charge","In circles around it","There is no field"],a:0,why:"Field lines show the force on a positive charge. A positive charge is pulled towards a negative charge, so the lines point inwards."},{type:"mc",s:1,q:"Describe the field between two oppositely charged parallel plates.",options:["Straight, parallel, evenly spaced lines from + to \u2212","Circles around the plates","Curved lines from \u2212 to +","Lines that get closer towards the middle"],a:0}]},E3:{name:"Current, e.m.f. & p.d.",ex:[{type:"teach",title:"Electric current",text:"An electric current is a flow of charge. In metals, the charges that move are free electrons.",bullets:["Measure current with an ammeter, connected in series. It can be analogue or digital; pick a suitable range.","Direct current (d.c.) flows in one direction only (from a cell or battery).","Alternating current (a.c.) keeps reversing direction (mains electricity)."]},{type:"mc",q:"How is an ammeter connected in a circuit?",options:["In series with the component","In parallel with the component","Across the cell only","It doesn\u2019t matter"],a:0},{type:"teach",s:1,title:"Current and charge",text:"Current is the charge passing a point per unit time.",eq:"I = Q / t",bullets:["I in amperes (A), Q in coulombs (C), t in seconds.","Conventional current flows from + to \u2212. Electrons actually flow from \u2212 to +."]},{type:"num",s:1,q:"6.0 C of charge passes a point in 3.0 s. What is the current?",a:2,unit:"A",work:["I = Q \xf7 t","= 6.0 \xf7 3.0","= 2.0 A"]},{type:"num",s:1,q:"A current of 0.50 A flows for 2.0 minutes. How much charge passes?",a:60,unit:"C",work:["t = 120 s","Q = I \xd7 t = 0.50 \xd7 120","= 60 C"]},{type:"teach",title:"E.m.f. and p.d.",text:"Both are measured in volts (V), with a voltmeter connected in parallel.",bullets:["Electromotive force (e.m.f.): the electrical work done by a source in moving a unit charge around a complete circuit.","Potential difference (p.d.): the work done by a unit charge passing through a component."]},{type:"mc",q:"How is a voltmeter connected?",options:["In parallel, across the component","In series with the component","Anywhere in the circuit","Only across the cell"],a:0},{type:"teach",s:1,title:"Volts are joules per coulomb",text:"Both e.m.f. and p.d. are work done per unit charge.",eq:"E = W / Q      V = W / Q"},{type:"num",s:1,q:"A 12 V battery drives 5.0 C of charge around a circuit. How much work does it do?",a:60,unit:"J",work:["W = E \xd7 Q","= 12 \xd7 5.0","= 60 J"]},{type:"num",s:1,q:"24 J of energy is transferred when 4.0 C passes through a lamp. What is the p.d. across the lamp?",a:6,unit:"V",work:["V = W \xf7 Q","= 24 \xf7 4.0","= 6.0 V"]}]},E4:{name:"Resistance",ex:[{type:"teach",title:"Resistance",text:"Resistance is the p.d. across a component divided by the current through it.",eq:"R = V / I",bullets:["R in ohms (\u03a9), V in volts, I in amperes."]},{type:"num",q:"A resistor has 6.0 V across it and a current of 0.30 A. What is its resistance?",a:20,unit:"\u03a9",work:["R = V \xf7 I","= 6.0 \xf7 0.30","= 20 \u03a9"]},{type:"num",q:"A current of 0.50 A flows through a 12 \u03a9 resistor. What is the p.d. across it?",a:6,unit:"V",work:["V = I \xd7 R","= 0.50 \xd7 12","= 6.0 V"]},{type:"teach",title:"Measuring resistance",text:"Connect an ammeter in series with the component and a voltmeter across it. Use a variable resistor to change the current, take several readings, and work out R = V/I each time.",svg:{k:"series",src:"",parts:[["A"],["R","R"],["VR"]],v:[1]}},{type:"teach",title:"Wires",text:"For a metal wire:",bullets:["Longer wire: more resistance.","Thicker wire (bigger cross-sectional area): less resistance."]},{type:"mc",q:"Which wire has the most resistance? All are made of the same metal.",options:["Long and thin","Short and thick","Long and thick","Short and thin"],a:0},{type:"teach",s:1,title:"Proportional relationships",text:"For a metallic conductor: resistance is directly proportional to length, and inversely proportional to cross-sectional area."},{type:"num",s:1,q:"2.0 m of a wire has a resistance of 4.0 \u03a9. What is the resistance of 6.0 m of the same wire?",a:12,unit:"\u03a9",work:["Length is 3 times bigger","R = 3 \xd7 4.0 = 12 \u03a9"]},{type:"num",s:1,q:"A wire has a resistance of 8.0 \u03a9. Another wire of the same metal and length has twice the cross-sectional area. What is its resistance?",a:4,unit:"\u03a9",work:["R is inversely proportional to area","double the area, half the resistance: 4.0 \u03a9"]},{type:"teach",s:1,title:"Current\u2013voltage graphs",text:"Learn the three shapes.",svg:{k:"iv3"},bullets:["Fixed resistor: a straight line through the origin. Constant resistance.","Filament lamp: a curve that gets flatter. As the filament heats up, its resistance increases.","Diode: almost no current one way; current flows the other way once the p.d. is big enough."]},{type:"mc",s:1,q:"Why does the I\u2013V graph for a filament lamp curve?",options:["The filament gets hotter and its resistance increases","The lamp runs out of charge","The resistance decreases as it heats","The voltmeter is inaccurate"],a:0},{type:"mc",s:1,q:"Which component lets current flow in one direction only?",options:["Diode","Filament lamp","Fixed resistor","Thermistor"],a:0}]},E5:{name:"Electrical power & energy",ex:[{type:"teach",title:"Power and energy",text:"Circuits transfer energy from the source (a cell or the mains) to components and the surroundings.",eq:"P = I \xd7 V      E = I \xd7 V \xd7 t",bullets:["P in W, I in A, V in V, t in s, E in J."]},{type:"num",q:"A heater runs on 230 V and draws a current of 5.0 A. What is its power?",a:1150,unit:"W",work:["P = IV","= 5.0 \xd7 230","= 1150 W"]},{type:"num",q:"A 12 V lamp has a current of 2.0 A for 60 s. How much energy does it transfer?",a:1440,unit:"J",work:["E = IVt","= 2.0 \xd7 12 \xd7 60","= 1440 J"]},{type:"num",q:"A 2300 W kettle runs on 230 V. What current does it draw?",a:10,unit:"A",work:["I = P \xf7 V","= 2300 \xf7 230","= 10 A"]},{type:"teach",title:"The kilowatt-hour",text:"Electricity companies charge by the kilowatt-hour (kWh): the energy transferred by a 1 kW appliance in 1 hour.",eq:"energy (kWh) = power (kW) \xd7 time (h)",bullets:["cost = number of kWh \xd7 price per kWh","1 kWh = 3.6 million joules"]},{type:"num",q:"A 2.0 kW heater is on for 3.0 hours. How many kWh does it use?",a:6,unit:"kWh",work:["E = 2.0 \xd7 3.0","= 6.0 kWh"]},{type:"num",q:"Electricity costs 15 cents per kWh. What does it cost to run that 2.0 kW heater for 3.0 hours, in cents?",a:90,unit:"cents",work:["6.0 kWh \xd7 15","= 90 cents"]},{type:"num",q:"How many hours can a 100 W lamp run on 1.0 kWh?",a:10,unit:"h",work:["100 W = 0.10 kW","t = 1.0 \xf7 0.10 = 10 h"]},{type:"mc",q:"What does a kilowatt-hour measure?",options:["Energy","Power","Current","Time"],a:0}]},E6:{name:"Circuit components",ex:[{type:"teach",title:"Know your symbols",text:"You need to draw and recognise these symbols, and know what each component does.",svg:{k:"symgrid"},bullets:["Variable resistor: changes the current.","Thermistor (NTC): its resistance falls as the temperature rises.","LDR: its resistance falls as the light gets brighter.","Fuse: melts if the current is too large.","Relay: a switch worked by an electromagnet."]},{type:"mc",q:"Which component is this?",svg:{k:"sym",c:"LDR"},options:["Light-dependent resistor (LDR)","Thermistor","Variable resistor","Fuse"],a:0},{type:"mc",q:"Which component is this?",svg:{k:"sym",c:"TH"},options:["Thermistor","LDR","Diode","Heater"],a:0},{type:"mc",q:"Which component is this?",svg:{k:"sym",c:"F"},options:["Fuse","Resistor","Lamp","Switch"],a:0},{type:"mc",q:"Which component is this?",svg:{k:"sym",c:"VR"},options:["Variable resistor","Thermistor","Fixed resistor","LDR"],a:0},{type:"mc",q:"What happens to the resistance of an LDR when the light gets brighter?",options:["It decreases","It increases","It stays the same","It becomes infinite"],a:0},{type:"mc",q:"What happens to the resistance of an NTC thermistor when it gets hotter?",options:["It decreases","It increases","It stays the same","It melts"],a:0},{type:"teach",s:1,title:"Diodes and LEDs",text:"A diode lets current flow in one direction only (the way its arrow points). An LED is a diode that gives out light when current flows through it."},{type:"mc",s:1,q:"Which component is this?",svg:{k:"sym",c:"LED"},options:["Light-emitting diode (LED)","Diode","LDR","Lamp"],a:0},{type:"mc",s:1,q:"Which component is this?",svg:{k:"sym",c:"D"},options:["Diode","LED","Cell","Fuse"],a:0}]},E7:{name:"Series & parallel",ex:[{type:"teach",title:"Series circuits",text:"Components in series are in one loop.",svg:{k:"series",src:"6.0 V",parts:[["R","4 \u03a9"],["R","8 \u03a9"],["A"]]},bullets:["The current is the same at every point.","Total resistance = R\u2081 + R\u2082 + \u2026","Cells in series (facing the same way): add their e.m.f.s."]},{type:"num",q:"What is the combined resistance of 4 \u03a9 and 8 \u03a9 in series?",a:12,unit:"\u03a9",work:["R = 4 + 8 = 12 \u03a9"]},{type:"num",q:"What current does the ammeter read?",svg:{k:"series",src:"6.0 V",parts:[["R","4 \u03a9"],["R","8 \u03a9"],["A"]]},a:.5,unit:"A",work:["R = 4 + 8 = 12 \u03a9","I = V \xf7 R = 6.0 \xf7 12","= 0.50 A"]},{type:"num",q:"Three 1.5 V cells are connected in series, all the same way round. What is the total e.m.f.?",a:4.5,unit:"V",work:["1.5 + 1.5 + 1.5 = 4.5 V"]},{type:"teach",title:"Parallel circuits",text:"Components in parallel are on separate branches.",svg:{k:"parallel",src:"12 V",main:[["A"]],br:[[["R","6 \u03a9"]],[["R","3 \u03a9"]]]},bullets:["The current from the source is bigger than the current in any one branch.","Two resistors in parallel have a smaller combined resistance than either one alone.","House lights are in parallel: each lamp gets the full mains p.d., can be switched on and off separately, and stays on if another lamp breaks."]},{type:"mc",q:"Why are the lamps in a house wired in parallel?",options:["Each can be switched separately and gets the full p.d.","It uses less wire","The current is the same in every lamp","If one lamp breaks they all go off"],a:0},{type:"teach",s:1,title:"The rules for calculations",text:"Use these:",bullets:["Current into a junction = current out of it.","Series: the p.d.s across the components add up to the source p.d.","Parallel: every branch has the same p.d. as the source."],eq:"parallel: 1/R = 1/R\u2081 + 1/R\u2082"},{type:"num",s:1,q:"What is the combined resistance of 6 \u03a9 and 3 \u03a9 in parallel?",a:2,unit:"\u03a9",work:["1/R = 1/6 + 1/3 = 1/6 + 2/6 = 3/6","R = 6 \xf7 3 = 2 \u03a9"]},{type:"num",s:1,q:"What current does the ammeter in the main circuit read?",svg:{k:"parallel",src:"12 V",main:[["A"]],br:[[["R","6 \u03a9"]],[["R","3 \u03a9"]]]},a:6,unit:"A",work:["each branch has 12 V","6 \u03a9 branch: 12 \xf7 6 = 2 A","3 \u03a9 branch: 12 \xf7 3 = 4 A","total = 2 + 4 = 6 A"]},{type:"num",s:1,q:"A 4 \u03a9 and an 8 \u03a9 resistor are in series with a 6.0 V supply. What is the p.d. across the 8 \u03a9 resistor?",a:4,unit:"V",work:["I = 6.0 \xf7 12 = 0.50 A","V = 0.50 \xd7 8 = 4.0 V"]},{type:"num",s:1,q:"0.80 A flows into a junction. One branch leaving it carries 0.30 A. What does the other branch carry?",a:.5,unit:"A",work:["0.80 \u2212 0.30 = 0.50 A"]}]},E8:{name:"Potential dividers",ex:[{type:"teach",title:"Sharing the p.d.",text:"With the same current through each, the component with the bigger resistance has the bigger p.d. across it."},{type:"mc",q:"A 2 k\u03a9 and an 8 k\u03a9 resistor are in series with a battery. Which has the larger p.d. across it?",options:["The 8 k\u03a9 resistor","The 2 k\u03a9 resistor","They have the same p.d.","It depends on the current direction"],a:0},{type:"teach",s:1,title:"Potential dividers",text:"Two resistors in series across a supply share the p.d. in the ratio of their resistances.",svg:{k:"series",src:"9 V",parts:[["R","1 k\u03a9"],["R","2 k\u03a9"]],v:[1]},eq:"R\u2081 / R\u2082 = V\u2081 / V\u2082",bullets:["A variable potential divider uses a variable resistor (or a sliding contact) so you can change the output p.d."]},{type:"num",s:1,q:"A 9.0 V supply is connected across a 1 k\u03a9 and a 2 k\u03a9 resistor in series. What is the p.d. across the 2 k\u03a9 resistor?",svg:{k:"series",src:"9 V",parts:[["R","1 k\u03a9"],["R","2 k\u03a9"]],v:[1]},a:6,unit:"V",work:["2 k\u03a9 is 2/3 of the total resistance","V = 2/3 \xd7 9.0 = 6.0 V"]},{type:"num",s:1,q:"In a potential divider, V\u2081 = 4.0 V across R\u2081 = 50 \u03a9 and V\u2082 = 8.0 V across R\u2082. What is R\u2082?",a:100,unit:"\u03a9",work:["R\u2081/R\u2082 = V\u2081/V\u2082","50/R\u2082 = 4.0/8.0","R\u2082 = 100 \u03a9"]},{type:"teach",s:1,title:"Sensor circuits",text:"Put an LDR or thermistor in a potential divider and the output p.d. changes with light or temperature.",svg:{k:"series",src:"6 V",parts:[["R",""],["LDR",""]],v:[1]},bullets:["It gets darker: the LDR\u2019s resistance goes up, so its share of the p.d. goes up."]},{type:"mc",s:1,q:"In the circuit, the room gets darker. What happens to the voltmeter reading across the LDR?",svg:{k:"series",src:"6 V",parts:[["R",""],["LDR",""]],v:[1]},options:["It increases","It decreases","It stays the same","It drops to zero"],a:0,why:"Darker means more LDR resistance, so it takes a bigger share of the 6 V."},{type:"mc",s:1,q:"A thermistor replaces the LDR. The room warms up. What happens to the p.d. across the thermistor?",options:["It decreases","It increases","It stays the same","It doubles"],a:0,why:"Warmer means less thermistor resistance, so it takes a smaller share."}]},E9:{name:"Electrical safety",ex:[{type:"teach",title:"Mains hazards",text:"Mains electricity can kill. Look out for:",bullets:["damaged insulation, which exposes live wires","cables overheating because they carry too much current","damp conditions: water conducts","too much current from overloaded plugs, extension leads or sockets"]},{type:"multi",q:"Which of these are electrical hazards?",options:["Frayed cable insulation","Using a hairdryer in a steamy bathroom","Plugging six heaters into one extension lead","A plastic-cased appliance in a dry room","Correctly rated fuses"],correct:[0,1,2]},{type:"teach",title:"Live, neutral and earth",text:"A mains circuit has a live wire, a neutral wire and an earth wire.",bullets:["The switch must be in the live wire. Then switching off disconnects the appliance from the high voltage.","A switch in the neutral wire would leave the appliance live even when off."]},{type:"mc",q:"Why is the switch connected in the live wire?",options:["So switching off disconnects the appliance from the live voltage","So the appliance uses less energy","Because the neutral wire carries no current","So the fuse lasts longer"],a:0},{type:"teach",title:"Fuses and trip switches",text:"Both cut off the current if it gets too big.",bullets:["A fuse contains a thin wire that melts if the current is larger than its rating. Choose a rating just above the normal current.","A trip switch (circuit breaker) opens automatically when the current is too large, and can be reset."]},{type:"num",q:"An appliance is rated 920 W at 230 V. What current does it normally draw?",a:4,unit:"A",work:["I = P \xf7 V","= 920 \xf7 230","= 4.0 A"]},{type:"mc",q:"Which fuse should the 920 W, 230 V appliance (4.0 A) use?",options:["5 A","3 A","13 A","30 A"],a:0,why:"Just above the normal current. 3 A would blow straight away; 13 A might not blow before the cable overheats."},{type:"teach",title:"Earthing and double insulation",text:"Two ways to stop a metal case becoming live:",bullets:["Earthing: the metal case is connected to the earth wire. If a live wire touches the case, a large current flows to earth and the fuse melts.","Double insulation: the case is non-conducting (plastic), so it can\u2019t become live. No earth wire is needed; the fuse still protects the cable."]},{type:"mc",q:"A fault makes the live wire touch an earthed metal kettle. What happens?",options:["A large current flows to earth and the fuse melts","The kettle becomes live and stays live","The current stops immediately with no fuse needed","The neutral wire melts"],a:0}]},E10:{name:"Electromagnetic induction",ex:[{type:"teach",title:"Inducing an e.m.f.",text:"An e.m.f. is induced in a conductor when it moves across a magnetic field, or when the magnetic field through it changes. If the circuit is complete, a current flows.",bullets:["Demonstration: push a magnet into a coil connected to a sensitive meter. The needle flicks. Pull it out: it flicks the other way.","If the magnet stays still, nothing happens."]},{type:"mc",q:"A magnet is held still inside a coil. What does the meter show?",options:["Zero: there is no change, so no e.m.f.","A steady current","A current that keeps reversing","A large current"],a:0},{type:"multi",q:"Which changes make the induced e.m.f. bigger?",options:["Moving the magnet faster","Using a stronger magnet","Using a coil with more turns","Holding the magnet still","Using thinner insulation"],correct:[0,1,2]},{type:"teach",s:1,title:"Which direction?",text:"The direction of the induced e.m.f. always opposes the change that produced it.",bullets:["Push a N pole into a coil: the near end of the coil becomes a N pole, repelling the magnet.","Pull it out: the near end becomes a S pole, attracting it back. The current reverses.","Fleming\u2019s right-hand rule gives the relative directions: thuMb Motion, First finger Field, seCond finger Current."]},{type:"mc",s:1,q:"A north pole is pushed into a coil. What pole forms at the end of the coil nearest the magnet?",options:["A north pole, which repels the magnet","A south pole, which attracts it","No pole forms","It alternates"],a:0},{type:"mc",s:1,q:"The magnet is then pulled out at the same speed. What happens to the induced current?",options:["It flows in the opposite direction","It flows in the same direction","It stops","It doubles"],a:0}]},E11:{name:"The a.c. generator",s:1,ex:[{type:"teach",title:"How it works",text:"A coil rotates in a magnetic field (or a magnet rotates inside a coil). As the coil cuts the field lines, an e.m.f. is induced.",bullets:["Slip rings and brushes connect the spinning coil to the outside circuit without the wires twisting.","Each half turn, the side of the coil moving up starts moving down, so the e.m.f. reverses: alternating current."]},{type:"teach",title:"The output graph",text:"The e.m.f. rises and falls like a wave.",svg:{k:"graph",x:"time",y:"e.m.f.",xm:10,ym:5,ymin:-5,lines:[{p:a(e=>4*Math.sin(e*Math.PI/2.5),0,10,80)}],noNums:1,zero:1},bullets:["Peak e.m.f.: the coil is parallel to the field, cutting field lines fastest.","Zero e.m.f.: the coil is at right angles to the field, moving along the lines, not across them."]},{type:"mc",q:"What is the job of the slip rings and brushes?",options:["To connect the rotating coil to the external circuit","To reverse the current every half turn","To make the magnet stronger","To stop the coil spinning"],a:0},{type:"mc",q:"When is the e.m.f. from a generator largest?",options:["When the plane of the coil is parallel to the field","When the coil is at right angles to the field","When the coil stops","It is always the same"],a:0},{type:"mc",q:"The coil is turned twice as fast. What happens to the output?",options:["The peak e.m.f. and the frequency both increase","Only the frequency increases","Only the peak e.m.f. increases","Nothing changes"],a:0},{type:"mc",q:"How many times does the e.m.f. reverse in one complete turn of the coil?",options:["Twice","Once","Four times","Never"],a:0}]},E12:{name:"Magnetic effect of a current",ex:[{type:"teach",title:"Fields from currents",text:"A current produces a magnetic field.",svg:{k:"wire"},bullets:["Around a straight wire: circles centred on the wire.","A solenoid (a long coil) has a field like a bar magnet\u2019s, strong and even inside.","Show the pattern with iron filings or plotting compasses on card around the wire."]},{type:"mc",q:"What shape is the magnetic field around a long straight wire carrying a current?",options:["Circles centred on the wire","Straight lines along the wire","Like a bar magnet","There is no field"],a:0},{type:"teach",title:"Relays and loudspeakers",text:"Two uses of the magnetic effect:",svg:{k:"solenoid"},bullets:["A relay: a small current in a coil magnetises a soft iron core, which pulls a switch closed in a second circuit. A small, safe current can switch a large one, such as a car\u2019s starter motor.","A loudspeaker: a varying current in a coil, in the field of a permanent magnet, makes the coil and cone vibrate and produce sound."]},{type:"mc",q:"Why is a relay useful?",options:["A small current can switch on a circuit with a large current","It makes current flow both ways","It stores charge","It measures current"],a:0},{type:"teach",s:1,title:"Strength and direction",text:"For a wire or a solenoid:",bullets:["The field is strongest close to the wire, and inside the solenoid.","A bigger current makes a stronger field.","Reversing the current reverses the direction of the field.","More turns on the solenoid also make the field stronger."]},{type:"mc",s:1,q:"The current through a solenoid is reversed. What happens to its field?",options:["The direction reverses; the strength stays the same","It gets stronger","It disappears","Nothing changes"],a:0},{type:"multi",s:1,q:"Which make the field of a solenoid stronger?",options:["A bigger current","More turns of wire","A soft iron core","Reversing the current","A longer gap between turns"],correct:[0,1,2]}]},E13:{name:"The motor effect",ex:[{type:"teach",title:"Force on a wire",text:"A wire carrying a current in a magnetic field feels a force.",bullets:["Reverse the current: the force reverses.","Reverse the field: the force reverses.","Reverse both: the force stays the same way."]},{type:"mc",q:"Both the current and the magnetic field are reversed. What happens to the force on the wire?",options:["It stays in the same direction","It reverses","It becomes zero","It doubles"],a:0},{type:"teach",s:1,title:"Fleming\u2019s left-hand rule",text:"Hold your thumb, first finger and second finger at right angles.",bullets:["First finger: Field (N to S).","seCond finger: Current (+ to \u2212).","thuMb: Motion (the force).","A beam of charged particles is also pushed sideways. For electrons, point your second finger the opposite way to their motion, because conventional current flows the opposite way."]},{type:"mc",s:1,q:"A magnetic field points from left to right. A wire carries current into the page. Which way is the force?",options:["Downwards","Upwards","To the left","Out of the page"],a:0,why:"First finger right, second finger into the page: your thumb points down."},{type:"teach",title:"Turning a coil",text:"A current-carrying coil in a magnetic field has a turning effect on it. The turning effect is bigger with:",bullets:["more turns on the coil","a bigger current","a stronger magnetic field"]},{type:"multi",q:"Which would make a motor turn with a bigger turning effect?",options:["More turns on the coil","A bigger current","A stronger magnet","Reversing the battery","A thinner coil wire with the same current"],correct:[0,1,2]},{type:"teach",s:1,title:"The d.c. motor",text:"A split-ring commutator reverses the current in the coil every half turn. This keeps the forces turning the coil in the same direction. Carbon brushes press on the commutator to let the current in."},{type:"mc",s:1,q:"What does the split-ring commutator do in a d.c. motor?",options:["It reverses the current in the coil every half turn, so it keeps turning the same way","It makes the current alternate in the external circuit","It increases the magnetic field","It stops the coil overheating"],a:0}]},E14:{name:"Transformers",ex:[{type:"teach",title:"What a transformer does",text:"A transformer changes the size of an alternating voltage. It has a primary coil and a secondary coil wound on a soft-iron core.",svg:{k:"transformer"},eq:"V\u209a / V\u209b = N\u209a / N\u209b",bullets:["Step-up: more turns on the secondary, so the voltage goes up.","Step-down: fewer turns on the secondary, so the voltage goes down."]},{type:"num",q:"A transformer has 1000 turns on the primary and 50 turns on the secondary. The primary voltage is 230 V. What is the secondary voltage?",a:11.5,unit:"V",work:["V\u209b = V\u209a \xd7 N\u209b \xf7 N\u209a","= 230 \xd7 50 \xf7 1000","= 11.5 V"]},{type:"num",q:"A power station transformer steps 25 kV up to 400 kV. The primary has 1000 turns. How many turns does the secondary have?",a:16e3,unit:"turns",work:["N\u209b = N\u209a \xd7 V\u209b \xf7 V\u209a","= 1000 \xd7 400 \xf7 25","= 16 000 turns"]},{type:"mc",q:"A transformer has more turns on its secondary coil than its primary. What kind is it?",options:["Step-up","Step-down","Neither","It can only work with d.c."],a:0},{type:"teach",title:"High-voltage transmission",text:"Power stations use step-up transformers to send electricity across the country at very high voltages, then step-down transformers near homes.",bullets:["Higher voltage means a smaller current for the same power.","A smaller current wastes less energy heating the cables, and thinner, cheaper cables can be used."]},{type:"mc",q:"Why is electricity transmitted at very high voltage?",options:["The current is smaller, so less energy is lost heating the cables","High voltage travels faster","Homes need high voltage","It increases the power generated"],a:0},{type:"teach",s:1,title:"How it works",text:"An alternating current in the primary coil makes a changing magnetic field in the iron core. This changing field passes through the secondary coil and induces an alternating e.m.f. in it.",bullets:["With d.c., the field would be steady, so no e.m.f. would be induced."]},{type:"mc",s:1,q:"Why doesn\u2019t a transformer work with a steady d.c. supply?",options:["The magnetic field doesn\u2019t change, so no e.m.f. is induced","The core would melt","D.c. can\u2019t flow through coils","The secondary would short-circuit"],a:0},{type:"teach",s:1,title:"Power in and out",text:"For a 100% efficient transformer, power in = power out.",eq:"I\u209aV\u209a = I\u209bV\u209b",bullets:["Power lost in a cable: P = I\xb2R. Ten times less current means a hundred times less power wasted."]},{type:"num",s:1,q:"A 100% efficient transformer has 230 V and 0.50 A in the primary. The secondary voltage is 23 V. What is the secondary current?",a:5,unit:"A",work:["I\u209bV\u209b = I\u209aV\u209a","I\u209b \xd7 23 = 0.50 \xd7 230 = 115","I\u209b = 5.0 A"]},{type:"num",s:1,q:"A current of 200 A flows through a cable of resistance 0.50 \u03a9. How much power is wasted heating the cable?",a:2e4,unit:"W",work:["P = I\xb2R","= 200\xb2 \xd7 0.50","= 20 000 W"]}]}}),e.push({id:"t56",tab:"Topics 5\u20136",title:"Nuclear & space physics",units:[{code:"5.1",title:"The nucleus",sub:"Atoms, isotopes, fission and fusion",lessons:["N1","N2"],guide:["An atom has a small, positive nucleus (protons and neutrons) with negative electrons around it.","Losing electrons makes a positive ion; gaining electrons makes a negative ion.","Relative charges: proton +1, neutron 0, electron \u22121.","Proton number Z = number of protons. Nucleon number A = protons + neutrons. Neutrons = A \u2212 Z.","Isotopes: same proton number, different numbers of neutrons.",{s:1,t:"Alpha scattering showed the nucleus is tiny, positive, and holds most of the mass; the atom is mostly empty space."},{s:1,t:"Fission: a heavy nucleus splits. Fusion: light nuclei join. Both release energy."}]},{code:"5.2",title:"Radioactivity",sub:"Detection, \u03b1 \u03b2 \u03b3, decay, half-life, safety",lessons:["N3","N4","N5","N6","N7"],guide:["Background radiation comes from radon gas, rocks and buildings, food and drink, and cosmic rays.","Count rate is measured in counts/s or counts/min with a detector and counter.",{s:1,t:"Corrected count rate = measured count rate \u2212 background."},"Alpha: helium nucleus, most ionising, stopped by paper. Beta: fast electron, stopped by a few mm of aluminium. Gamma: EM wave, least ionising, reduced by thick lead.","Decay is spontaneous and random. Alpha or beta decay changes the element.",{s:1,t:"Alpha: A \u2212 4, Z \u2212 2. Beta: a neutron becomes a proton and an electron, so Z + 1. Gamma: no change to A or Z."},"Half-life: the time for half the nuclei of an isotope to decay.","Ionising radiation can kill cells, cause mutations and cancer.",{s:1,t:"Reduce exposure: less time, more distance, more shielding."}]},{code:"6.1",title:"Earth & the Solar System",sub:"Days, seasons, planets and orbits",lessons:["S1","S2"],guide:["Earth spins on a tilted axis once every 24 hours: day and night.","Earth orbits the Sun in about 365 days; the tilt causes the seasons.","The Moon orbits the Earth about once a month, giving its phases.","Planets in order: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune.","Inner planets are small and rocky; outer planets are large and gaseous (accretion model).","The Sun has most of the Solar System\u2019s mass; its gravity keeps everything in orbit.",{s:1,t:"Orbital speed v = 2\u03c0r/T. Orbits are elliptical; objects move fastest nearest the Sun."}]},{code:"6.2",title:"Stars & the Universe",sub:"Stars, galaxies, redshift and the Big Bang",lessons:["S3","S4"],guide:["The Sun is a medium-sized star made mostly of hydrogen and helium.","Galaxies contain billions of stars. The Sun is in the Milky Way, about 100 000 light-years across.","A light-year is the distance light travels in a year.",{s:1,t:"1 light-year = 9.5 \xd7 10\xb9\u2075 m. Stable stars fuse hydrogen into helium."},{s:1,t:"Life cycle: nebula, protostar, stable star, then red giant (white dwarf) or red supergiant (supernova, neutron star or black hole)."},"Redshift from distant galaxies shows the Universe is expanding, supporting the Big Bang theory.",{s:1,t:"H\u2080 = v/d \u2248 2.2 \xd7 10\u207b\xb9\u2078 s\u207b\xb9. The age of the Universe is about 1/H\u2080. CMBR is left over from the early Universe."}]}]}),Object.assign(t,{N1:{name:"Atoms & the nucleus",ex:[{type:"teach",title:"Inside an atom",text:"An atom has a tiny, positively charged nucleus in the middle, with negatively charged electrons moving around it.",svg:{k:"atom"},bullets:["The nucleus contains protons and neutrons.","An atom that loses an electron becomes a positive ion.","An atom that gains an electron becomes a negative ion."]},{type:"mc",q:"An atom loses one electron. What does it become?",options:["A positive ion","A negative ion","An isotope","A neutron"],a:0},{type:"match",q:"Match each particle to its relative charge.",pairs:[["Proton","+1"],["Neutron","0"],["Electron","\u22121"]]},{type:"teach",title:"Nuclide notation",text:"Each nucleus is written as {{A|Z|X}}.",bullets:["Z is the proton number (atomic number): the number of protons.","A is the nucleon number (mass number): protons + neutrons.","Number of neutrons = A \u2212 Z."]},{type:"num",q:"How many neutrons are in a nucleus of {{23|11|Na}}?",a:12,unit:"neutrons",work:["neutrons = A \u2212 Z","= 23 \u2212 11","= 12"]},{type:"num",q:"Carbon-14 has 6 protons. How many neutrons does it have?",a:8,unit:"neutrons",work:["A = 14, Z = 6","neutrons = 14 \u2212 6 = 8"]},{type:"mc",q:"A nucleus is written {{56|26|Fe}}. How many protons does it have?",options:["26","56","30","82"],a:0},{type:"teach",s:1,title:"The alpha scattering experiment",text:"Alpha particles were fired at very thin gold foil.",svg:{k:"scatter"},table:[["What happened","What it showed"],["Most went straight through","The atom is mostly empty space"],["Some were deflected","The nucleus is positively charged"],["A very few bounced back","The nucleus is very small and contains most of the mass"]]},{type:"match",s:1,q:"Match each observation to its conclusion.",pairs:[["Most alpha particles passed straight through","The atom is mostly empty space"],["A few were deflected","The nucleus is positive"],["Very few bounced straight back","The nucleus is tiny but holds most of the mass"]]},{type:"mc",s:1,q:"What does the proton number tell you about a nucleus?",options:["Its relative charge","Its relative mass","Its number of neutrons","Its half-life"],a:0,why:"The nucleon number tells you its relative mass."}]},N2:{name:"Isotopes, fission & fusion",ex:[{type:"teach",title:"Isotopes",text:"Isotopes are atoms of the same element with different numbers of neutrons. They have the same proton number but different nucleon numbers.",bullets:["{{12|6|C}} and {{14|6|C}} are both carbon.","An element can have several isotopes. Some are radioactive."]},{type:"mc",q:"How do two isotopes of the same element differ?",options:["They have different numbers of neutrons","They have different numbers of protons","They are different elements","They have different charges"],a:0},{type:"mc",q:"Which pair are isotopes of the same element?",options:["{{35|17|Cl}} and {{37|17|Cl}}","{{14|6|C}} and {{14|7|N}}","{{4|2|He}} and {{3|1|H}}","{{40|18|Ar}} and {{40|20|Ca}}"],a:0},{type:"teach",s:1,title:"Nuclear fission",text:"A large nucleus such as uranium-235 absorbs a neutron and splits into two smaller nuclei, releasing two or three neutrons and a lot of energy.",eq:"{{235|92|U}} + {{1|0|n}} \u2192 {{141|56|Ba}} + {{92|36|Kr}} + 3 {{1|0|n}}",bullets:["The released neutrons can split more nuclei: a chain reaction.","Nucleon numbers and proton numbers both balance on each side.","The mass of the products is slightly less than before: the missing mass has become energy."]},{type:"num",s:1,q:"{{235|92|U}} + {{1|0|n}} \u2192 {{144|56|Ba}} + {{A|36|Kr}} + 3 {{1|0|n}}. What is A?",a:89,unit:"",work:["nucleons before: 235 + 1 = 236","nucleons after: 144 + A + 3","236 = 147 + A, so A = 89"]},{type:"teach",s:1,title:"Nuclear fusion",text:"Two light nuclei (such as hydrogen) join to make a heavier nucleus (such as helium), releasing energy. This powers the Sun and other stars.",eq:"{{2|1|H}} + {{3|1|H}} \u2192 {{4|2|He}} + {{1|0|n}}"},{type:"mc",s:1,q:"Where does nuclear fusion happen naturally?",options:["In stars like the Sun","In nuclear power stations today","In smoke alarms","In the Earth\u2019s core"],a:0},{type:"mc",s:1,q:"In both fission and fusion, why is energy released?",options:["The total mass of the products is slightly less than the mass before","Electrons are destroyed","New protons are created","Heat is absorbed from outside"],a:0},{type:"match",s:1,q:"Match each process to its description.",pairs:[["Fission","A heavy nucleus splits in two"],["Fusion","Two light nuclei join together"]]}]},N3:{name:"Background & detection",ex:[{type:"teach",title:"Background radiation",text:"There is always a low level of ionising radiation around us. This is background radiation.",bullets:["Radon gas from rocks (often the biggest source)","Rocks and buildings","Food and drink","Cosmic rays from space"]},{type:"multi",q:"Which are sources of background radiation?",options:["Radon gas","Cosmic rays","Food and drink","Rocks and buildings","Mobile phone signals","Light from lamps"],correct:[0,1,2,3],why:"Phone signals and light are not ionising radiation."},{type:"teach",title:"Detecting radiation",text:"A detector (such as a Geiger\u2013M\xfcller tube) connected to a counter measures ionising radiation.",bullets:["The count rate is the number of counts per second or per minute."]},{type:"num",q:"A counter records 1200 counts in 4.0 minutes. What is the count rate in counts/min?",a:300,unit:"counts/min",work:["1200 \xf7 4.0 = 300 counts/min"]},{type:"teach",s:1,title:"Correcting for background",text:"To find the count rate from a source alone, measure the background first, then subtract it.",eq:"corrected count rate = measured \u2212 background"},{type:"num",s:1,q:"With a source, the count rate is 420 counts/min. The background is 20 counts/min. What is the corrected count rate?",a:400,unit:"counts/min",work:["420 \u2212 20 = 400 counts/min"]},{type:"mc",q:"Why do scientists measure the background count before an experiment?",options:["So they can subtract it and find the count from the source alone","To switch the background off","To warm up the detector","Because the source decays faster first"],a:0}]},N4:{name:"Alpha, beta & gamma",ex:[{type:"teach",title:"Three kinds of emission",text:"Unstable nuclei emit radiation spontaneously and randomly, in any direction.",table:[["","Alpha (\u03b1)","Beta (\u03b2\u207b)","Gamma (\u03b3)"],["What it is","Helium nucleus: 2 protons + 2 neutrons","A fast electron from the nucleus","An electromagnetic wave"],["Charge","+2","\u22121","0"],["Ionising","Strongly","Moderately","Weakly"],["Stopped by","Paper, or a few cm of air","A few mm of aluminium","Reduced by thick lead or concrete"]]},{type:"teach",title:"Penetration",text:"The more ionising it is, the less far it gets.",svg:{k:"penetrate"}},{type:"match",q:"Match each radiation to what stops it.",pairs:[["Alpha","A sheet of paper"],["Beta","A few mm of aluminium"],["Gamma","Several cm of lead (reduced, not fully stopped)"]]},{type:"mc",q:"Which radiation is the most strongly ionising?",options:["Alpha","Beta","Gamma","They are all the same"],a:0},{type:"mc",q:"Which radiation is an electromagnetic wave?",options:["Gamma","Alpha","Beta","None of them"],a:0},{type:"teach",s:1,title:"Deflection in fields",text:"Charged radiation is deflected by electric and magnetic fields.",svg:{k:"deflect"},bullets:["Alpha and beta are deflected in opposite directions, because they have opposite charges.","Beta is deflected much more, because an electron has a much smaller mass.","Gamma has no charge, so it is not deflected.","In an electric field, alpha bends towards the negative plate and beta towards the positive plate."]},{type:"mc",s:1,q:"Which radiation is deflected most by a magnetic field?",options:["Beta","Alpha","Gamma","Alpha and beta equally"],a:0},{type:"teach",s:1,title:"Why alpha ionises most",text:"Alpha particles have a large charge (+2) and a large mass, and move relatively slowly, so they interact strongly with the atoms they pass and lose their energy quickly. Gamma has no charge, so it rarely interacts and travels a long way."},{type:"mc",s:1,q:"Why is gamma radiation only weakly ionising?",options:["It has no charge, so it rarely interacts with atoms","It has a large mass","It moves slowly","It has a charge of +2"],a:0}]},N5:{name:"Radioactive decay",ex:[{type:"teach",title:"Decay",text:"A radioactive nucleus is unstable. It becomes more stable by emitting alpha, beta and/or gamma radiation.",bullets:["Decay is spontaneous and random: you can\u2019t predict when one nucleus will decay.","Alpha or beta decay changes the number of protons, so the nucleus becomes a different element.","Gamma emission does not change the element."]},{type:"mc",q:"Which emission does NOT change the element?",options:["Gamma","Alpha","Beta","All of them do"],a:0},{type:"teach",s:1,title:"What happens to the nucleus",text:"Some isotopes are unstable because they have too many neutrons, or are too heavy.",table:[["Emission","Change","Example"],["Alpha","A goes down 4, Z goes down 2","{{226|88|Ra}} \u2192 {{222|86|Rn}} + {{4|2|\u03b1}}"],["Beta","A stays the same, Z goes up 1: a neutron turns into a proton and an electron","{{14|6|C}} \u2192 {{14|7|N}} + {{0|-1|\u03b2}}"],["Gamma","No change to A or Z: the nucleus loses energy","{{60|28|Ni}}* \u2192 {{60|28|Ni}} + \u03b3"]]},{type:"num",s:1,q:"{{226|88|Ra}} decays by alpha emission. What is the nucleon number of the new nucleus?",a:222,unit:"",work:["alpha: A \u2212 4","226 \u2212 4 = 222"]},{type:"num",s:1,q:"{{14|6|C}} decays by beta emission. What is the proton number of the new nucleus?",a:7,unit:"",work:["beta: Z + 1","6 + 1 = 7 (nitrogen)"]},{type:"mc",s:1,q:"What happens inside the nucleus during beta decay?",options:["A neutron changes into a proton and an electron","A proton changes into a neutron","Two protons and two neutrons leave","Nothing: only energy leaves"],a:0},{type:"num",s:1,q:"{{238|92|U}} emits an alpha particle, then the new nucleus emits a beta particle. What is the final proton number?",a:91,unit:"",work:["alpha: 92 \u2212 2 = 90","beta: 90 + 1 = 91"]},{type:"mc",s:1,q:"Why does an isotope with too many neutrons often decay by beta emission?",options:["Beta decay turns a neutron into a proton, reducing the excess","Beta decay adds neutrons","Beta decay removes protons","It makes the nucleus heavier"],a:0}]},N6:{name:"Half-life",ex:[{type:"teach",title:"Half-life",text:"The half-life of an isotope is the time taken for half the nuclei in a sample to decay. In that time, the count rate also halves.",svg:{k:"graph",x:"time / days",y:"count rate / counts/min",xm:8,ym:800,xs:2,ys:200,lines:[{p:a(e=>800*Math.pow(.5,e/2),0,8)}],marks:[[2,400,""],[4,200,""]],guides:[[2,400],[4,200]]},bullets:["Each half-life, the amount left halves: 1 \u2192 \xbd \u2192 \xbc \u2192 \u215b.","Different isotopes have half-lives from fractions of a second to billions of years."]},{type:"num",q:"Use the graph. What is the half-life?",svg:{k:"graph",x:"time / days",y:"count rate / counts/min",xm:8,ym:800,xs:2,ys:200,lines:[{p:a(e=>800*Math.pow(.5,e/2),0,8)}],guides:[[2,400]]},a:2,unit:"days",work:["800 halves to 400 after 2 days"]},{type:"num",q:"A source has a count rate of 800 counts/min and a half-life of 2 hours. What is the count rate after 6 hours?",a:100,unit:"counts/min",work:["6 hours = 3 half-lives","800 \u2192 400 \u2192 200 \u2192 100 counts/min"]},{type:"num",q:"A sample contains 80 mg of an isotope with a half-life of 5 years. How much is left after 15 years?",a:10,unit:"mg",work:["15 \xf7 5 = 3 half-lives","80 \u2192 40 \u2192 20 \u2192 10 mg"]},{type:"num",q:"The count rate falls from 400 to 200 counts/s in 3.0 minutes. What is the half-life?",a:3,unit:"min",work:["It halved in 3.0 min, so the half-life is 3.0 min"]},{type:"num",q:"How many half-lives does it take for the count rate to fall to one eighth of its starting value?",a:3,unit:"half-lives",work:["1 \u2192 \xbd \u2192 \xbc \u2192 \u215b","3 half-lives"]},{type:"teach",s:1,title:"Remove the background first",text:"Real readings include background radiation. Subtract it from every reading before finding the half-life."},{type:"num",s:1,q:"Readings: 520 counts/min at t = 0 and 270 counts/min at t = 10 min. The background is 20 counts/min. What is the half-life?",a:10,unit:"min",work:["corrected: 520 \u2212 20 = 500 and 270 \u2212 20 = 250","500 halves to 250 in 10 min","half-life = 10 min"],why:"Without subtracting the background, 520 to 270 doesn\u2019t look like an exact halving."}]},N7:{name:"Uses & safety",ex:[{type:"teach",title:"Dangers",text:"Ionising radiation damages living cells.",bullets:["It can kill cells.","It can cause mutations in DNA.","It can cause cancer."]},{type:"teach",title:"Handling sources safely",text:"In a lab:",bullets:["Handle sources with long tongs, never with your hands.","Keep sources in lead-lined boxes when not in use.","Point sources away from people.","Use them for as short a time as possible.","Wash your hands afterwards."]},{type:"multi",q:"Which are safe ways to handle a radioactive source?",options:["Use long tongs","Store it in a lead-lined box","Point it away from people","Hold it in your hand for a closer look","Keep it in your pocket"],correct:[0,1,2]},{type:"teach",s:1,title:"Time, distance, shielding",text:"Three ways to reduce exposure:",bullets:["Reduce the time spent near the source.","Increase the distance: the radiation spreads out and weakens.","Use shielding such as lead or concrete to absorb it."]},{type:"teach",s:1,title:"Choosing the right isotope",text:"The radiation type and the half-life decide what a source is good for.",table:[["Use","Radiation","Half-life","Why"],["Smoke alarm","Alpha","Long","Alpha ionises the air so a current flows; smoke absorbs the alpha, the current drops and the alarm sounds"],["Sterilising food and equipment","Gamma","Long","Gamma penetrates packaging and kills bacteria"],["Measuring paper thickness","Beta","Long","Some beta gets through paper; thicker paper means a lower count"],["Medical tracer","Gamma","Short","Gamma escapes the body to be detected; a short half-life limits the dose"],["Cancer treatment","Gamma","Long","A focused beam kills cancer cells"]]},{type:"match",s:1,q:"Match each use to the radiation it needs.",pairs:[["Smoke alarm","Alpha"],["Paper thickness gauge","Beta"],["Sterilising surgical tools","Gamma"]]},{type:"mc",s:1,q:"Why does a medical tracer use a gamma source with a short half-life?",options:["Gamma can be detected outside the body, and a short half-life limits the patient\u2019s dose","Gamma is the most ionising","A short half-life makes it cheaper to store","Alpha would be detected more easily"],a:0},{type:"mc",s:1,q:"Why is beta radiation used to control the thickness of paper?",options:["Some beta passes through paper, and the amount depends on the thickness","Beta is stopped completely by paper","Beta passes through paper without any change","Beta has no charge"],a:0}]},S1:{name:"Earth, Sun & Moon",ex:[{type:"teach",title:"Days, years and months",text:"Three motions explain a lot.",bullets:["The Earth spins on a tilted axis once in about 24 hours. This gives day and night, and makes the Sun appear to move across the sky.","The Earth orbits the Sun once in about 365 days. Because the axis is tilted, each hemisphere leans towards the Sun for part of the year: that is summer, with longer days and more direct sunlight.","The Moon orbits the Earth about once a month. We see different amounts of its sunlit half, giving the phases of the Moon."]},{type:"mc",q:"What causes day and night?",options:["The Earth spinning on its axis","The Earth orbiting the Sun","The Moon blocking the Sun","The Sun orbiting the Earth"],a:0},{type:"mc",q:"What causes the seasons?",options:["The tilt of the Earth\u2019s axis as it orbits the Sun","The Earth being closer to the Sun in summer","The Moon\u2019s orbit","Clouds"],a:0},{type:"mc",q:"Why does the Moon have phases?",options:["We see different amounts of its sunlit half as it orbits the Earth","The Earth\u2019s shadow covers it","It produces less light at times","Clouds cover it"],a:0},{type:"match",q:"Match each period to the motion.",pairs:[["About 24 hours","Earth spins once on its axis"],["About 365 days","Earth orbits the Sun once"],["About one month","Moon orbits the Earth once"]]},{type:"teach",s:1,title:"Orbital speed",text:"For an orbit of average radius r and period T:",eq:"v = 2\u03c0r / T",bullets:["Use T in seconds to get v in m/s.","1 day = 86 400 s"]},{type:"num",s:1,q:"The Earth orbits the Sun at an average radius of 1.5 \xd7 10\xb9\xb9 m. One orbit takes 365 days. What is its orbital speed, in m/s?",a:29900,unit:"m/s",work:["T = 365 \xd7 86 400 = 3.15 \xd7 10\u2077 s","v = 2\u03c0 \xd7 1.5 \xd7 10\xb9\xb9 \xf7 3.15 \xd7 10\u2077","\u2248 30 000 m/s"],why:"You can type 3e4."},{type:"num",s:1,q:"The Moon\u2019s orbital radius is 3.8 \xd7 10\u2078 m and its period is 27.3 days. What is its orbital speed, in m/s?",a:1012,unit:"m/s",work:["T = 27.3 \xd7 86 400 = 2.36 \xd7 10\u2076 s","v = 2\u03c0 \xd7 3.8 \xd7 10\u2078 \xf7 2.36 \xd7 10\u2076","\u2248 1010 m/s"]}]},S2:{name:"The Solar System",ex:[{type:"teach",title:"What\u2019s in it",text:"The Solar System contains:",bullets:["one star: the Sun","eight planets: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune","minor planets, including dwarf planets such as Pluto, and asteroids","moons orbiting planets","smaller bodies: comets, and natural and artificial satellites"]},{type:"order",q:"Put the planets in order, starting nearest the Sun.",items:["Mercury","Venus","Earth","Mars","Jupiter","Saturn","Uranus","Neptune"],short:!0},{type:"teach",title:"Rocky inside, gassy outside",text:"The four inner planets are small and rocky. The four outer planets are large and gaseous. The accretion model explains why.",list:["The Solar System formed from a huge, rotating cloud of gas and dust (an interstellar cloud).","Gravity pulled it together and it flattened into a spinning accretion disc around the young Sun.","Close to the Sun it was hot, so only rocky and metal materials could stay solid: small rocky planets formed.","Further out it was cold enough for gases and ices; big planets grew and their strong gravity pulled in lots of gas."]},{type:"mc",q:"Why are the inner planets rocky?",options:["Near the young Sun it was too hot for gases and ices to collect; only rock and metal stayed solid","They are older","They formed after the outer planets","The Sun pulled the gas off them later"],a:0},{type:"teach",title:"Gravity and light",text:"The strength of gravity at a planet\u2019s surface depends on the planet\u2019s mass. Gravity gets weaker further away from a planet.",bullets:["The Sun contains most of the mass of the Solar System, so its gravity keeps the planets, asteroids and comets in orbit.","Light takes time to cross the Solar System: time = distance \xf7 speed (3.0 \xd7 10\u2078 m/s)."]},{type:"num",q:"The Sun is 1.5 \xd7 10\xb9\xb9 m from the Earth. How long does its light take to reach us, in seconds? (speed of light = 3.0 \xd7 10\u2078 m/s)",a:500,unit:"s",work:["t = d \xf7 v","= 1.5 \xd7 10\xb9\xb9 \xf7 3.0 \xd7 10\u2078","= 500 s (just over 8 minutes)"]},{type:"mc",q:"Why do the planets orbit the Sun?",options:["The Sun\u2019s gravitational pull, because it has most of the mass","Magnetic forces from the Sun","The solar wind pushes them","They are attracted to each other only"],a:0},{type:"teach",s:1,title:"Elliptical orbits",text:"Planets, minor planets and comets move in elliptical orbits. The Sun is not at the centre of the ellipse (except for orbits that are nearly circular).",svg:{k:"orbit"},bullets:["The Sun\u2019s gravitational field gets weaker further away, so planets further out orbit more slowly.","On an elliptical orbit, an object is fastest when closest to the Sun: as it falls inwards, gravitational potential energy turns into kinetic energy."]},{type:"mc",s:1,q:"Where on its orbit is a comet moving fastest?",svg:{k:"orbit"},options:["Closest to the Sun","Furthest from the Sun","Halfway round","Its speed is constant"],a:0},{type:"teach",s:1,title:"Reading planet data",text:"Look for patterns in tables like this one.",table:[["Planet","Distance from Sun / million km","Orbit time / Earth years","Surface g / N/kg"],["Mercury","58","0.24","3.7"],["Earth","150","1.0","9.8"],["Mars","228","1.9","3.7"],["Jupiter","778","11.9","24.8"],["Neptune","4500","165","11.2"]]},{type:"mc",s:1,q:"What pattern does the table show?",options:["The further from the Sun, the longer the orbit takes","The further from the Sun, the stronger the surface gravity","All planets take one year to orbit","Closer planets have longer orbits"],a:0}]},S3:{name:"Stars",ex:[{type:"teach",title:"The Sun and other stars",text:"The Sun is a medium-sized star, made mostly of hydrogen and helium. It gives out most of its energy as infrared, visible light and ultraviolet.",bullets:["A galaxy is a huge group of many billions of stars. The Sun is in the Milky Way.","Other stars in the Milky Way are much further away than the Sun.","Astronomers measure distance in light-years: the distance light travels through space in one year."]},{type:"mc",q:"What is a light-year?",options:["The distance light travels in one year","The time light takes to reach Earth","A year on a distant planet","The brightness of a star"],a:0},{type:"teach",s:1,title:"Light-years and fusion",text:"One light-year is 9.5 \xd7 10\xb9\u2075 m. Stars are powered by nuclear fusion. In a stable star, hydrogen nuclei fuse into helium."},{type:"num",s:1,q:"The nearest star after the Sun is 4.2 light-years away. How far is that in metres? (1 ly = 9.5 \xd7 10\xb9\u2075 m)",a:399e14,unit:"m",work:["4.2 \xd7 9.5 \xd7 10\xb9\u2075","= 4.0 \xd7 10\xb9\u2076 m"],why:"You can type 4e16."},{type:"teach",s:1,title:"The life of a star",text:"Every star follows a life cycle that depends on its mass.",list:["A star forms from a cloud of hydrogen gas and dust (a nebula).","Gravity pulls the cloud together into a protostar, and its temperature rises.","Fusion starts. The star is stable when the outward force from its high temperature balances the inward pull of gravity.","Eventually the hydrogen runs out and the star expands: a red giant (smaller stars) or a red supergiant (more massive stars).","A red giant sheds a planetary nebula and leaves a white dwarf.","A red supergiant explodes as a supernova, making heavy elements and leaving a neutron star or a black hole.","The nebula from a supernova can form new stars with planets."]},{type:"order",s:1,q:"Order the life cycle of a star like the Sun.",items:["Nebula","Protostar","Stable star","Red giant","Planetary nebula and white dwarf"],short:!0},{type:"order",s:1,q:"Order the life cycle of a star much more massive than the Sun.",items:["Nebula","Protostar","Stable star","Red supergiant","Supernova","Neutron star or black hole"],short:!0},{type:"mc",s:1,q:"Why doesn\u2019t a stable star collapse under its own gravity?",options:["The outward force from its high temperature balances gravity","It has no gravity","Its magnetic field holds it up","It is solid"],a:0},{type:"mc",s:1,q:"Where do heavy elements such as gold come from?",options:["Supernova explosions","White dwarfs cooling","The Big Bang only","Planetary nebulae"],a:0}]},S4:{name:"The Universe",ex:[{type:"teach",title:"Galaxies and redshift",text:"The Milky Way is one of billions of galaxies in the Universe. It is about 100 000 light-years across.",svg:{k:"redshift"},bullets:["Redshift is the increase in the observed wavelength of light from stars and galaxies that are moving away from us.","Light from distant galaxies is redshifted compared with light from the same elements on Earth.","This shows galaxies are moving away: the Universe is expanding. That supports the Big Bang theory."]},{type:"mc",q:"What is redshift?",options:["An increase in the observed wavelength of light from objects moving away","Light turning red as it gets hotter","A decrease in wavelength as galaxies approach","The colour of red giant stars"],a:0},{type:"mc",q:"What does the redshift of distant galaxies show?",options:["The Universe is expanding","The Universe is shrinking","Galaxies are getting hotter","Galaxies are moving towards us"],a:0},{type:"mc",q:"About how wide is the Milky Way?",options:["100 000 light-years","100 light-years","1 light-year","10 billion light-years"],a:0},{type:"teach",s:1,title:"More evidence and the Hubble constant",text:"Two more pieces of the picture:",bullets:["Cosmic microwave background radiation (CMBR) arrives from every direction in space. It was produced shortly after the Universe formed, and has been stretched into the microwave region as the Universe expanded.","A galaxy\u2019s speed v comes from its redshift. Its distance d can be found from the brightness of a supernova in it.","The Hubble constant H\u2080 = v/d. The current estimate is 2.2 \xd7 10\u207b\xb9\u2078 per second.","d/v is the same for every galaxy, so all the matter was once at a single point. The age of the Universe is about d/v = 1/H\u2080."]},{type:"num",s:1,q:"A galaxy is 1.0 \xd7 10\xb2\u2074 m away. Use H\u2080 = 2.2 \xd7 10\u207b\xb9\u2078 s\u207b\xb9 to find how fast it is moving away, in m/s.",a:22e5,unit:"m/s",work:["v = H\u2080 \xd7 d","= 2.2 \xd7 10\u207b\xb9\u2078 \xd7 1.0 \xd7 10\xb2\u2074","= 2.2 \xd7 10\u2076 m/s"],why:"You can type 2.2e6."},{type:"num",s:1,q:"Estimate the age of the Universe in seconds using 1/H\u2080, with H\u2080 = 2.2 \xd7 10\u207b\xb9\u2078 s\u207b\xb9.",a:455e15,unit:"s",work:["age \u2248 1 \xf7 H\u2080","= 1 \xf7 2.2 \xd7 10\u207b\xb9\u2078","= 4.5 \xd7 10\xb9\u2077 s (about 14 billion years)"],why:"You can type 4.5e17."},{type:"mc",s:1,q:"What is the CMBR evidence for?",options:["The Universe began in a hot, dense state and has expanded (the Big Bang)","The Universe is shrinking","Stars are powered by fusion","Planets orbit in ellipses"],a:0},{type:"mc",s:1,q:"How is the distance to a very far galaxy found?",options:["From the brightness of a supernova in it","From its redshift alone","With a ruler","From its colour"],a:0}]}}),e.push({i
