iset 1.1s ease 2}@media (prefers-reduced-motion:reduce){.mpoint.aiset,.part.aiset{animation:none}}.node.arrive .nb{animation:arrive .8s cubic-bezier(.3,1.6,.5,1) .1s both}.node.arrive .bubble{animation:arriveb .9s ease .1s both,bob 1.6s ease-in-out 1s infinite}:root{padding-top:env(safe-area-inset-top,0)}</style><link rel="expect" href="#rlk-end" blocking="render"><script>!function(){var n=document.documentElement,e=null,t=document.createElement("style");t.textContent="@view-transition{navigation:auto}html.rlk-in body{animation:rlkIn .24s ease-out both}@keyframes rlkIn{from{opacity:0}}@media (prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}html.rlk-in body{animation:none}}",(document.head||n).appendChild(t);try{e=JSON.parse(sessionStorage.getItem("realluked-swap")||"null")}catch(n){}function i(){n.classList.add("rlk-in"),setTimeout(function(){n.classList.remove("rlk-in")},400)}!e||Date.now()-e.t>12e3||("onpagereveal"in window?addEventListener("pagereveal",function(n){n.viewTransition||i()},{once:!0}):i())}();</script></head><body><div id="app"></div><script>window.WAVELENGTH_CONFIG={url:"https://bzcaswhwxffuuhrqtdyk.supabase.co",key:"sb_publishable_NaAvMjYFrs0Z0StUaIJzug_1z-4n-H3"};window.RL_KIT=Object.assign({url:"https://bzcaswhwxffuuhrqtdyk.supabase.co",key:"sb_publishable_NaAvMjYFrs0Z0StUaIJzug_1z-4n-H3"},{app:"wavelength",name:"Wavelength",tagline:"Duolingo-style revision for IGCSE Physics, Core or Extended. Pick a username to start, or log in to sync your progress.",main:"wavelength-v1",keys:["wavelength-v1"],submit:"wl_submit",tts:1,build:"e67cdf400614"});
!function(){const e=[],t={},a=(e,t,a,s)=>Array.from({length:(s||40)+1},(n,i)=>{const o=t+(a-t)*i/(s||40);return[o,e(o)]});e.push({id:"t1",tab:"Topic 1",title:"Motion, forces & energy",units:[{code:"1.1",title:"Measurement",sub:"Rulers, cylinders, timers and vectors",lessons:["M1","M2"],guide:["Read a ruler or measuring cylinder with your eye level with the mark. For a cylinder, read the bottom of the meniscus.","Measure many small things together, then divide: time 20 swings, or measure a stack of 100 sheets.","Repeating readings and taking an average reduces the effect of random errors such as reaction time.",{s:1,t:"Scalars have size only (distance, speed, time, mass, energy, temperature)."},{s:1,t:"Vectors have size and direction (force, weight, velocity, acceleration, momentum, field strength)."},{s:1,t:"Two vectors at right angles: resultant = \u221a(a\xb2 + b\xb2), by calculation or by a scale drawing."}]},{code:"1.2",title:"Motion",sub:"Speed, graphs, acceleration and falling",lessons:["M3","M4","M5","M6"],guide:["Speed = distance \xf7 time (v = s/t). Average speed = total distance \xf7 total time.","Velocity is speed in a given direction.","Distance\u2013time graph: gradient = speed. Flat = at rest. Steeper = faster.","Speed\u2013time graph: area under the line = distance travelled.",{s:1,t:"Acceleration = change in velocity \xf7 time (a = \u0394v/\u0394t). It is the gradient of a speed\u2013time graph."},{s:1,t:"Deceleration is a negative acceleration."},"Near the Earth, objects fall with acceleration g \u2248 9.8 m/s\xb2 if there is no air resistance.",{s:1,t:"Terminal velocity: air resistance grows with speed until it equals the weight, so the resultant force is zero."}]},{code:"1.3\u20131.4",title:"Mass, weight & density",sub:"Gravity and how heavy for its size",lessons:["M7","M8"],guide:["Mass is the quantity of matter in an object (kg). Weight is the gravitational force on it (N).","Gravitational field strength g = W/m. On Earth g = 9.8 N/kg, the same number as the acceleration of free fall.","A balance compares weights, and so compares masses.","Density \u03c1 = m/V, in kg/m\xb3 or g/cm\xb3. Water is 1.0 g/cm\xb3 (1000 kg/m\xb3).","Irregular solid: find its volume by displacement of water.","An object floats if it is less dense than the liquid.",{s:1,t:"A liquid floats on another liquid that is denser, if they do not mix."}]},{code:"1.5",title:"Forces",sub:"Springs, resultant force, moments and stability",lessons:["M9","M10","M11","M12"],guide:["Forces can change an object\u2019s size, shape, speed or direction.","Extension = stretched length \u2212 original length.",{s:1,t:"Spring constant k = F/x. The graph is straight up to the limit of proportionality."},"With no resultant force, an object stays at rest or keeps moving at constant speed in a straight line.",{s:1,t:"F = ma: the acceleration is in the same direction as the resultant force."},"Friction and drag oppose motion and cause heating.","Moment = force \xd7 perpendicular distance from the pivot (N m).","Balanced: sum of clockwise moments = sum of anticlockwise moments. Equilibrium = no resultant force and no resultant moment.","Low centre of gravity and a wide base make an object more stable."]},{code:"1.6",s:1,title:"Momentum",sub:"Momentum, impulse and collisions",lessons:["M13","M14"],guide:["Momentum p = mv (kg m/s). It is a vector, so direction matters.","Impulse = F\u0394t = \u0394(mv), in N s.","Resultant force = rate of change of momentum: F = \u0394p/\u0394t.","With no external forces, total momentum before = total momentum after.","Crumple zones, airbags and helmets increase the time of a collision, so the force is smaller."]},{code:"1.7",title:"Energy, work & power",sub:"Stores, transfers, efficiency and resources",lessons:["M15","M16","M17","M18"],guide:["Energy stores: kinetic, gravitational potential, chemical, elastic, nuclear, electrostatic, internal (thermal).","Energy is transferred by forces, electric currents, heating, and waves.","Energy cannot be created or destroyed, only transferred between stores.","Work done = force \xd7 distance (W = Fd = \u0394E).",{s:1,t:"Kinetic energy E\u2096 = \xbdmv\xb2. Change in gravitational potential energy \u0394E\u209a = mg\u0394h."},"Power = work done \xf7 time = energy transferred \xf7 time (P = W/t).",{s:1,t:"Efficiency = useful output \xf7 total input \xd7 100% (energy or power)."},"Power stations: fuel heats water in a boiler, steam turns a turbine, the turbine turns a generator.",{s:1,t:"Most energy resources come from the Sun, except geothermal, nuclear and tidal. The Sun is powered by nuclear fusion."}]},{code:"1.8",title:"Pressure",sub:"Force on an area, and pressure in liquids",lessons:["M19"],guide:["Pressure = force \xf7 area (p = F/A), in Pa = N/m\xb2.","Smaller area means more pressure for the same force (knives, pins). Bigger area means less (snowshoes, tractor tyres).","Pressure in a liquid increases with depth and with density.",{s:1,t:"Change in liquid pressure \u0394p = \u03c1g\u0394h."}]}]}),Object.assign(t,{M1:{name:"Measuring",ex:[{type:"teach",title:"Length and volume",text:"Use a ruler for lengths and a measuring cylinder for liquid volumes. Read both with your eye level with the scale, so you avoid parallax error.",bullets:["A ruler usually reads to the nearest millimetre.","Water curves up the sides of a cylinder, forming a meniscus. Read the bottom of the curve.","1 cm\xb3 is the same volume as 1 ml."]},{type:"teach",title:"Small things: measure lots, then divide",text:"Some things are too small or too quick to measure once. Measure many together and divide.",bullets:["Pendulum: time 20 complete swings, then divide by 20 to get the time for one (the period).","Paper: measure a stack of 100 sheets, then divide by 100.","Your reaction time is about 0.2 s. Over 20 swings, that error is shared out and becomes small."]},{type:"mc",q:"Why time 20 swings of a pendulum instead of just one?",options:["It reduces the effect of reaction time on the result","The pendulum swings faster after a few swings","A stopwatch cannot measure one swing","It makes the pendulum swing further"],a:0,why:"Your reaction-time error happens once at the start and once at the end. Spread over 20 swings, it becomes 20 times smaller per swing."},{type:"num",q:"A pendulum makes 20 complete oscillations in 36.0 s. What is its period?",a:1.8,unit:"s",work:["period = total time \xf7 number of oscillations","= 36.0 \xf7 20","= 1.8 s"]},{type:"num",q:"A stack of 200 sheets of paper is 2.4 cm thick. How thick is one sheet, in millimetres?",a:.12,unit:"mm",work:["2.4 cm = 24 mm","24 \xf7 200 = 0.12 mm"]},{type:"num",q:"What volume of water does the measuring cylinder show?",svg:{k:"cyl",v:34,max:50,step:2},a:34,unit:"cm\xb3",tol:.5,work:["Each small division is 2 cm\xb3.","The bottom of the meniscus is at 34 cm\xb3."]},{type:"mc",q:"Where should your eye be when reading a measuring cylinder?",options:["Level with the bottom of the meniscus","Above the cylinder, looking down","Level with the top of the meniscus","Below the liquid, looking up"],a:0,why:"Looking from above or below gives a parallax error. Water forms a meniscus that curves down in the middle, so read its bottom."},{type:"mc",q:"What is the period of a pendulum?",options:["The time for one complete oscillation","The number of swings in one second","The distance it swings","The time it takes to stop"],a:0,why:"One complete oscillation is there and back again. The number of swings per second is the frequency."}]},M2:{name:"Scalars & vectors",s:1,ex:[{type:"teach",title:"Size only, or size and direction?",text:"A scalar has magnitude (size) only. A vector has magnitude and direction.",bullets:["Scalars: distance, speed, time, mass, energy, temperature.","Vectors: force, weight, velocity, acceleration, momentum, electric field strength, gravitational field strength.","Speed is a scalar; velocity is the vector version."]},{type:"multi",q:"Which of these are vectors?",options:["Force","Mass","Velocity","Energy","Acceleration","Temperature","Momentum","Speed"],correct:[0,2,4,6],why:"Force, velocity, acceleration and momentum all have a direction. Mass, energy, temperature and speed do not."},{type:"teach",title:"Adding vectors at right angles",text:"When two vectors act at 90\xb0 to each other, the resultant is the hypotenuse of a right-angled triangle.",eq:"resultant = \u221a(a\xb2 + b\xb2)",bullets:["The angle comes from tan \u03b8 = opposite \xf7 adjacent.","Or draw it to scale: put the arrows tip to tail and measure the resultant with a ruler and protractor."]},{type:"num",q:"A force of 3.0 N acts east and a force of 4.0 N acts north on the same object. What is the size of the resultant force?",a:5,unit:"N",work:["resultant = \u221a(3.0\xb2 + 4.0\xb2)","= \u221a25","= 5.0 N"]},{type:"num",q:"A boat heads straight across a river at 4.0 m/s. The current flows at 3.0 m/s at right angles to the boat\u2019s heading. What is the boat\u2019s resultant speed?",a:5,unit:"m/s",work:["v = \u221a(4.0\xb2 + 3.0\xb2)","= \u221a25 = 5.0 m/s"]},{type:"num",q:"Forces of 6.0 N and 8.0 N act at right angles. What angle does the resultant make with the 8.0 N force?",a:36.9,unit:"\xb0",tol:1,work:["tan \u03b8 = 6.0 \xf7 8.0 = 0.75","\u03b8 = tan\u207b\xb9(0.75) = 36.9\xb0"]},{type:"num",q:"A plane flies north at 120 m/s. A wind blows east at 50 m/s. What is the plane\u2019s resultant speed?",a:130,unit:"m/s",work:["v = \u221a(120\xb2 + 50\xb2)","= \u221a16 900","= 130 m/s"]},{type:"mc",q:"Which statement is correct?",options:["Velocity is a vector; speed is a scalar","Speed is a vector; velocity is a scalar","Both are vectors","Both are scalars"],a:0,why:"Velocity is speed in a stated direction."}]},M3:{name:"Speed & velocity",ex:[{type:"teach",title:"Speed",text:"Speed is the distance travelled per unit time.",eq:"v = s / t",bullets:["v = speed (m/s), s = distance (m), t = time (s)","Average speed = total distance travelled \xf7 total time taken.","Velocity is speed in a given direction."]},{type:"num",q:"A car travels 300 m in 12 s. What is its average speed?",a:25,unit:"m/s",work:["v = s / t","= 300 \xf7 12","= 25 m/s"]},{type:"num",q:"A cyclist rides at an average speed of 5.0 m/s for 20 minutes. How far does she travel, in metres?",a:6e3,unit:"m",work:["t = 20 \xd7 60 = 1200 s","s = v \xd7 t = 5.0 \xd7 1200","= 6000 m"]},{type:"num",q:"A runner covers 400 m in 50 s, then another 400 m in 70 s. What is the average speed for the whole run?",a:6.67,unit:"m/s",work:["total distance = 800 m","total time = 120 s","average speed = 800 \xf7 120 = 6.7 m/s"],why:"Don\u2019t average the two speeds. Use total distance \xf7 total time."},{type:"teach",title:"Converting units",text:"To change km/h into m/s, divide by 3.6. To go from m/s to km/h, multiply by 3.6.",bullets:["1 km/h = 1000 m \xf7 3600 s","36 km/h = 10 m/s"]},{type:"num",q:"Convert 72 km/h into m/s.",a:20,unit:"m/s",work:["72 \xf7 3.6 = 20 m/s"]},{type:"mc",q:"A car drives round a roundabout at a constant speed. What happens to its velocity?",options:["It changes, because its direction changes","It stays the same, because its speed is constant","It becomes zero","It increases"],a:0,why:"Velocity includes direction. Turning changes the velocity even at a steady speed."},{type:"num",q:"Sound travels at 340 m/s. How long does it take to travel 1.7 km?",a:5,unit:"s",work:["s = 1.7 km = 1700 m","t = s \xf7 v = 1700 \xf7 340","= 5.0 s"]}]},M4:{name:"Distance\u2013time graphs",ex:[{type:"teach",title:"Reading the shape",text:"On a distance\u2013time graph, the gradient (steepness) is the speed.",svg:{k:"graph",x:"time / s",y:"distance / m",xm:10,ym:50,xs:2,ys:10,lines:[{p:[[0,0],[4,20],[6,20],[10,50]]}],marks:[[2,10,"A"],[5,20,"B"],[8,35,"C"]]},bullets:["A: straight sloping line, so constant speed.","B: flat line, so the object is at rest.","C: steeper straight line, so a faster constant speed.","A curve getting steeper means accelerating; getting flatter means decelerating."]},{type:"mc",q:"In which section of the graph is the object at rest?",svg:{k:"graph",x:"time / s",y:"distance / m",xm:10,ym:50,xs:2,ys:10,lines:[{p:[[0,0],[4,20],[6,20],[10,50]]}],marks:[[2,10,"A"],[5,20,"B"],[8,35,"C"]]},options:["B","A","C","None of them"],a:0,why:"The distance is not changing during B, so the object is not moving."},{type:"num",q:"Use the graph. What is the speed during section A (0 to 4 s)?",svg:{k:"graph",x:"time / s",y:"distance / m",xm:10,ym:50,xs:2,ys:10,lines:[{p:[[0,0],[4,20],[6,20],[10,50]]}],marks:[[2,10,"A"],[5,20,"B"],[8,35,"C"]]},a:5,unit:"m/s",work:["gradient = distance \xf7 time","= 20 \xf7 4","= 5 m/s"]},{type:"num",q:"Use the same graph. What is the speed during section C (6 s to 10 s)?",svg:{k:"graph",x:"time / s",y:"distance / m",xm:10,ym:50,xs:2,ys:10,lines:[{p:[[0,0],[4,20],[6,20],[10,50]]}],marks:[[2,10,"A"],[5,20,"B"],[8,35,"C"]]},a:7.5,unit:"m/s",work:["distance = 50 \u2212 20 = 30 m","time = 10 \u2212 6 = 4 s","speed = 30 \xf7 4 = 7.5 m/s"]},{type:"mc",q:"A distance\u2013time graph is a curve that gets steeper and steeper. What is the object doing?",options:["Accelerating","Decelerating","Moving at constant speed","At rest"],a:0,why:"Steeper means faster, so the speed is increasing."},{type:"mc",q:"What does this graph show?",svg:{k:"graph",x:"time / s",y:"distance / m",xm:10,ym:40,xs:2,ys:10,lines:[{p:a(e=>40*(1-Math.pow(1-e/10,2)),0,10)}]},options:["Decelerating","Accelerating","Constant speed","At rest"],a:0,why:"The gradient is getting smaller, so the speed is decreasing."},{type:"num",q:"Use the first graph again: 50 m in 10 s altogether. What is the average speed for the whole journey?",svg:{k:"graph",x:"time / s",y:"distance / m",xm:10,ym:50,xs:2,ys:10,lines:[{p:[[0,0],[4,20],[6,20],[10,50]]}]},a:5,unit:"m/s",work:["average speed = total distance \xf7 total time","= 50 \xf7 10 = 5 m/s"]}]},M5:{name:"Speed\u2013time graphs",ex:[{type:"teach",title:"Speed\u2013time graphs",text:"Now the line shows how fast, not how far.",svg:{k:"graph",x:"time / s",y:"speed / m/s",xm:12,ym:15,xs:2,ys:5,lines:[{p:[[0,0],[4,12],[10,12],[12,0]]}],area:[[0,0],[4,12],[10,12],[12,0]]},bullets:["Sloping up: speeding up. Flat: constant speed. Sloping down: slowing down.","The area under the line is the distance travelled.","Split the area into rectangles and triangles. Triangle area = \xbd \xd7 base \xd7 height."]},{type:"num",q:"A train travels at a constant 10 m/s for 6.0 s. How far does it go? (This is the area of a rectangle under a speed\u2013time graph.)",a:60,unit:"m",work:["area = 10 \xd7 6.0","= 60 m"]},{type:"num",q:"A car speeds up steadily from rest to 12 m/s in 4.0 s. How far does it travel in this time?",a:24,unit:"m",work:["area of triangle = \xbd \xd7 base \xd7 height","= \xbd \xd7 4.0 \xd7 12","= 24 m"]},{type:"num",q:"Find the total distance travelled from the graph.",svg:{k:"graph",x:"time / s",y:"speed / m/s",xm:12,ym:15,xs:2,ys:5,lines:[{p:[[0,0],[4,12],[10,12],[12,0]]}],area:[[0,0],[4,12],[10,12],[12,0]]},a:108,unit:"m",work:["0\u20134 s: \xbd \xd7 4 \xd7 12 = 24 m","4\u201310 s: 6 \xd7 12 = 72 m","10\u201312 s: \xbd \xd7 2 \xd7 12 = 12 m","total = 24 + 72 + 12 = 108 m"]},{type:"teach",s:1,title:"Acceleration",text:"Acceleration is the change in velocity per unit time. On a speed\u2013time graph it is the gradient.",eq:"a = \u0394v / \u0394t",bullets:["a in m/s\xb2, \u0394v in m/s, \u0394t in s","Deceleration is negative acceleration: the velocity is decreasing.","A straight sloping line means constant acceleration. A curved line means the acceleration is changing."]},{type:"num",s:1,q:"A car accelerates from rest to 24 m/s in 8.0 s. What is its acceleration?",a:3,unit:"m/s\xb2",work:["a = \u0394v / \u0394t","= (24 \u2212 0) \xf7 8.0","= 3.0 m/s\xb2"]},{type:"num",s:1,q:"A bike slows from 20 m/s to 5.0 m/s in 5.0 s. What is its acceleration? (Include the sign.)",a:-3,unit:"m/s\xb2",work:["a = \u0394v / \u0394t","= (5.0 \u2212 20) \xf7 5.0","= \u22123.0 m/s\xb2"],why:"The minus sign shows the bike is decelerating."},{type:"mc",s:1,q:"A speed\u2013time graph is a curve that gets less and less steep. What does it show?",options:["The object is speeding up, but its acceleration is decreasing","The object is slowing down","The acceleration is constant","The object is at rest"],a:0,why:"Still rising means still speeding up. Less steep means the acceleration is getting smaller."},{type:"num",s:1,q:"Use the graph. What is the acceleration in the first 4 s?",svg:{k:"graph",x:"time / s",y:"speed / m/s",xm:12,ym:15,xs:2,ys:5,lines:[{p:[[0,0],[4,12],[10,12],[12,0]]}]},a:3,unit:"m/s\xb2",work:["gradient = 12 \xf7 4","= 3 m/s\xb2"]}]},M6:{name:"Falling objects",ex:[{type:"teach",title:"Free fall",text:"Near the Earth\u2019s surface, an object falling with no air resistance accelerates at about 9.8 m/s\xb2. This is the acceleration of free fall, g.",bullets:["Every object falls with the same acceleration if there is no air resistance, whatever its mass.","On the Moon there is no air, so a hammer and a feather land together."]},{type:"mc",q:"A hammer and a feather are dropped together on the Moon, where there is no air. What happens?",options:["They land at the same time","The hammer lands first","The feather lands first","Neither falls"],a:0,why:"With no air resistance, both have the same acceleration of free fall."},{type:"num",s:1,q:"A stone falls from rest with no air resistance. What is its speed after 3.0 s? (g = 9.8 m/s\xb2)",a:29.4,unit:"m/s",work:["\u0394v = a \xd7 \u0394t","= 9.8 \xd7 3.0","= 29.4 m/s"]},{type:"teach",s:1,title:"Terminal velocity",text:"Air resistance increases as an object goes faster.",list:["At first, weight is bigger than air resistance, so the object accelerates.","As it speeds up, air resistance increases, so the resultant force and the acceleration get smaller.","Eventually air resistance equals the weight. The resultant force is zero, so the speed stays constant: terminal velocity."],svg:{k:"graph",x:"time",y:"speed",xm:10,ym:60,lines:[{p:a(e=>55*(1-Math.exp(-e/2)),0,10)}],noNums:1}},{type:"mc",s:1,q:"A skydiver is falling at terminal velocity. Which is true?",options:["Air resistance equals her weight","Air resistance is zero","Her weight is bigger than air resistance","She is still accelerating"],a:0,why:"Balanced forces mean no resultant force, so no acceleration: constant velocity."},{type:"order",s:1,q:"Put the stages of a skydive in order, from jumping out of the plane.",items:["Weight is bigger than air resistance, so she accelerates","Air resistance increases as she speeds up","Air resistance equals weight: terminal velocity","She opens the parachute and air resistance suddenly increases","She decelerates until forces balance at a lower terminal velocity"]},{type:"mc",s:1,q:"Why does opening a parachute make a skydiver slow down?",options:["It greatly increases air resistance, so the resultant force acts upwards","It reduces her weight","It removes gravity","It makes her mass smaller"],a:0,why:"Air resistance becomes bigger than weight. An upward resultant force means deceleration, until the forces balance again."},{type:"mc",q:"What is the approximate acceleration of free fall near the Earth\u2019s surface?",options:["9.8 m/s\xb2","1.6 m/s\xb2","98 m/s\xb2","3.0 \xd7 10\u2078 m/s\xb2"],a:0}]},M7:{name:"Mass, weight & g",ex:[{type:"teach",title:"Mass is not weight",text:"Mass measures the quantity of matter in an object. Weight is the gravitational force on an object that has mass.",bullets:["Mass is in kilograms (kg) and does not change from place to place.","Weight is a force, in newtons (N). It depends on the gravitational field.","A balance compares weights, so it can be used to compare masses."]},{type:"teach",title:"Gravitational field strength",text:"Gravitational field strength is the force per unit mass. On Earth it is 9.8 N/kg, which equals the acceleration of free fall.",eq:"g = W / m",bullets:["Rearranged: W = mg","On the Moon, g is about 1.6 N/kg."]},{type:"num",q:"A student has a mass of 60 kg. What is her weight on Earth? (g = 9.8 N/kg)",a:588,unit:"N",work:["W = mg","= 60 \xd7 9.8","= 588 N"]},{type:"num",q:"On the Moon (g = 1.6 N/kg), an astronaut weighs 120 N. What is his mass?",a:75,unit:"kg",work:["m = W \xf7 g","= 120 \xf7 1.6","= 75 kg"]},{type:"mc",q:"An astronaut travels from the Earth to the Moon. What happens?",options:["Her mass stays the same; her weight decreases","Her mass and weight both decrease","Her mass decreases; her weight stays the same","Nothing changes"],a:0,why:"Mass is the amount of matter, which doesn\u2019t change. The Moon\u2019s field is weaker, so her weight is smaller."},{type:"blank",q:"Weight is a ___ and is measured in ___.",a:["force","newtons"],bank:["force","newtons","mass","kilograms"]},{type:"num",q:"A bag weighs 49 N on Earth (g = 9.8 N/kg). What is its mass?",a:5,unit:"kg",work:["m = W \xf7 g = 49 \xf7 9.8","= 5.0 kg"]},{type:"mc",s:1,q:"Which describes weight best?",options:["The effect of a gravitational field on a mass","The amount of matter in an object","The space an object takes up","The mass per unit volume"],a:0}]},M8:{name:"Density",ex:[{type:"teach",title:"Density",text:"Density is mass per unit volume.",eq:"\u03c1 = m / V",bullets:["\u03c1 (rho) in kg/m\xb3 or g/cm\xb3","Water: 1.0 g/cm\xb3 = 1000 kg/m\xb3","To change g/cm\xb3 into kg/m\xb3, multiply by 1000."]},{type:"num",q:"A metal block has a mass of 540 g and a volume of 200 cm\xb3. What is its density?",a:2.7,unit:"g/cm\xb3",work:["\u03c1 = m / V","= 540 \xf7 200","= 2.7 g/cm\xb3"]},{type:"num",q:"A cube has sides of 2.0 cm and a mass of 64 g. What is its density?",a:8,unit:"g/cm\xb3",work:["V = 2.0 \xd7 2.0 \xd7 2.0 = 8.0 cm\xb3","\u03c1 = 64 \xf7 8.0 = 8.0 g/cm\xb3"]},{type:"teach",title:"Measuring density",text:"You need the mass (from a balance) and the volume.",bullets:["Liquid: weigh an empty measuring cylinder, add the liquid, weigh again. Read the volume from the scale.","Regular solid: measure length, width and height with a ruler; V = l \xd7 w \xd7 h.","Irregular solid that sinks: lower it into water in a measuring cylinder. The rise in the level is its volume (displacement)."]},{type:"order",q:"Put the steps in order to find the density of a small stone.",items:["Measure the mass of the stone on a balance","Half-fill a measuring cylinder with water and read the volume","Lower the stone gently into the water","Read the new volume and subtract to find the stone\u2019s volume","Divide the mass by the volume"]},{type:"num",q:"The water level rises from 50 cm\xb3 to 74 cm\xb3 when a stone of mass 60 g is added. What is the stone\u2019s density?",a:2.5,unit:"g/cm\xb3",work:["V = 74 \u2212 50 = 24 cm\xb3","\u03c1 = 60 \xf7 24 = 2.5 g/cm\xb3"]},{type:"mc",q:"A block of wood has a density of 0.80 g/cm\xb3. What happens when you put it in water (1.0 g/cm\xb3)?",options:["It floats","It sinks","It sinks slowly then floats","It dissolves"],a:0,why:"Objects less dense than the liquid float."},{type:"mc",s:1,q:"Oil (0.90 g/cm\xb3) and water (1.0 g/cm\xb3) do not mix. What happens when they are poured into the same jar?",options:["The oil floats on top of the water","The water floats on top of the oil","They form layers in random order","The oil sinks to the bottom"],a:0,why:"The less dense liquid floats on the denser one."},{type:"num",q:"Density of aluminium is 2700 kg/m\xb3. What is the mass of 0.020 m\xb3 of aluminium?",a:54,unit:"kg",work:["m = \u03c1 \xd7 V","= 2700 \xd7 0.020","= 54 kg"]}]},M9:{name:"Springs & stretching",ex:[{type:"teach",title:"Stretching springs",text:"A force can change the size and shape of an object. Hanging loads on a spring stretches it.",bullets:["Extension = stretched length \u2212 original length.","Plot a load\u2013extension graph: load on one axis, extension on the other.","For a spring, the graph starts as a straight line through the origin."]},{type:"num",q:"A spring is 12.0 cm long. With a load on it, it is 15.5 cm long. What is the extension?",a:3.5,unit:"cm",work:["extension = 15.5 \u2212 12.0","= 3.5 cm"]},{type:"order",q:"Put the steps of a spring experiment in order.",items:["Measure the original length of the spring with a ruler","Hang a 1.0 N weight on the spring","Measure the new length and work out the extension","Add more weights one at a time, measuring each time","Plot a graph of extension against load"]},{type:"teach",s:1,title:"Spring constant and the limit",text:"The spring constant is the force per unit extension.",eq:"k = F / x",svg:{k:"graph",x:"load / N",y:"extension / cm",xm:10,ym:14,xs:2,ys:2,lines:[{p:[[0,0],[6,6]].concat(a(e=>e+.2*Math.pow(e-6,2),6,10,12).slice(1))}],marks:[[6,6,"P"]]},bullets:["k in N/m (or N/cm). A stiffer spring has a bigger k.","P is the limit of proportionality. Up to P, extension is proportional to load.","Beyond P the line curves: extension is no longer proportional to load."]},{type:"num",s:1,q:"A load of 6.0 N stretches a spring by 0.040 m. What is the spring constant?",a:150,unit:"N/m",work:["k = F / x","= 6.0 \xf7 0.040","= 150 N/m"]},{type:"num",s:1,q:"A spring has k = 25 N/m. What is its extension with a 2.0 N load? Give your answer in metres.",a:.08,unit:"m",work:["x = F \xf7 k","= 2.0 \xf7 25","= 0.080 m"]},{type:"mc",s:1,q:"What happens beyond the limit of proportionality?",options:["Extension is no longer proportional to load","The spring stops stretching","The spring constant doubles","The spring gets shorter"],a:0},{type:"mc",q:"Which graph shape shows that extension is proportional to load?",options:["A straight line through the origin","A curve that levels off","A horizontal line","A straight line that does not pass through the origin"],a:0}]},M10:{name:"Resultant force & motion",ex:[{type:"teach",title:"Resultant force",text:"The resultant is the single force that has the same effect as all the forces together.",bullets:["Same direction: add them.","Opposite directions: subtract, and the resultant points the way of the bigger force.","No resultant force: an object at rest stays at rest; a moving object keeps the same speed in a straight line.","A resultant force changes the velocity: the speed, the direction, or both."]},{type:"num",q:"A trolley is pushed with 50 N forwards. Friction is 20 N backwards. What is the resultant force?",a:30,unit:"N",work:["50 \u2212 20 = 30 N forwards"]},{type:"mc",q:"A car travels at constant speed on a straight road. Which is true?",options:["The driving force equals the resistive forces","The driving force is bigger than the resistive forces","There are no forces on the car","The resistive forces are bigger"],a:0,why:"Constant velocity means no resultant force, so the forces are balanced."},{type:"teach",title:"Friction and drag",text:"Friction acts between surfaces that slide over each other. It opposes motion and produces heating.",bullets:["Drag is friction on an object moving through a liquid or a gas.","Air resistance is drag in air."]},{type:"teach",s:1,title:"F = ma",text:"A resultant force makes a mass accelerate. The acceleration is in the same direction as the resultant force.",eq:"F = m \xd7 a",bullets:["F in N, m in kg, a in m/s\xb2"]},{type:"num",s:1,q:"A car of mass 1200 kg has a resultant force of 3000 N on it. What is its acceleration?",a:2.5,unit:"m/s\xb2",work:["a = F \xf7 m","= 3000 \xf7 1200","= 2.5 m/s\xb2"]},{type:"num",s:1,q:"What resultant force gives a 0.50 kg ball an acceleration of 8.0 m/s\xb2?",a:4,unit:"N",work:["F = ma = 0.50 \xd7 8.0","= 4.0 N"]},{type:"teach",s:1,title:"Moving in a circle",text:"An object moves in a circle when a force acts at right angles to its velocity, towards the centre. Its speed can stay the same while its direction keeps changing.",bullets:["Same mass and radius: a bigger force makes the speed bigger.","Same mass and speed: a bigger force makes the radius smaller.","Same speed and radius: a bigger mass needs a bigger force."]},{type:"mc",s:1,q:"A ball on a string moves in a circle at constant speed. The force from the string is increased, keeping the mass and speed the same. What happens?",options:["The radius of the circle decreases","The radius increases","The ball flies off in a straight line","Nothing changes"],a:0}]},M11:{name:"Moments",ex:[{type:"teach",title:"Turning effect",text:"A moment is the turning effect of a force.",eq:"moment = F \xd7 d",bullets:["d is the perpendicular distance from the pivot to the line of the force.","Units: N m (or N cm).","Examples: a door handle is far from the hinges; a long spanner turns a nut more easily."]},{type:"num",q:"A force of 40 N acts 0.25 m from a pivot, at right angles. What is its moment?",a:10,unit:"N m",work:["moment = F \xd7 d","= 40 \xd7 0.25","= 10 N m"]},{type:"teach",title:"Principle of moments",text:"When an object is balanced, the sum of the clockwise moments about the pivot equals the sum of the anticlockwise moments.",svg:{k:"beam",piv:50,f:[[20,"300 N","1.5 m"],[76,"F","2.0 m"]]},bullets:["An object is in equilibrium when there is no resultant force and no resultant moment."]},{type:"num",q:"A 300 N weight sits 1.5 m to the left of a pivot. What force at 2.0 m to the right balances the beam?",svg:{k:"beam",piv:50,f:[[20,"300 N","1.5 m"],[76,"F","2.0 m"]]},a:225,unit:"N",work:["anticlockwise = 300 \xd7 1.5 = 450 N m","clockwise = F \xd7 2.0","F = 450 \xf7 2.0 = 225 N"]},{type:"num",q:"A child weighing 400 N sits 1.5 m from the pivot of a seesaw. How far from the pivot must a 500 N child sit on the other side to balance it?",a:1.2,unit:"m",work:["400 \xd7 1.5 = 500 \xd7 d","600 = 500 \xd7 d","d = 1.2 m"]},{type:"num",s:1,q:"On the left of a pivot: 20 N at 30 cm and 10 N at 50 cm. On the right: one force F at 40 cm. What is F if the rule balances?",svg:{k:"beam",piv:50,f:[[10,"10 N","50 cm"],[26,"20 N","30 cm"],[82,"F","40 cm"]]},a:27.5,unit:"N",work:["anticlockwise = (20 \xd7 30) + (10 \xd7 50) = 1100 N cm","F \xd7 40 = 1100","F = 27.5 N"]},{type:"mc",q:"Why is a door handle placed far from the hinges?",options:["It gives a bigger moment for the same force","It makes the door lighter","It reduces friction","It makes the door stronger"],a:0},{type:"teach",s:1,title:"Showing there is no resultant moment",text:"Balance a metre rule on a pivot. Hang weights on both sides and move them until the rule balances. Work out each moment. The total clockwise moment equals the total anticlockwise moment."},{type:"mc",q:"Which conditions mean an object is in equilibrium?",options:["No resultant force and no resultant moment","No resultant force only","No resultant moment only","It must be at rest"],a:0}]},M12:{name:"Centre of gravity",ex:[{type:"teach",title:"Centre of gravity",text:"The centre of gravity is the point where the whole weight of an object seems to act.",bullets:["For a uniform rule, it is in the middle.","An object hung freely comes to rest with its centre of gravity directly below the pivot."]},{type:"order",q:"Find the centre of gravity of an irregular piece of card (a lamina). Put the steps in order.",items:["Make a small hole near the edge and hang the card from a pin so it swings freely","Hang a plumb line from the same pin","When everything is still, draw a line along the plumb line","Hang the card from a second hole and draw another line","The centre of gravity is where the lines cross"]},{type:"teach",title:"Stability",text:"An object topples when the line of action of its weight falls outside its base.",bullets:["A low centre of gravity makes an object more stable.","A wide base makes an object more stable."]},{type:"mc",q:"Why are racing cars built low and wide?",options:["A low centre of gravity and wide base make them stable","It increases their weight","It increases their top speed by reducing mass","It makes the engine more efficient"],a:0},{type:"mc",q:"When does a tilted object topple over?",options:["When the line of action of its weight falls outside its base","When its centre of gravity is low","When its base is wide","When it is heavy"],a:0},{type:"multi",q:"Which changes make a bus more stable?",options:["Putting heavy luggage under the floor","Making the base wider","Putting luggage on the roof","Making it taller"],correct:[0,1],why:"Both lower the centre of gravity or widen the base."}]},M13:{name:"Momentum & impulse",s:1,ex:[{type:"teach",title:"Momentum",text:"Momentum is mass \xd7 velocity. It is a vector.",eq:"p = m \xd7 v",bullets:["p in kg m/s, m in kg, v in m/s"]},{type:"num",q:"A 1500 kg car travels at 20 m/s. What is its momentum?",a:3e4,unit:"kg m/s",work:["p = mv","= 1500 \xd7 20","= 30 000 kg m/s"]},{type:"teach",title:"Impulse",text:"Impulse is force \xd7 time. It equals the change in momentum.",eq:"impulse = F\u0394t = \u0394(mv)",bullets:["Impulse is in N s (the same as kg m/s).","The resultant force is the rate of change of momentum: F = \u0394p / \u0394t."]},{type:"num",q:"A 0.20 kg ball is kicked from rest to 15 m/s. What impulse acts on it?",a:3,unit:"N s",work:["impulse = \u0394(mv)","= 0.20 \xd7 15 \u2212 0","= 3.0 N s"]},{type:"num",q:"The kick lasts 0.010 s. What is the average force on the ball? (Impulse = 3.0 N s.)",a:300,unit:"N",work:["F = impulse \xf7 \u0394t","= 3.0 \xf7 0.010","= 300 N"]},{type:"num",q:"A car\u2019s momentum changes by 6000 kg m/s in 0.20 s. What is the average resultant force?",a:3e4,unit:"N",work:["F = \u0394p \xf7 \u0394t","= 6000 \xf7 0.20","= 30 000 N"]},{type:"mc",q:"How does an airbag reduce injury in a crash?",options:["It increases the time taken to stop, so the force is smaller","It reduces the change in momentum","It increases the person\u2019s mass","It stops the car faster"],a:0,why:"The change in momentum is the same either way. Spreading it over a longer time makes F = \u0394p/\u0394t smaller."},{type:"multi",q:"Which work by increasing the time of a collision?",options:["Crumple zones in cars","Cycle helmets","Bending your knees when you land","Heavier car doors"],correct:[0,1,2]}]},M14:{name:"Conservation of momentum",s:1,ex:[{type:"teach",title:"Momentum is conserved",text:"If no external forces act, the total momentum before a collision or explosion equals the total momentum after.",bullets:["Choose one direction as positive. Momentum in the opposite direction is negative.","Stuck together after a collision? Add the masses and find one shared velocity.","Starting at rest? The total momentum is zero before, so it is zero after."]},{type:"num",q:"A 2.0 kg trolley moving at 3.0 m/s hits a stationary 1.0 kg trolley. They stick together. What is their velocity afterwards?",a:2,unit:"m/s",work:["before: 2.0 \xd7 3.0 + 0 = 6.0 kg m/s","after: (2.0 + 1.0) \xd7 v = 6.0","v = 2.0 m/s"]},{type:"num",q:"A 4.0 kg gun fires a 0.010 kg bullet at 400 m/s. What is the recoil speed of the gun?",a:1,unit:"m/s",work:["before: total momentum = 0","bullet: 0.010 \xd7 400 = 4.0 kg m/s forwards","gun: 4.0 \xd7 v = 4.0, so v = 1.0 m/s backwards"]},{type:"num",q:"Two ice skaters stand still, then push apart. The 70 kg skater moves at 1.5 m/s. How fast does the 50 kg skater move?",a:2.1,unit:"m/s",work:["70 \xd7 1.5 = 105 kg m/s","50 \xd7 v = 105","v = 2.1 m/s in the opposite direction"]},{type:"num",q:"A 3.0 kg trolley at 4.0 m/s meets a 1.0 kg trolley moving towards it at 2.0 m/s. They stick together. What is their velocity?",a:2.5,unit:"m/s",work:["take the 3.0 kg trolley\u2019s direction as positive","before: 3.0 \xd7 4.0 + 1.0 \xd7 (\u22122.0) = 10 kg m/s","after: 4.0 \xd7 v = 10, so v = 2.5 m/s"]},{type:"mc",q:"A firework at rest explodes into pieces. What is the total momentum of the pieces just after?",options:["Zero","Equal to the energy released","Bigger than before","It depends on the colour"],a:0,why:"It was zero before, so it is zero after. The pieces\u2019 momenta cancel out."},{type:"mc",q:"Which statement about momentum in a collision is true, if no external forces act?",options:["Total momentum is the same before and after","Total momentum is lost as heat","Each object keeps its own momentum","Total momentum always increases"],a:0}]},M15:{name:"Energy stores & transfers",ex:[{type:"teach",title:"Energy stores",text:"Energy can be stored as:",bullets:["kinetic (moving things)","gravitational potential (raised objects)","chemical (fuels, food, batteries)","elastic or strain (stretched or squashed objects)","nuclear (inside atomic nuclei)","electrostatic (charges that attract or repel)","internal or thermal (hot objects)"]},{type:"match",q:"Match each example to its main energy store.",pairs:[["A stretched spring","Elastic"],["A moving car","Kinetic"],["A book on a high shelf","Gravitational potential"],["A battery","Chemical"],["A cup of hot tea","Internal (thermal)"],["Uranium fuel","Nuclear"]]},{type:"teach",title:"Transfers",text:"Energy moves between stores in four ways:",bullets:["mechanically, by forces doing work","electrically, by electric currents","by heating","by waves: electromagnetic, sound and others"],eq:"Energy cannot be created or destroyed."},{type:"mc",q:"An electric kettle heats water. How is energy transferred to the water?",options:["Electrically to the heating element, then by heating to the water\u2019s internal store","Mechanically to the water\u2019s kinetic store","By sound waves to the water","From the water\u2019s chemical store"],a:0},{type:"order",q:"Show the energy changes in a hydroelectric power station, in order.",items:["Gravitational potential energy of water in the reservoir","Kinetic energy of the falling water","Kinetic energy of the spinning turbine","Energy transferred electrically by the generator"]},{type:"teach",s:1,title:"Sankey diagrams",text:"A Sankey diagram shows energy transfers with arrows. The width of each arrow shows how much energy.",svg:{k:"sankey",i:"100 J electrical",out:[["15 J light",15],["85 J heating surroundings",85]]}},{type:"num",s:1,q:"A lamp is supplied with 100 J and gives out 15 J of light. How much energy is wasted?",a:85,unit:"J",work:["wasted = 100 \u2212 15","= 85 J (heating the surroundings)"]},{type:"mc",q:"Where does wasted energy usually end up?",options:["In the internal (thermal) store of the surroundings","It is destroyed","In the chemical store of the device","It turns into mass"],a:0}]},M16:{name:"Work, KE & GPE",ex:[{type:"teach",title:"Work done",text:"Work is done when a force moves an object. The work done equals the energy transferred.",eq:"W = F \xd7 d = \u0394E",bullets:["W in J, F in N, d in m (the distance moved in the direction of the force).","1 joule = 1 newton \xd7 1 metre."]},{type:"num",q:"A box is pushed 4.0 m with a force of 50 N. How much work is done?",a:200,unit:"J",work:["W = Fd","= 50 \xd7 4.0","= 200 J"]},{type:"num",q:"A crane does 12 000 J of work lifting a load 8.0 m. What force does it use?",a:1500,unit:"N",work:["F = W \xf7 d","= 12 000 \xf7 8.0","= 1500 N"]},{type:"teach",s:1,title:"Kinetic and potential energy",text:"You need to recall both equations.",eq:"E\u2096 = \xbdmv\xb2   \u0394E\u209a = mg\u0394h",bullets:["E\u2096 in J, m in kg, v in m/s","\u0394E\u209a in J, g = 9.8 N/kg, \u0394h in m"]},{type:"num",s:1,q:"A 2.0 kg ball moves at 3.0 m/s. What is its kinetic energy?",a:9,unit:"J",work:["E\u2096 = \xbdmv\xb2","= 0.5 \xd7 2.0 \xd7 3.0\xb2","= 9.0 J"]},{type:"num",s:1,q:"A 50 kg student climbs 4.0 m of stairs. How much gravitational potential energy does she gain? (g = 9.8 N/kg)",a:1960,unit:"J",work:["\u0394E\u209a = mg\u0394h","= 50 \xd7 9.8 \xd7 4.0","= 1960 J"]},{type:"num",s:1,q:"A ball is dropped from 5.0 m. Ignoring air resistance, how fast is it moving just before it hits the ground? (g = 9.8 N/kg)",a:9.9,unit:"m/s",work:["GPE lost = KE gained: mgh = \xbdmv\xb2","v\xb2 = 2gh = 2 \xd7 9.8 \xd7 5.0 = 98","v = \u221a98 = 9.9 m/s"]},{type:"mc",s:1,q:"A car doubles its speed. What happens to its kinetic energy?",options:["It is four times as big","It doubles","It halves","It stays the same"],a:0,why:"E\u2096 depends on v\xb2. Doubling v makes v\xb2 four times bigger."}]},M17:{name:"Power & efficiency",ex:[{type:"teach",title:"Power",text:"Power is the work done per unit time, or the energy transferred per unit time.",eq:"P = W / t = \u0394E / t",bullets:["P in watts (W). 1 W = 1 J/s","1 kW = 1000 W"]},{type:"num",q:"A motor does 6000 J of work in 20 s. What is its power?",a:300,unit:"W",work:["P = W \xf7 t","= 6000 \xf7 20","= 300 W"]},{type:"num",q:"A 2.0 kW heater is on for 5.0 minutes. How much energy does it transfer, in joules?",a:6e5,unit:"J",work:["P = 2000 W, t = 300 s","E = P \xd7 t = 2000 \xd7 300","= 600 000 J"]},{type:"teach",title:"Efficiency",text:"Efficiency tells you what fraction of the energy put in ends up where you want it. The rest is wasted, usually heating the surroundings.",bullets:["No device can be more than 100% efficient.","Reducing friction (oiling moving parts) can improve efficiency."]},{type:"teach",s:1,title:"Calculating efficiency",text:"You can use energies or powers.",eq:"efficiency = useful output \xf7 total input \xd7 100%"},{type:"num",s:1,q:"A motor is supplied with 400 J and does 300 J of useful work. What is its efficiency, as a percentage?",a:75,unit:"%",work:["efficiency = 300 \xf7 400 \xd7 100%","= 75%"]},{type:"num",s:1,q:"A power station is 40% efficient and gives out 500 MW of electrical power. What is its total input power, in MW?",a:1250,unit:"MW",work:["input = useful output \xf7 efficiency","= 500 \xf7 0.40","= 1250 MW"]},{type:"mc",q:"A student says a machine is 110% efficient. Why is this impossible?",options:["Energy cannot be created, so useful output cannot be more than input","Machines cannot be more than 50% efficient","Efficiency has no units","Power is not conserved"],a:0}]},M18:{name:"Energy resources",ex:[{type:"teach",title:"Generating electricity",text:"In many power stations, a fuel heats water in a boiler. The steam turns a turbine, and the turbine turns a generator.",bullets:["Fossil fuels and biofuels: chemical energy released by burning.","Nuclear fuel: energy released by fission heats the water.","Geothermal: hot rocks underground heat water into steam.","Hydroelectric dams, tides and waves: moving water turns turbines directly.","Solar cells turn light straight into electricity. Solar panels heat water."]},{type:"multi",q:"Which energy resources are renewable?",options:["Biofuel","Hydroelectric","Tidal","Solar","Coal","Natural gas","Nuclear fuel (uranium)"],correct:[0,1,2,3],why:"Renewables are replaced as fast as we use them. Fossil fuels and uranium will run out."},{type:"teach",title:"Comparing resources",text:"Judge a resource on:",bullets:["Renewability: will it run out?","Availability and reliability: is it there when we need it? (Solar fails at night; wind needs wind.)","Scale: how much power can it produce?","Environmental impact: carbon dioxide, waste, flooding land, noise."]},{type:"mc",q:"What is a disadvantage of solar cells?",options:["They produce no electricity at night","They release carbon dioxide","They will run out","They need a boiler"],a:0},{type:"mc",q:"What is a main advantage of a fossil-fuel power station?",options:["It is reliable and can generate on demand at a large scale","It is renewable","It releases no carbon dioxide","Its fuel is free"],a:0},{type:"match",q:"Match each resource to a disadvantage.",pairs:[["Coal","Releases carbon dioxide"],["Nuclear","Radioactive waste"],["Hydroelectric dam","Floods valleys"],["Tidal barrage","Affects estuary habitats"]]},{type:"teach",s:1,title:"The Sun behind it all",text:"Most energy resources come from the Sun\u2019s radiation: fossil fuels and biofuels (plants), wind and waves (weather), hydroelectric (rain), solar. The exceptions are geothermal, nuclear and tidal.",bullets:["The Sun releases energy by nuclear fusion.","Scientists are researching nuclear fusion for large-scale electricity generation on Earth."]},{type:"multi",s:1,q:"Which resources do NOT get their energy from the Sun\u2019s radiation?",options:["Geothermal","Nuclear","Tidal","Wind","Biofuel","Hydroelectric"],correct:[0,1,2],why:"Tides come from the Moon\u2019s gravity, geothermal from hot rocks, nuclear from uranium."}]},M19:{name:"Pressure",ex:[{type:"teach",title:"Pressure",text:"Pressure is the force per unit area.",eq:"p = F / A",bullets:["p in pascals (Pa), where 1 Pa = 1 N/m\xb2","F in N, A in m\xb2"]},{type:"num",q:"A person weighing 600 N stands on an area of 0.040 m\xb2. What pressure do they exert on the floor?",a:15e3,unit:"Pa",work:["p = F \xf7 A","= 600 \xf7 0.040","= 15 000 Pa"]},{type:"num",q:"A box weighing 200 N has a base 0.50 m by 0.40 m. What pressure does it exert?",a:1e3,unit:"Pa",work:["A = 0.50 \xd7 0.40 = 0.20 m\xb2","p = 200 \xf7 0.20 = 1000 Pa"]},{type:"mc",q:"Why do snowshoes stop you sinking into snow?",options:["They spread your weight over a larger area, so the pressure is lower","They reduce your weight","They increase the pressure","They make the snow denser"],a:0},{type:"mc",q:"Why does a sharp knife cut better than a blunt one?",options:["The small area gives a large pressure for the same force","It has more mass","It reduces the force needed to zero","The large area spreads the force"],a:0},{type:"teach",title:"Pressure in liquids",text:"The pressure under the surface of a liquid increases with depth and with the density of the liquid.",bullets:["A dam is thicker at the bottom because the pressure is greatest there.","Water spurts furthest from the lowest hole in a container."]},{type:"teach",s:1,title:"Calculating liquid pressure",text:"The change in pressure beneath a liquid surface:",eq:"\u0394p = \u03c1 \xd7 g \xd7 \u0394h",bullets:["\u03c1 in kg/m\xb3, g = 9.8 N/kg, \u0394h in m, \u0394p in Pa"]},{type:"num",s:1,q:"What is the extra pressure 5.0 m below the surface of water? (\u03c1 = 1000 kg/m\xb3, g = 9.8 N/kg)",a:49e3,unit:"Pa",work:["\u0394p = \u03c1g\u0394h","= 1000 \xd7 9.8 \xd7 5.0","= 49 000 Pa"]},{type:"num",s:1,q:"A diver goes from 10 m to 30 m deep in seawater (\u03c1 = 1030 kg/m\xb3, g = 9.8 N/kg). By how much does the pressure increase?",a:201880,unit:"Pa",work:["\u0394h = 20 m","\u0394p = 1030 \xd7 9.8 \xd7 20","= 201 880 Pa \u2248 2.0 \xd7 10\u2075 Pa"]}]}}),e.push({id:"t23",tab:"Topics 2\u20133",title:"Thermal physics & waves",units:[{code:"2.1",title:"Particles & gases",sub:"States, particle model, gas pressure, kelvin",lessons:["T1","T2","T3"],guide:["Solids: fixed shape and volume. Liquids: fixed volume, take the container\u2019s shape. Gases: fill the container and can be compressed.","Solid particles are close, in a regular pattern, vibrating. Liquid particles are close but move around each other. Gas particles are far apart, moving fast and randomly.","Higher temperature means faster particles. At absolute zero (\u2212273 \xb0C) particles have the least kinetic energy.","Gas pressure comes from particles colliding with the walls.","Brownian motion: tiny visible particles (like smoke) jiggle randomly because invisible, fast air molecules hit them.","T (K) = \u03b8 (\xb0C) + 273.",{s:1,t:"Fixed mass of gas at constant temperature: pV = constant."}]},{code:"2.2",title:"Thermal properties",sub:"Expansion, specific heat capacity, changes of state",lessons:["T4","T5","T6"],guide:["Solids, liquids and gases expand when heated. Gases expand most, solids least.","Expansion matters: gaps in bridges and railways, slack power cables, thermometers, bimetallic strips.","Raising an object\u2019s temperature increases its internal energy.",{s:1,t:"Specific heat capacity c = \u0394E/(m\u0394\u03b8): energy to raise 1 kg by 1 \xb0C."},"Melting and boiling take in energy without a change in temperature. Water melts at 0 \xb0C and boils at 100 \xb0C.","Evaporation: the most energetic particles escape from the surface, so the liquid left behind cools.",{s:1,t:"Evaporation is faster with higher temperature, larger surface area and more air movement."}]},{code:"2.3",title:"Thermal energy transfer",sub:"Conduction, convection and radiation",lessons:["T7","T8","T9"],guide:["Conduction: through solids. Metals are good conductors; plastic, wood, wool and air are insulators.",{s:1,t:"Conduction happens by lattice vibrations, and in metals also by free (delocalised) electrons."},"Convection: in liquids and gases. Warm fluid expands, becomes less dense and rises; cooler, denser fluid sinks.","Thermal radiation is infrared. It needs no medium, so it crosses the vacuum of space.","Dull black surfaces are the best emitters and absorbers. White or shiny surfaces are the worst, and reflect well.",{s:1,t:"An object at constant temperature absorbs and emits radiation at the same rate."}]},{code:"3.1",title:"Wave properties",sub:"Describing waves, v = f\u03bb, reflection, refraction, diffraction",lessons:["W1","W2"],guide:["Waves transfer energy without transferring matter.","Wavelength: crest to next crest. Amplitude: rest position to crest. Frequency: waves per second (Hz).","Wave speed v = f\u03bb.","Transverse: vibrations at 90\xb0 to the direction of travel (light, all EM waves, water waves, S-waves).","Longitudinal: vibrations along the direction of travel (sound, P-waves).","Refraction happens when a wave changes speed. In shallower water, waves slow down and their wavelength shortens.","Diffraction is the spreading of waves through a gap or round an edge.",{s:1,t:"Diffraction is greatest when the gap is about the same size as the wavelength."}]},{code:"3.2",title:"Light",sub:"Mirrors, refraction, lenses and dispersion",lessons:["W3","W4","W5","W6"],guide:["Angles are measured from the normal. Angle of incidence = angle of reflection.","Plane mirror image: same size, same distance behind the mirror, virtual.","Light bends towards the normal entering glass and away from it leaving glass.","Total internal reflection: light inside the denser material hits the surface at more than the critical angle.",{s:1,t:"n = sin i / sin r, and n = 1 / sin c."},"A converging lens brings parallel rays to the principal focus. A ray through the centre goes straight on.",{s:1,t:"Object closer than F: virtual, upright, magnified image (magnifying glass). Short sight: diverging lens. Long sight: converging lens."},"A prism splits white light into red, orange, yellow, green, blue, indigo, violet. Violet bends most."]},{code:"3.3",title:"Electromagnetic spectrum",sub:"Order, uses, dangers and signals",lessons:["W7","W8"],guide:["Order, increasing frequency: radio, microwave, infrared, visible, ultraviolet, X-ray, gamma.","All electromagnetic waves travel at the same speed in a vacuum.",{s:1,t:"That speed is 3.0 \xd7 10\u2078 m/s (about the same in air)."},"Microwaves heat body cells; infrared burns skin; ultraviolet damages skin and eyes; X-rays and gamma cause mutations.","Satellites use microwaves.",{s:1,t:"Digital signals can be regenerated accurately, so they carry more data further than analogue signals."}]},{code:"3.4",title:"Sound",sub:"Sound waves, echoes and ultrasound",lessons:["W9","W10"],guide:["Sound is made by vibrations and travels as a longitudinal wave. It needs a medium.","Human hearing: 20 Hz to 20 000 Hz. Speed of sound in air: 330 to 350 m/s.","Bigger amplitude: louder. Higher frequency: higher pitch.","An echo is a reflected sound. Distance to the wall = speed \xd7 time \xf7 2.","Ultrasound is sound above 20 kHz.",{s:1,t:"Sound travels fastest in solids and slowest in gases."},{s:1,t:"Ultrasound is used for checking materials for cracks, medical scanning and sonar."}]}]}),Object.assign(t,{T1:{name:"States of matter",ex:[{type:"teach",title:"Three states",text:"Matter can be solid, liquid or gas.",svg:{k:"states"},bullets:["Solid: fixed shape and volume. Particles close together in a regular pattern, vibrating about fixed positions.","Liquid: fixed volume, but flows to take the shape of its container. Particles close together but able to move past each other.","Gas: no fixed shape or volume; fills its container. Particles far apart, moving quickly and randomly."]},{type:"match",q:"Match each change of state to its name.",pairs:[["Solid to liquid","Melting"],["Liquid to gas","Boiling"],["Gas to liquid","Condensation"],["Liquid to solid","Solidification (freezing)"]]},{type:"mc",q:"Particles are close together in a regular pattern and vibrate about fixed positions. Which state is this?",options:["Solid","Liquid","Gas","All three"],a:0},{type:"mc",q:"Why can a gas be squashed into a smaller volume, but a liquid can\u2019t?",options:["Gas particles are far apart with lots of space between them","Gas particles are smaller","Liquid particles don\u2019t move","Gases have no mass"],a:0},{type:"teach",title:"Temperature and motion",text:"The higher the temperature, the faster the particles move, on average.",bullets:["At absolute zero, \u2212273 \xb0C, particles have the least kinetic energy they can have.","Nothing can be colder than absolute zero."]},{type:"mc",q:"What is absolute zero?",options:["\u2212273 \xb0C, where particles have the least kinetic energy","0 \xb0C, where water freezes","\u2212100 \xb0C","The temperature of outer space"],a:0},{type:"teach",s:1,title:"Forces between particles",text:"The forces between particles, and how far apart they are, explain the properties of each state.",bullets:["Solids: strong forces hold particles in fixed positions, so the shape is fixed.","Liquids: forces still keep particles close, but particles can slide past each other.","Gases: the forces are tiny because the particles are far apart, so they spread out freely."]},{type:"mc",s:1,q:"Why does a liquid have a fixed volume but no fixed shape?",options:["Forces keep particles close, but particles can move past each other","There are no forces between its particles","Its particles are in a fixed pattern","Its particles are far apart"],a:0}]},T2:{name:"Gas pressure & Brownian motion",ex:[{type:"teach",title:"Where gas pressure comes from",text:"Gas particles move randomly at high speed. When they hit the walls of their container, they exert a force on the walls. That is the gas pressure."},{type:"mc",q:"A sealed can of gas is heated. Why does the pressure increase?",options:["Particles move faster, hitting the walls more often and harder","Particles get bigger","More particles are made","Particles stick to the walls"],a:0},{type:"teach",s:1,title:"Force per unit area",text:"Each collision with a wall gives a tiny force. Billions of collisions every second add up to a steady force on each square metre of wall: force per unit area is pressure."},{type:"teach",title:"Brownian motion",text:"Under a microscope, smoke particles in air jiggle about randomly. You can\u2019t see the air molecules, but they are hitting the smoke particles from all sides.",bullets:["The random motion is evidence for the kinetic particle model.","It is caused by random collisions between the visible particles and the fast-moving particles of the gas or liquid."]},{type:"mc",q:"What causes the random motion of smoke particles seen in a smoke cell?",options:["Random collisions with fast-moving air molecules","Convection currents in the cell","The smoke particles are alive","Light from the lamp pushing them"],a:0},{type:"mc",s:1,q:"In a smoke cell experiment, what are you actually seeing move?",options:["Smoke particles, much bigger than the air molecules","Air molecules","Atoms of oxygen","Electrons"],a:0,why:"Air molecules are far too small to see. Light, fast molecules hitting the much larger smoke particles move them about."},{type:"mc",s:1,q:"Why are the much heavier smoke particles moved by tiny air molecules?",options:["The air molecules move very fast and hit them unevenly from all sides","The air molecules are heavier","The smoke particles have no mass","Gravity is switched off in the cell"],a:0}]},T3:{name:"Gases & the kelvin scale",ex:[{type:"teach",title:"The kelvin scale",text:"The kelvin scale starts at absolute zero. One kelvin is the same size as one degree Celsius.",eq:"T (K) = \u03b8 (\xb0C) + 273"},{type:"num",q:"Convert 27 \xb0C into kelvin.",a:300,unit:"K",work:["T = 27 + 273","= 300 K"]},{type:"num",q:"Convert 100 K into degrees Celsius.",a:-173,unit:"\xb0C",work:["\u03b8 = 100 \u2212 273","= \u2212173 \xb0C"]},{type:"teach",title:"Squash it or heat it",text:"For a fixed mass of gas:",bullets:["Heat it at constant volume: particles move faster and hit the walls more often and harder, so the pressure rises.","Squash it at constant temperature: particles hit the walls more often because they have less space, so the pressure rises."]},{type:"mc",q:"A syringe is sealed and the plunger pushed in slowly, so the temperature stays the same. Why does the pressure increase?",options:["Particles hit the walls more often","Particles move faster","Particles get bigger","There are more particles"],a:0},{type:"teach",s:1,title:"pV = constant",text:"For a fixed mass of gas at constant temperature, pressure \xd7 volume stays the same.",eq:"p\u2081V\u2081 = p\u2082V\u2082",svg:{k:"graph",x:"volume",y:"pressure",xm:10,ym:10,lines:[{p:a(e=>8/e,.85,10)}],noNums:1},bullets:["Halve the volume and the pressure doubles.","A graph of p against 1/V is a straight line through the origin."]},{type:"num",s:1,q:"A gas at 100 kPa has a volume of 30 cm\xb3. It is squashed slowly to 20 cm\xb3. What is its new pressure?",a:150,unit:"kPa",work:["p\u2081V\u2081 = p\u2082V\u2082","100 \xd7 30 = p\u2082 \xd7 20","p\u2082 = 150 kPa"]},{type:"num",s:1,q:"A gas has a volume of 50 cm\xb3 at 200 kPa. What is its volume at 500 kPa, at the same temperature?",a:20,unit:"cm\xb3",work:["V\u2082 = p\u2081V\u2081 \xf7 p\u2082","= 200 \xd7 50 \xf7 500","= 20 cm\xb3"]},{type:"mc",s:1,q:"For a fixed mass of gas at constant temperature, which graph is a straight line through the origin?",options:["Pressure against 1/volume","Pressure against volume","Volume against temperature in \xb0C","Pressure against time"],a:0}]},T4:{name:"Thermal expansion",ex:[{type:"teach",title:"Things get bigger when heated",text:"When solids, liquids and gases are heated (at constant pressure), they expand. The particles move or vibrate more and take up more space. The particles themselves do not get bigger."},{type:"mc",q:"Why does a metal bar get longer when it is heated?",options:["Its particles vibrate more and move further apart","Its particles get bigger","It gains extra particles","Its particles stop moving"],a:0},{type:"teach",title:"Expansion in everyday life",text:"Useful, or a problem to design around:",bullets:["Liquid-in-glass thermometers: the liquid expands up the tube.","Bimetallic strips: two metals expand by different amounts, so the strip bends. Used in thermostats.","Gaps in bridges and railway tracks allow for expansion in hot weather.","Overhead cables hang loosely so they don\u2019t snap when they contract in the cold."]},{type:"mc",q:"Why do bridges have expansion gaps?",options:["So the bridge can expand in hot weather without buckling","To let rain drain away","To make the bridge lighter","To reduce noise"],a:0},{type:"mc",q:"Why are overhead power cables hung slack in summer?",options:["They contract in cold weather and could snap if tight","Slack cables carry more current","To keep birds off them","They expand in cold weather"],a:0},{type:"order",s:1,q:"Order these from least to most expansion for the same temperature rise.",items:["Solid","Liquid","Gas"]},{type:"mc",s:1,q:"Why do gases expand much more than solids?",options:["Gas particles are far apart with very weak forces between them","Gas particles are bigger","Solids have no particles","Gases are always hotter"],a:0,why:"In a solid, strong forces hold the particles close. In a gas, the particles are barely held together at all."}]},T5:{name:"Specific heat capacity",ex:[{type:"teach",title:"Heating raises internal energy",text:"When an object\u2019s temperature rises, its internal energy increases."},{type:"teach",s:1,title:"Specific heat capacity",text:"A temperature rise means the average kinetic energy of the particles has increased. Specific heat capacity is the energy needed per unit mass per unit temperature increase.",eq:"c = \u0394E / (m \xd7 \u0394\u03b8)",bullets:["c in J/(kg \xb0C), \u0394E in J, m in kg, \u0394\u03b8 in \xb0C","Water has a high value: 4200 J/(kg \xb0C). It takes a lot of energy to heat up."]},{type:"num",s:1,q:"How much energy is needed to heat 2.0 kg of water by 30 \xb0C? (c = 4200 J/(kg \xb0C))",a:252e3,unit:"J",work:["\u0394E = mc\u0394\u03b8","= 2.0 \xd7 4200 \xd7 30","= 252 000 J"]},{type:"num",s:1,q:"A 1.5 kg metal block takes in 27 000 J and warms by 20 \xb0C. What is its specific heat capacity?",a:900,unit:"J/(kg \xb0C)",work:["c = \u0394E \xf7 (m\u0394\u03b8)","= 27 000 \xf7 (1.5 \xd7 20)","= 900 J/(kg \xb0C)"]},{type:"num",s:1,q:"0.50 kg of water is given 21 000 J. By how much does its temperature rise? (c = 4200 J/(kg \xb0C))",a:10,unit:"\xb0C",work:["\u0394\u03b8 = \u0394E \xf7 (mc)","= 21 000 \xf7 (0.50 \xd7 4200)","= 10 \xb0C"]},{type:"teach",s:1,title:"Measuring c",text:"Put an electric heater and a thermometer into holes in a metal block of known mass. Wrap the block in insulation.",list:["Record the starting temperature.","Switch on and measure the energy supplied (a joulemeter, or E = IVt).","After a few minutes, switch off and record the highest temperature.","c = \u0394E \xf7 (m\u0394\u03b8)"]},{type:"mc",s:1,q:"Why is the block wrapped in insulation?",options:["To reduce energy lost to the surroundings","To make it heat up more slowly","To protect the thermometer","To increase its mass"],a:0},{type:"mc",s:1,q:"Students usually get a value of c higher than the true value. Why?",options:["Some energy heats the surroundings, so less raises the block\u2019s temperature","The thermometer is too sensitive","The block gains mass","The heater gives out more energy than it is supplied"],a:0}]},T6:{name:"Melting, boiling & evaporation",ex:[{type:"teach",title:"Changing state",text:"While a substance melts or boils, energy goes in but the temperature stays the same. The energy is used to break the forces between particles.",svg:{k:"graph",x:"time",y:"temperature / \xb0C",xm:10,ym:120,ys:20,ymin:-20,lines:[{p:[[0,-20],[1,0],[3,0],[6,100],[9,100],[10,115]]}],marks:[[2,0,"melting"],[7.5,100,"boiling"]],noX:1},bullets:["Water melts at 0 \xb0C and boils at 100 \xb0C at standard atmospheric pressure."]},{type:"mc",q:"On a heating curve, what is happening during a flat section?",options:["The substance is changing state","The heater is switched off","The substance is cooling","Nothing: the temperature is steady"],a:0},{type:"teach",title:"Condensing and solidifying",text:"Going the other way, energy is given out.",bullets:["Condensation: gas particles slow down, move closer together and form a liquid.","Solidification: liquid particles slow down until they settle into fixed positions in a solid."]},{type:"teach",title:"Evaporation",text:"Evaporation happens at the surface of a liquid. The particles with the most energy escape. The particles left behind have less kinetic energy on average, so the liquid cools down."},{type:"mc",q:"Why does sweating cool you down?",options:["The most energetic water particles evaporate, so the sweat left behind cools and takes energy from your skin","Sweat is cold","Sweat reflects sunlight","Sweat stops your skin producing heat"],a:0},{type:"teach",s:1,title:"Boiling vs evaporation",text:"They are different processes.",bullets:["Boiling happens at one temperature (the boiling point), throughout the liquid, with bubbles.","Evaporation happens at any temperature, only at the surface.","Evaporation is faster when it is warmer, the surface area is bigger, or air moves over the surface."]},{type:"multi",s:1,q:"Which of these make a puddle evaporate faster?",options:["A warmer day","A wind blowing over it","The water spreading into a larger, shallower puddle","A cooler day","Covering it with a lid"],correct:[0,1,2],why:"Wind removes the vapour above the surface so more particles can escape."},{type:"mc",s:1,q:"A wet cloth wrapped around a bottle keeps the drink cool. Why?",options:["Water evaporating from the cloth cools it, so energy flows from the bottle into the cloth","The cloth reflects heat","Wet cloth is a perfect insulator","The water freezes"],a:0}]},T7:{name:"Conduction & convection",ex:[{type:"teach",title:"Conductors and insulators",text:"Metals are good thermal conductors. Plastic, wood, wool, glass and air are poor conductors (insulators).",bullets:["Experiment: fix pins with wax along rods of different materials. Heat one end of each equally.","The pins fall off soonest along the best conductor."]},{type:"mc",q:"Why do saucepans have metal bases and plastic handles?",options:["Metal conducts energy to the food; plastic insulates your hand","Metal is lighter than plastic","Plastic conducts better than metal","It is cheaper"],a:0},{type:"teach",s:1,title:"How conduction works",text:"In all solids, particles vibrate more when heated and pass energy on to their neighbours through the lattice.",bullets:["Metals also have free (delocalised) electrons. These move through the metal, carrying energy quickly. That is why metals conduct so well.","Gases and most liquids conduct poorly: their particles are far apart (or not in a lattice), so energy is passed on slowly.","Many solids are in between: better than insulators but worse than metals."]},{type:"mc",s:1,q:"Why are metals better thermal conductors than other solids?",options:["They have free electrons that carry energy through the metal","Their atoms are bigger","They are always hotter","They have no lattice"],a:0},{type:"teach",title:"Convection",text:"Convection happens in liquids and gases.",list:["The fluid near the heat source warms up and expands.","Its density decreases, so it rises.","Cooler, denser fluid sinks to take its place.","This sets up a convection current."],bullets:["Demonstration: drop a purple potassium manganate(VII) crystal into water and heat near it. The colour shows the current rising and circling."]},{type:"order",q:"Put the steps of a convection current in order.",items:["Water near the heater is warmed","It expands and becomes less dense","The warm water rises","Cooler, denser water sinks to replace it","The cooler water is warmed and the cycle repeats"]},{type:"mc",q:"Why is the cooling unit at the top of a fridge?",options:["Cooled air becomes denser and sinks, setting up a convection current","Cold air rises","It is easier to reach","Conduction works best at the top"],a:0},{type:"mc",q:"Why can\u2019t convection happen in a solid?",options:["The particles can\u2019t move from place to place","Solids don\u2019t expand","Solids have no particles","Solids are always cold"],a:0}]},T8:{name:"Thermal radiation",ex:[{type:"teach",title:"Infrared radiation",text:"Thermal radiation is infrared radiation, an electromagnetic wave. All objects give it out.",bullets:["It needs no medium: it can travel through a vacuum.","Energy reaches us from the Sun only by radiation, because space is a vacuum.","Hotter surfaces, and larger surface areas, emit radiation faster."]},{type:"teach",title:"Surfaces",text:"Colour and texture affect radiation.",bullets:["Dull black surfaces are the best emitters and the best absorbers.","White and shiny surfaces are poor emitters and poor absorbers, but good reflectors."]},{type:"mc",q:"Four identical cans hold hot water. Which cools fastest?",options:["Dull black","Shiny silver","Shiny white","Dull white"],a:0},{type:"mc",q:"Why can energy from the Sun only reach the Earth by radiation?",options:["Space is a vacuum, and conduction and convection need particles","The Sun is too hot for conduction","Convection only works downwards","Radiation is the fastest"],a:0},{type:"teach",title:"Testing emitters and absorbers",text:"Two classic experiments:",bullets:["Emitters: fill a Leslie cube (faces painted differently) with hot water. Hold an infrared detector the same distance from each face. The dull black face gives the highest reading.","Absorbers: stick pins with wax to the back of a dull black plate and a shiny plate. Put a heater halfway between. The wax on the black plate melts first."]},{type:"mc",q:"In the Leslie cube experiment, what must be kept the same for a fair test?",options:["The distance from the detector to each face","The colour of each face","The time of day","The size of the room"],a:0},{type:"teach",s:1,title:"Balancing in and out",text:"An object at constant temperature is absorbing and emitting energy at the same rate.",bullets:["Absorbing faster than emitting: its temperature rises.","Emitting faster than absorbing: its temperature falls.","The Earth\u2019s temperature depends on the balance between radiation arriving from the Sun and infrared radiation emitted into space. Greenhouse gases reduce the energy escaping, so the balance happens at a higher temperature."]},{type:"mc",s:1,q:"A rock in the sun stays at a steady temperature. What does this tell you?",options:["It absorbs and emits radiation at the same rate","It is not absorbing any radiation","It is not emitting any radiation","It is a perfect reflector"],a:0}]},T9:{name:"Heat transfer in action",ex:[{type:"teach",title:"Everyday examples",text:"Most real situations involve more than one method.",bullets:["Cooking: the metal pan conducts energy from the hob to the food.","Heating a room: a heater warms the air near it, which rises, and cooler air sinks to replace it (convection)."]},{type:"teach",title:"The vacuum flask",text:"A vacuum flask keeps drinks hot (or cold) by reducing all three transfers.",bullets:["The vacuum between the walls stops conduction and convection.","Silvered surfaces reflect infrared, reducing radiation.","The stopper reduces convection and evaporation from the top."]},{type:"match",q:"Match each part of a vacuum flask to what it reduces.",pairs:[["Vacuum gap","Conduction and convection"],["Silvered walls","Radiation"],["Plastic stopper","Evaporation and convection out of the top"]]},{type:"mc",q:"Why do homes have loft insulation made of fibres?",options:["It traps air, which is a poor conductor, and stops convection","The fibres reflect radiation","The fibres conduct heat away quickly","It makes the loft lighter"],a:0},{type:"teach",s:1,title:"A fire and a car radiator",text:"Complex examples use all three:",bullets:["A coal or wood fire: radiation from the flames warms the room; hot gases rise up the chimney by convection, drawing in fresh air; the grate and surroundings are heated by conduction.","A car radiator: hot coolant flows through thin metal tubes; energy is conducted through the metal to many thin fins; air flowing past carries the energy away by convection. The large surface area speeds it all up."]},{type:"mc",s:1,q:"Why does a car radiator have many thin metal fins?",options:["They give a large surface area, so energy transfers to the air faster","They make the radiator heavier","They stop air flowing","They insulate the engine"],a:0},{type:"mc",s:1,q:"In an open fire, how does fresh air get drawn in at the bottom?",options:["Hot gases rise up the chimney by convection, and cooler air flows in to replace them","The fire pushes air out","Radiation pulls air in","Conduction through the bricks"],a:0}]},W1:{name:"Describing waves",ex:[{type:"teach",title:"What a wave does",text:"Waves transfer energy from place to place without transferring matter.",bullets:["You can see this with a rope, a slinky spring, or water waves in a ripple tank.","A floating cork bobs up and down as waves pass, but does not travel with them."]},{type:"teach",title:"Parts of a wave",text:"Learn these words exactly.",svg:{k:"wave",lab:1},bullets:["Crest: the top of a wave. Trough: the bottom.","Wavelength (\u03bb): the distance from one crest to the next.","Amplitude: the distance from the rest position to a crest.","Frequency: the number of waves per second, in hertz (Hz).","Wavefront: a line joining matching points, such as all the crests."]},{type:"mc",q:"Which arrow shows the wavelength?",svg:{k:"wave",pqr:1},options:["Q","P","R","None of them"],a:0,why:"Wavelength is one complete wave: crest to crest. P is the amplitude; R is crest to trough, which is twice the amplitude."},{type:"mc",q:"Which arrow shows the amplitude?",svg:{k:"wave",pqr:1},options:["P","Q","R","None of them"],a:0,why:"Amplitude is measured from the rest position (the middle line) to a crest."},{type:"teach",title:"Transverse and longitudinal",text:"Two kinds of wave.",svg:{k:"long"},bullets:["Transverse: the vibrations are at right angles to the direction the wave travels. Examples: light and all electromagnetic waves, water waves, seismic S-waves.","Longitudinal: the vibrations are along the direction the wave travels. Examples: sound, seismic P-waves."]},{type:"multi",q:"Which of these are transverse waves?",options:["Light","Sound","Water ripples","Seismic P-waves","Seismic S-waves","Radio waves"],correct:[0,2,4,5],why:"Sound and P-waves are longitudinal. All electromagnetic waves (light, radio) are transverse."},{type:"mc",q:"A cork floats on a pond as waves pass. What does it do?",options:["Bobs up and down in roughly the same place","Travels along with the waves","Sinks","Moves away from the waves"],a:0,why:"The wave carries energy, not the water (or the cork) itself."},{type:"mc",q:"What is the frequency of a wave?",options:["The number of waves passing a point each second","The distance between crests","The height of a crest","The speed of the wave"],a:0}]},W2:{name:"Wave speed & behaviour",ex:[{type:"teach",title:"The wave equation",text:"Wave speed = frequency \xd7 wavelength.",eq:"v = f \xd7 \u03bb",bullets:["v in m/s, f in Hz, \u03bb in m"]},{type:"num",q:"A water wave has frequency 5.0 Hz and wavelength 0.20 m. What is its speed?",a:1,unit:"m/s",work:["v = f\u03bb","= 5.0 \xd7 0.20","= 1.0 m/s"]},{type:"num",q:"A sound wave in air travels at 340 m/s with frequency 680 Hz. What is its wavelength?",a:.5,unit:"m",work:["\u03bb = v \xf7 f","= 340 \xf7 680","= 0.50 m"]},{type:"num",q:"A radio wave travels at 3.0 \xd7 10\u2078 m/s and has a wavelength of 1500 m. What is its frequency, in Hz?",a:2e5,unit:"Hz",work:["f = v \xf7 \u03bb","= 3.0 \xd7 10\u2078 \xf7 1500","= 2.0 \xd7 10\u2075 Hz"],why:"You can type 2e5 or 200000."},{type:"teach",title:"Reflection, refraction and diffraction",text:"All waves can:",bullets:["reflect off a flat (plane) surface","refract: change direction because they change speed. In a ripple tank, waves slow down over shallow water, so their wavelength gets shorter","diffract: spread out through a gap or around an edge"],svg:{k:"gap",w:"n"}},{type:"mc",q:"Water waves pass from deep water into shallow water. What happens?",options:["They slow down and their wavelength decreases","They speed up and their wavelength increases","Their frequency changes","They stop"],a:0,why:"The frequency stays the same, so if speed drops, wavelength must drop too (v = f\u03bb)."},{type:"mc",q:"Which property of a wave never changes when it refracts?",options:["Frequency","Speed","Wavelength","Direction"],a:0},{type:"teach",s:1,title:"How much does it spread?",text:"Diffraction depends on the wavelength and the size of the gap.",svg:{k:"gap",w:"w"},bullets:["The most spreading happens when the gap is about the same size as the wavelength.","A gap much wider than the wavelength: only a little spreading at the edges.","At an edge, longer wavelengths diffract more."]},{type:"mc",s:1,q:"Why can you hear someone around a corner but not see them?",options:["Sound has a wavelength similar to a doorway, so it diffracts a lot; light\u2019s wavelength is tiny","Sound is faster than light","Light can\u2019t go round corners because it is a particle","Sound reflects but light doesn\u2019t"],a:0}]},W3:{name:"Reflection",ex:[{type:"teach",title:"Angles from the normal",text:"The normal is a line at 90\xb0 to the surface where the ray hits it. Angles are always measured from the normal.",svg:{k:"mirror",i:40},bullets:["Angle of incidence (i): between the incoming ray and the normal.","Angle of reflection (r): between the reflected ray and the normal.","Law of reflection: angle of incidence = angle of reflection."]},{type:"num",q:"A ray hits a plane mirror with an angle of incidence of 35\xb0. What is the angle of reflection?",a:35,unit:"\xb0",tol:.5,work:["i = r","r = 35\xb0"]},{type:"num",q:"A ray hits a mirror at 30\xb0 to the mirror\u2019s surface. What is the angle of incidence?",a:60,unit:"\xb0",tol:.5,work:["The normal is at 90\xb0 to the surface.","i = 90\xb0 \u2212 30\xb0 = 60\xb0"],why:"Always measure from the normal, not from the mirror."},{type:"teach",title:"Images in a plane mirror",text:"The image in a flat mirror is:",bullets:["the same size as the object","the same distance behind the mirror as the object is in front","virtual: the light only seems to come from it, so it can\u2019t be caught on a screen"]},{type:"num",q:"You stand 40 cm in front of a plane mirror. How far are you from your image?",a:80,unit:"cm",work:["The image is 40 cm behind the mirror.","40 + 40 = 80 cm"]},{type:"mc",q:"What is a virtual image?",options:["An image that rays only appear to come from; it can\u2019t be formed on a screen","An image that is upside down","An image smaller than the object","An image formed on a screen"],a:0},{type:"teach",s:1,title:"Constructing the image",text:"To find the image by drawing: draw two rays from the object to the mirror, reflect each using i = r, then extend the reflected rays backwards (as dashed lines) behind the mirror. The image is where they meet."},{type:"mc",s:1,q:"In a ray diagram for a plane mirror, why are the lines behind the mirror drawn dashed?",options:["No light actually travels there; the image is virtual","They show the normal","They show weaker light","They are construction lines for the angle"],a:0}]},W4:{name:"Refraction & TIR",ex:[{type:"teach",title:"Refraction of light",text:"Light changes speed when it goes from one material into another. If it enters at an angle, it change
